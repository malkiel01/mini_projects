<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>שרטוטים בתלת מימד</title>
<meta name="description" content="כלי לשרטוט ולצפייה במודלים תלת־ממדיים. השלד עלה לאוויר; האפיון בדרך.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<header class="bar">
  <h1 class="bar__title">שרטוטים בתלת מימד</h1>
  <a class="btn btn--ghost" href="../index.html">חזרה לכלים</a>
</header>

<main class="stage">
  <!-- הקנבס אינו הכלי. הוא ההוכחה שהתיקייה חיה ושהנכסים נטענים
       מהשרת — לפני שיש אפיון שאפשר לממש לפיו. -->
  <canvas id="stage" class="stage__canvas" aria-label="קובייה מסתובבת, תצוגה מקדימה"></canvas>

  <section class="note" role="status">
    <h2>השלד עומד. האפיון בדרך.</h2>
    <p>
      התיקייה, הנכסים והכרטיס בדף הכלים נוצרו ונפרסו — כך שכל מה שייכתב כאן
      מהיום יעלה לשרת באותו מסלול כמו שאר הכלים.
    </p>
    <p class="note__muted">
      מה שמסתובב למעלה הוא ציור קווים על <code>&lt;canvas&gt;</code> בלי שום ספרייה —
      מציין מקום, לא המנוע. המנוע ייקבע לפי האפיון.
    </p>
  </section>
</main>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
