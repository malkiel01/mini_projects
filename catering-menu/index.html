<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#27282a">
    <title>ניחוחות — תפריט קייטרינג</title>
    <meta name="description" content="ניחוחות — קייטרינג בטעם של בית. בוחרים מנות ושולחים הזמנה.">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Heebo:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<!--
    התפריט הציבורי. בכוונה אין כאן שום קישור החוצה — לא לממשק המנהל ולא לדף
    הכלים הראשי: לקוח שקיבל את הקישור רואה רק את התפריט.
-->
<body class="public">
    <header class="brand">
        <img class="brand-logo" src="assets/logo.jpg" alt="ניחוחות — קייטרינג בטעם של בית" width="900" height="450">
        <p class="brand-contact" id="contact"></p>
    </header>

    <nav class="cat-nav" id="catNav" aria-label="קטגוריות"></nav>

    <main class="menu" id="menu">
        <p class="loading">טוען את התפריט…</p>
    </main>

    <p class="extra-note" id="extraNote" hidden></p>

    <div class="order-bar" id="orderBar" hidden>
        <span class="order-bar-count" id="orderCount"></span>
        <button type="button" class="btn btn-gold" id="openOrder">להזמנה ←</button>
    </div>

    <!-- טופס ההזמנה -->
    <dialog class="sheet" id="orderSheet" aria-labelledby="sheetTitle">
        <form class="sheet-body" id="orderForm" novalidate>
            <header class="sheet-head">
                <h2 id="sheetTitle">סיכום ההזמנה</h2>
                <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
            </header>

            <div class="summary" id="summary"></div>

            <fieldset class="fields">
                <label>שם מלא *
                    <input name="name" autocomplete="name" required maxlength="80">
                </label>
                <label>טלפון *
                    <input name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="30" dir="ltr">
                </label>
                <div class="row-2">
                    <label>תאריך האירוע
                        <input name="deliveryDate" type="date">
                    </label>
                    <label>שעה
                        <input name="deliveryTime" type="time">
                    </label>
                </div>
                <label>מספר סועדים
                    <input name="guests" type="number" inputmode="numeric" min="1" max="100000">
                </label>
                <label>הערות
                    <textarea name="notes" rows="3" maxlength="2000" placeholder="אלרגיות, כתובת למשלוח, בקשות מיוחדות…"></textarea>
                </label>
                <!-- מלכודת לבוטים: שדה שאדם לא רואה ולא ממלא -->
                <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            </fieldset>

            <p class="form-error" id="formError" role="alert" hidden></p>

            <footer class="sheet-foot">
                <button type="submit" class="btn btn-gold btn-wide" id="submitOrder">שליחת ההזמנה</button>
            </footer>
        </form>
    </dialog>

    <!-- אישור -->
    <dialog class="sheet" id="doneSheet" aria-labelledby="doneTitle">
        <div class="sheet-body done">
            <div class="done-mark" aria-hidden="true">✓</div>
            <h2 id="doneTitle">ההזמנה התקבלה!</h2>
            <p id="doneText"></p>
            <a class="btn btn-whatsapp btn-wide" id="doneWhatsapp" target="_blank" rel="noopener">שליחת ההזמנה גם בוואטסאפ</a>
            <button type="button" class="btn btn-ghost btn-wide" id="newOrder">הזמנה חדשה</button>
        </div>
    </dialog>

    <script src="assets/js/app.js"></script>
</body>
</html>
