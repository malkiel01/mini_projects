<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>אפליקציית מתכונים</title>
<meta name="description" content="אפליקציה לניהול מתכונים — כתיבה, חיפוש ובישול לפי שלבים. השלד עלה לאוויר; האפיון בדרך.">
<meta name="theme-color" content="#1a1207">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<header class="bar">
  <h1 class="bar__title">אפליקציית מתכונים</h1>
  <a class="btn btn--ghost" href="../index.html">חזרה לכלים</a>
</header>

<main class="stage">
  <!-- הקנבס אינו האפליקציה. הוא ההוכחה שהתיקייה חיה ושהנכסים נטענים
       מהשרת — לפני שהאפיון נכנס לכאן. -->
  <canvas id="stage" class="stage__canvas" aria-label="סיר על אש עם אדים, תצוגה מקדימה"></canvas>

  <section class="note" role="status">
    <h2>התיקייה מוכנה. האפליקציה תיכנס לכאן.</h2>
    <p>
      התיקייה, הנכסים והכרטיס בדף הכלים נוצרו ונפרסו — כך שברגע שהאפיון יוכרע,
      הקוד ייכנס לאותו מסלול שכבר עולה לשרת, בלי הגדרה נוספת.
    </p>
    <p class="note__muted">
      מה שמתבשל למעלה הוא ציור קווים על <code>&lt;canvas&gt;</code> בלי שום ספרייה —
      מציין מקום ולא תכולה. הוא מיועד להימחק.
    </p>
  </section>
</main>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
