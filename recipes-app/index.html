<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>אפליקציית מתכונים</title>
<meta name="description" content="מתכונים פרטיים וציבוריים — חלקים, רכיבים, שלבים, חיפוש ורשימת קניות.">
<meta name="theme-color" content="#0f8a4f">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מתכונים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./assets/css/app.css?v=2026-10-09h">
</head>
<body>

<header class="bar">
  <h1 class="bar__title">מתכונים</h1>
  <div class="bar__side">
    <span id="who" class="who" hidden></span>
    <details id="menu" class="menu" hidden>
      <summary class="btn btn--ghost" aria-label="תפריט">☰</summary>
      <!-- התפריט בקבוצות, והרשימה נגללת בתוך עצמה: הסרגל דביק (sticky), כך
           שגלילת הדף לא מזיזה אותו, ובטלפון התפריט ארוך מגובה המסך. -->
      <nav class="menu__list">
        <div class="menu__group">
          <a href="#/">המתכונים</a>
          <a href="#/favorites">המועדפים שלי</a>
        </div>
        <div class="menu__group">
          <span class="menu__label">מתכונים חדשים</span>
          <a href="#/web">חיפוש מתכונים ברשת</a>
          <a href="#/import">ייבוא מקישור</a>
        </div>
        <div class="menu__group">
          <span class="menu__label">במטבח</span>
          <a href="#/shopping">רשימות קניות</a>
          <a href="#/pantry">מה יש לי בבית</a>
        </div>
        <div class="menu__group">
          <span class="menu__label">החשבון שלי</span>
          <a href="#/settings">הגדרות פרטיות</a>
        </div>
        <div class="menu__group" data-dev hidden>
          <span class="menu__label">ניהול</span>
          <a href="#/settings/public">הגדרות ציבוריות</a>
          <a href="#/settings/users">ניהול משתמשים</a>
          <a href="#/logs">יומן</a>
        </div>
        <div class="menu__group" data-dev hidden>
          <span class="menu__label">כלי פיתוח</span>
          <a href="#/scout">סורק אתרים</a>
          <a href="#/index">אינדקס חיפוש</a>
          <a href="#/rewrite">ניסוח ידני</a>
          <a href="#/diag">אזור פיתוח</a>
        </div>
        <button id="logout" type="button">יציאה</button>
      </nav>
    </details>
  </div>
</header>

<!-- מסך אורח: כניסה והרשמה. שני טפסים באותו כרטיס, כי בטלפון מסך
     נפרד לכל אחד הוא ניווט מיותר. -->
<main id="guest" class="centered" hidden>
  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab is-on" data-pane="login"    role="tab" type="button">כניסה</button>
      <button class="tab"       data-pane="register" role="tab" type="button">הרשמה</button>
    </div>

    <form id="login-form" class="form pane" data-pane="login">
      <label>שם משתמש או דוא"ל
        <input name="username" required autocomplete="username" autocapitalize="off">
      </label>
      <label>סיסמה
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button class="btn btn--primary" type="submit">כניסה</button>
      <button id="forgot" class="link" type="button">שכחתי סיסמה</button>
    </form>

    <form id="register-form" class="form pane" data-pane="register" hidden>
      <label>שם משתמש
        <input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]{3,32}"
               autocomplete="username" autocapitalize="off">
        <small class="muted">אותיות לועזיות, ספרות, נקודה, מקף או קו תחתון</small>
      </label>
      <label>שם לתצוגה <small class="muted">(לא חובה)</small>
        <input name="display_name" maxlength="60" autocomplete="nickname">
      </label>
      <label>דוא"ל
        <input name="email" type="email" required autocomplete="email" autocapitalize="off">
        <small class="muted">נדרש לאימות החשבון ולאיפוס סיסמה</small>
      </label>
      <label>סיסמה
        <input name="password" type="password" required minlength="8" autocomplete="new-password">
        <small class="muted">8 תווים לפחות</small>
      </label>
      <button class="btn btn--primary" type="submit">הרשמה</button>
    </form>

    <form id="forgot-form" class="form pane" data-pane="forgot" hidden>
      <label>הדוא"ל שאיתו נרשמת
        <input name="email" type="email" required autocomplete="email" autocapitalize="off">
      </label>
      <button class="btn btn--primary" type="submit">שלח קישור לאיפוס</button>
      <button class="link" type="button" data-goto="login">חזרה לכניסה</button>
    </form>

    <p id="guest-msg" class="note" hidden></p>
  </section>
</main>

<!-- מסך מחובר. התוכן מצויר ב-app.js לפי ה-hash: רשימה, מתכון, עורך, אבחון. -->
<main id="app" class="stage" hidden>
  <div id="view" class="view"></div>
</main>

<script type="module" src="./assets/js/app.js?v=2026-10-09h"></script>
</body>
</html>
