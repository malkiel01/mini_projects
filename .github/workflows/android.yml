name: Build Android APK

# אפליקציית הילד של מגדלור (guarded-browser/android). SPEC: guarded-browser/SPEC.md.
#
# הבנייה כאן ולא מקומית מפני שסביבת הפיתוח חסומה לרשת חיצונית,
# ו-Gradle חייב להוריד את ה-SDK ואת התלויות.
#
# חתימה קבועה — כדי שהעדכונים יותקנו מעל הגרסה הקודמת (חתימת debug משתנה בכל בנייה, ואז אנדרואיד
# מסרב לעדכן). המפתח נוצר בבנייה הראשונה מ-main, מוצפן (AES-256) ונשמר בריפו:
# guarded-browser/android/keystore/release.jks.enc. סיסמת ההצפנה נגזרת מהסוד DEPLOY_SSH_KEY שכבר קיים
# (לא נדרש סוד חדש), ואינה מודפסת. מוצפן — חסר ערך בלי הסוד. זו אותה שיטה כמו ב-project-manager-apk.yml.
# המפתח חייב להישאר סודי: מי שמחזיק בו יכול לבנות "עדכון" שמותקן מעל מגדלור במכשיר של ילד.
# אם DEPLOY_SSH_KEY הוחלף — הפענוח נכשל והבנייה עוצרת. אז: למחוק את release.jks.enc, ובנייה חדשה
# תיצור מפתח חדש; בכל מכשיר צריך להסיר את האפליקציה פעם אחת ולהתקין מחדש.
#
# בנייה מ-PR — רק בדיקות ובדיקה שהקוד נבנה (חתימת debug, artifact). רק מ-main — Release עם קישור קבוע:
# https://github.com/malkiel01/mini_projects/releases/download/guarded-browser-apk/migdalor.apk

on:
  push:
    branches: [main]
    paths:
      - 'guarded-browser/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'guarded-browser/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      apiBase:
        description: 'כתובת השרת שאליה האפליקציה תפנה'
        required: false
        default: 'https://mbe-plus.com/mini_projects/guarded-browser/'

concurrency:
  group: guarded-browser-apk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: guarded-browser/android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # המפתח המוצפן (בבנייה הראשונה) ו-Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ‏packages במפורש: ברירת המחדל מתקינה גם את 'tools', שהוסרה ממאגר ה-SDK ומפילה את השלב.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # הבדיקות רצות לפני הבנייה: מנוע האכיפה המקומי חייב להכריע
      # בדיוק כמו זה שבשרת, ורגרסיה כאן שקולה לפרצה.
      - name: Unit tests (local policy engine)
        run: gradle test --no-daemon

      - name: Signing key (main only)
        id: key
        if: github.ref == 'refs/heads/main'
        env:
          SEED: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SEED:-}" ]; then echo "::warning::אין DEPLOY_SSH_KEY — APK בחתימת debug"; exit 0; fi
          export PASS=$(printf 'migdalor-android:%s' "$SEED" | sha256sum | cut -c1-48)
          echo "::add-mask::$PASS"
          mkdir -p keystore
          if [ -f keystore/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in keystore/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
              || { echo "::error::פענוח המפתח נכשל — DEPLOY_SSH_KEY הוחלף? ראו את ההסבר בראש הקובץ"; exit 1; }
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias mg -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Migdalor, O=mbe-plus, C=IL"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -in "$RUNNER_TEMP/release.jks" -out keystore/release.jks.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks.enc
            git commit -m "מגדלור — אנדרואיד: מפתח החתימה (מוצפן)"
            git pull --rebase origin main && git push origin HEAD:main
          fi
          echo "PASS=$PASS" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build APK
        env:
          API_BASE: ${{ github.event.inputs.apiBase || 'https://mbe-plus.com/mini_projects/guarded-browser/' }}
        run: |
          set -euo pipefail
          ARGS="-PversionCode=${{ github.run_number }} -PapiBase=$API_BASE"
          if [ "${{ steps.key.outputs.signed }}" = "1" ]; then ARGS="$ARGS -PkeystoreFile=$RUNNER_TEMP/release.jks -PkeystorePassword=$PASS"; fi
          gradle assembleRelease --no-daemon $ARGS
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/migdalor.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: migdalor-apk
          path: ${{ runner.temp }}/migdalor.apk
          if-no-files-found: error

      # ‏Artifact של Actions אינו ניתן להורדה מהטלפון. ל-Release יש קישור הורדה ישיר — והוא הקישור
      # שבכרטיס של הכלי בדף הראשי (install.apk ב-app.json). התג נייח ומתעדכן בכל בנייה, כך שהקישור
      # תמיד מצביע ל-APK האחרון. רק מ-main ורק חתום: בנייה אחרת לא מחליפה את מה שמשתמשים מורידים.
      - name: Publish APK to a GitHub Release (mobile-friendly)
        if: github.ref == 'refs/heads/main' && steps.key.outputs.signed == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guarded-browser-apk
          name: מגדלור — אפליקציית הילד
          body: |
            אפליקציית הילד של מגדלור, בחתימה קבועה — כל גרסה מותקנת מעל הקודמת.
            מתעדכנת אוטומטית בכל בנייה מ-main. גרסה 1.${{ github.run_number }}.
          files: ${{ runner.temp }}/migdalor.apk
          fail_on_unmatched_files: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: guarded-browser/android/app/build/reports/tests/
