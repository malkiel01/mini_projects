name: Build Android APK

# בונה את האפליקציה ומעלה אותה כ-artifact.
#
# הבנייה כאן ולא מקומית מפני שסביבת הפיתוח חסומה לרשת חיצונית,
# ו-Gradle חייב להוריד את ה-SDK ואת התלויות.
#
# ה-APK יוצא חתום בחתימת debug: מספיק להתקנה ידנית (sideload) בטלפון,
# ולא מספיק לחנות. חתימת release דורשת keystore שאין להחזיק בריפו.

on:
  push:
    paths:
      - 'guarded-browser/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      apiBase:
        description: 'כתובת השרת שאליה האפליקציה תפנה'
        required: false
        default: 'https://mbe-plus.com/mini_projects/guarded-browser/'

defaults:
  run:
    working-directory: guarded-browser/android

jobs:
  build:
    runs-on: ubuntu-latest
    # נדרש כדי לפרסם את ה-APK כ-Release (ראו השלב האחרון).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ‏אותה סיבה כמו ב-greeting-cards-apk.yml: החבילה 'tools'
      # שבברירת המחדל הוסרה ממאגר ה-SDK ומפילה את השלב.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # הריפו אינו מכיל gradle-wrapper.jar (בינארי), ולכן ה-wrapper
      # נוצר כאן מהגרסה שב-gradle-wrapper.properties.
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # הבדיקות רצות לפני הבנייה: מנוע האכיפה המקומי חייב להכריע
      # בדיוק כמו זה שבשרת, ורגרסיה כאן שקולה לפרצה.
      - name: Unit tests (local policy engine)
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
             -PapiBase="${{ github.event.inputs.apiBase || 'https://mbe-plus.com/mini_projects/guarded-browser/' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guarded-browser-apk
          path: guarded-browser/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ‏Artifact של Actions אינו ניתן להורדה מהטלפון. ל-Release יש קישור הורדה
      # ישיר — והוא הקישור שבכרטיס של הכלי בדף הראשי ("⬇️ הורדת APK", ב-app.json).
      # התג נייח ומתעדכן בכל בנייה, כך שהקישור תמיד מצביע ל-APK האחרון. רק מ-main:
      # בנייה מענף אחר לא מחליפה את מה שהמשתמשים מורידים.
      - name: Publish APK to a GitHub Release (mobile-friendly)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guarded-browser-apk
          name: דפדפן מנוהל — APK (debug)
          body: |
            APK בחתימת debug להתקנה ידנית בטלפון (sideload).
            מתעדכן אוטומטית בכל בנייה מ-main.
          files: guarded-browser/android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: guarded-browser/android/app/build/reports/tests/
