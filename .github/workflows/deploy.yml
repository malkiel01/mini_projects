name: Deploy to production

# פריסה אוטומטית git -> שרת. מופעלת בכל push לענף שממנו האתר מוגש,
# ובהפעלה ידנית. מעלה קוד בלבד ב-rsync — לא נוגעת בנתוני הריצה שבשרת
# (data/ של git-deploy, renovation-punchlist ו-carpentry-3d מכילות אסימונים, הגדרות
# ומדיה שהמשתמשים העלו; camera-app/data/ מכילה את ההקלטות ואת תיבת ה-FTP
# שהמצלמות מעלות אליה).
#
# rsync רץ בלי --delete בכוונה: קבצים שקיימים רק בשרת נשארים במקומם.
#
# Secrets נדרשים ב-Settings → Secrets and variables → Actions:
#   DEPLOY_SSH_KEY         מפתח SSH פרטי בעל גישה לשרת
#   DEPLOY_SSH_PASSPHRASE  אופציונלי. נדרש רק אם המפתח נעול בסיסמה
#                          (שורת Proc-Type: 4,ENCRYPTED בראש הקובץ).
#                          למפתח פתוח — להשמיט, והשלב מדלג על עצמו.
#   DEPLOY_HOST     כתובת השרת
#   DEPLOY_USER     שם המשתמש בשרת
#   DEPLOY_PATH     הנתיב לתיקיית האתר, למשל /home2/<user>/public_html/mini_projects

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# לעולם לא שתי פריסות במקביל.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 (matches the server)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax-check gate (abort deploy on any parse error)
        run: |
          set -euo pipefail
          ERR=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || ERR=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          if [ "$ERR" -ne 0 ]; then echo "::error::PHP syntax errors — aborting deploy"; exit 1; fi
          echo "PHP lint OK"

      - name: JS syntax-check gate
        run: |
          set -euo pipefail
          ERR=0
          while IFS= read -r -d '' f; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "::error file=$f::syntax error"; ERR=1; }
          done < <(find . \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path '*/vendor/*' -print0)
          if [ "$ERR" -ne 0 ]; then echo "::error::JS syntax errors — aborting deploy"; exit 1; fi
          echo "JS lint OK"

      # הדף הראשי נבנה מ-app.json שבכל תיקיית כלי. רישום פגום היה מעלים את
      # הכלי מהדף בשקט — לכן הוא עוצר את הפריסה כאן, עם שם הקובץ והבעיה.
      - name: App registry gate (every app.json must be valid)
        run: php platform/check-apps.php

      # DevLoop: מודול משותף (devloop/src) שמועתק לכל אפליקציה שמשתמשת בו (devloop/apps.json).
      # עותק ששונה בתוך אפליקציה — נעצר כאן: עורכים במקור ומריצים php devloop/tools/sync.php.
      - name: DevLoop gate (every copy matches devloop/src)
        run: php devloop/tools/sync.php --check

      # ליבת ‎.mbe (creative-suite/mbe-core/src) — מועתקת לאפליקציות שב-creative-suite/mbe-core/apps.json.
      # עותק ששונה בתוך אפליקציה, או schemas.* שלא נבנו מ-schema/ — נעצר כאן. עורכים במקור ומריצים sync.php.
      - name: mbe-core gate (every copy matches creative-suite/mbe-core/src)
        run: php creative-suite/mbe-core/tools/sync.php --check

      # הבדיקות של הליבה עצמה (קו הגמר, finish-line.md): PHP, JS, ובין השפות (node קורא ל-PHP דרך tests/cli.php).
      # בדיקה שנכשלת — עוצרת את הפריסה, כמו עותק ששונה. ‎~10 שניות.
      - name: mbe-core tests (PHP + JS + cross-language)
        run: |
          php creative-suite/mbe-core/tests/run.php
          node --test creative-suite/mbe-core/tests/js.test.mjs creative-suite/mbe-core/tests/handoff.test.mjs

      # מנוע ה-PDF המשותף (creative-suite/pdf-core/src/php) — מועתק לאפליקציות שב-creative-suite/pdf-core/apps.json.
      # עותק ששונה בתוך אפליקציה — נעצר כאן. עורכים במקור ומריצים sync.php.
      - name: pdf-core gate (every copy matches creative-suite/pdf-core/src)
        run: php creative-suite/pdf-core/tools/sync.php --check

      # מנוע הגאומטריה המשותף (creative-suite/geometry-core/src/js) — מועתק לאפליקציות שב-creative-suite/geometry-core/apps.json.
      # עותק ששונה בתוך אפליקציה — נעצר כאן. עורכים במקור ומריצים sync.php. והבדיקות של המודול עצמו.
      - name: geometry-core gate (every copy matches creative-suite/geometry-core/src, tests pass)
        run: |
          php creative-suite/geometry-core/tools/sync.php --check
          node --test creative-suite/geometry-core/tests/*.test.mjs

      # הרכבת השכבות המשותפת (creative-suite/render-core/src/js) — מצבי מיזוג (JS / GLSL / WGSL), sRGB ↔ לינארי, מרכיב
      # במעבד, בחירת מנוע ותקציב זיכרון. מועתק לאפליקציות שב-creative-suite/render-core/apps.json. עותק ששונה — נעצר כאן.
      - name: render-core gate + tests (every copy matches creative-suite/render-core/src)
        run: |
          php creative-suite/render-core/tools/sync.php --check
          node --test creative-suite/render-core/tests/*.test.mjs

      # קריאה וכתיבה של קובצי תמונה (creative-suite/image-io/src/js) — PNG (+ "פנים"), TIFF, PSD, ZIP, ORA, זיהוי סוג וקידוד
      # בדפדפן. מועתק לאפליקציות שב-creative-suite/image-io/apps.json. עותק ששונה בתוך אפליקציה — נעצר כאן.
      - name: image-io gate + tests (every copy matches creative-suite/image-io/src)
        run: |
          php creative-suite/image-io/tools/sync.php --check
          node --test creative-suite/image-io/tests/*.test.mjs

      # עיצוב הטקסט המשותף (creative-suite/text-core/src/js) — HarfBuzz + bidi, מדידה וקווי מתאר. מועתק לאפליקציות שב-
      # creative-suite/text-core/apps.json. עותק ששונה בתוך אפליקציה — נעצר כאן. עורכים במקור ומריצים sync.php.
      - name: text-core gate + tests (every copy matches creative-suite/text-core/src)
        run: |
          php creative-suite/text-core/tools/sync.php --check
          node --test creative-suite/text-core/tests/*.test.mjs

      # מודול הכוננים של ענן MBE (mbe-cloud/drives/src) — מועתק לאפליקציות שב-mbe-cloud/drives/apps.json.
      # עותק ששונה בתוך אפליקציה — נעצר כאן. עורכים במקור ומריצים sync.php.
      - name: drives gate (every copy matches mbe-cloud/drives/src)
        run: php mbe-cloud/drives/tools/sync.php --check

      # הגופנים המובנים של ענן MBE: הקטלוג תואם לקבצים, ולכל גופן רישיון OFL
      - name: fonts gate (mbe-cloud/fonts/builtin/catalog.json)
        run: php mbe-cloud/tools/fonts-catalog.php --check

      # ערכת הממשק המשותפת (creative-suite/ui-core/src) — מועתקת לאפליקציות שב-creative-suite/ui-core/apps.json.
      # עותק ששונה בתוך אפליקציה — נעצר כאן. עורכים במקור ומריצים sync.php.
      - name: ui-core gate (every copy matches creative-suite/ui-core/src)
        run: php creative-suite/ui-core/tools/sync.php --check

      # צד השרת של תפריט המשתמש (ui-core/php/account) — שמירת הגדרות, ייצוא ומחיקת חשבון, ב-SQLite בזיכרון.
      # בדיקה שנכשלת עוצרת את הפריסה: מחיקה שגויה היא נתונים של משתמשים.
      - name: ui-core account tests
        run: php creative-suite/ui-core/tests/account.php

      # קניות משותפות — חלוקת העלויות, ההתחשבנות והחיבור לשער (SQLite בזיכרון, בלי מסד ובלי .env).
      # בדיקה שנכשלת עוצרת את הפריסה: טעות בחישוב "מי חייב למי" היא כסף אמיתי של אנשים.
      - name: family-shopping tests
        run: for t in family-shopping/tests/*.php; do echo "--- $t"; php "$t" > /tmp/fs-test.log || { cat /tmp/fs-test.log; exit 1; }; tail -1 /tmp/fs-test.log; done

      # השער: לכל אפליקציה שב-app.json שלה "gate": true — .user.ini ובלוק בראש
      # ה-.htaccess, בעותק שבמכונה הזו בלבד (לא בגיט). ראו platform/build-gate.php.
      - name: Build the platform gate
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: php platform/build-gate.php --root="$DEPLOY_PATH" --host=mbe-plus.com

      # קוד ההתקנה של המנהל הראשון (platform/). לשרת עולה רק ה-hash שלו, לקובץ
      # שחסום מהדפדפן (platform/lib/.htaccess); הקוד עצמו לא נכתב לשום מקום.
      # בלי הסוד — אזהרה בלבד: דף ההתקנה יאמר שהקוד חסר, ושאר האתר נפרס כרגיל.
      - name: Write the platform setup-code hash
        env:
          PLATFORM_SETUP_CODE: ${{ secrets.PLATFORM_SETUP_CODE }}
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_SETUP_CODE:-}" ]; then
            echo "::warning::PLATFORM_SETUP_CODE לא מוגדר — אי אפשר ליצור את המנהל הראשון של הפלטפורמה"
            exit 0
          fi
          php -r 'file_put_contents("platform/lib/setup-code.php", "<?php\nreturn " . var_export(password_hash(getenv("PLATFORM_SETUP_CODE"), PASSWORD_DEFAULT), true) . ";\n");'
          php -l platform/lib/setup-code.php

      # קוד השחזור של ניהול הפרויקטים — מקים את המפתח הראשון, ומאפשר לו לקבוע
      # סיסמה חדשה אם שכח. נפרד לגמרי מהפלטפורמה. לשרת עולה רק ה-hash, לקובץ
      # שחסום מהדפדפן (project-manager/.htaccess חוסם את lib/). בלי הסוד — אזהרה.
      - name: Write the project-manager recovery-code hash
        env:
          PM_RECOVERY_CODE: ${{ secrets.PM_RECOVERY_CODE }}
        run: |
          set -euo pipefail
          if [ -z "${PM_RECOVERY_CODE:-}" ]; then
            echo "::warning::PM_RECOVERY_CODE לא מוגדר — אי אפשר להקים את המפתח של ניהול הפרויקטים או לשחזר את סיסמתו"
            exit 0
          fi
          php -r 'file_put_contents("project-manager/lib/recovery-code.php", "<?php\nreturn " . var_export(password_hash(getenv("PM_RECOVERY_CODE"), PASSWORD_DEFAULT), true) . ";\n");'
          php -l project-manager/lib/recovery-code.php

      - name: Validate the deploy target
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
        run: |
          bad=0
          [ "$(printf '%s' "$HOST"  | wc -l)" -eq 0 ] || { echo "::error::DEPLOY_HOST מכיל יותר משורה אחת"; bad=1; }
          [ "$(printf '%s' "$USER_" | wc -l)" -eq 0 ] || { echo "::error::DEPLOY_USER מכיל יותר משורה אחת"; bad=1; }
          [ "$(printf '%s' "$PATH_" | wc -l)" -eq 0 ] || { echo "::error::DEPLOY_PATH מכיל יותר משורה אחת — כנראה הודבק לשם המפתח במקום הנתיב"; bad=1; }
          case "$PATH_" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH חייב להיות נתיב מוחלט המתחיל ב-/"; bad=1 ;;
          esac
          [ "$bad" -eq 0 ] || exit 1
          echo "היעד תקין: שלושת הסודות בני שורה אחת, והנתיב מוחלט"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Unlock the deploy key if it has a passphrase
        env:
          DEPLOY_PASS: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        run: |
          if [ -z "$DEPLOY_PASS" ]; then
            echo "לא הוגדרה סיסמה — המפתח אמור להיות פתוח, ssh ישתמש בו ישירות"
            exit 0
          fi
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASS"
          SH
          chmod +x "$RUNNER_TEMP/askpass"
          SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/deploy_key
          rm -f "$RUNNER_TEMP/askpass"
          ssh-add -l

      - name: Verify the deploy key is readable
        run: ssh-keygen -l -f ~/.ssh/deploy_key
             || echo "::warning::DEPLOY_SSH_KEY אינו מפתח פרטי קריא (נעול בסיסמה?)"

      # ענן MBE (2026-11): ענן החבילה עבר מ-suite-cloud/ ל-mbe-cloud/ (mbe-cloud/docs/spec-0-vision.md §8.3).
      # rsync לא מעביר נתונים, ולכן הם עוברים כאן, פעם אחת, ב-mv באותה מחיצה (אטומי, בלי עותק כפול) — **לפני** ה-rsync,
      # שמחריג את mbe-cloud/data/*. **ההפניה (308) של suite-cloud/ נכתבת לפני ה-mv, באותו חיבור**: כך אין רגע שבו
      # api.php הישן (שנשאר בשרת, rsync בלי --delete) רץ מול data/ שכבר הועבר ופותח מסד ריק. כשל אחרי ההפניה ולפני
      # ה-mv משאיר 404 זמני — לא ענן ריק. התוכן זהה לקובץ בריפו (base64), וה-rsync הראשי דורס אותו באותו תוכן.
      # app.json הישן בשרת מקבל שם אחר, אחרת הרישום (שסורק */app.json בשרת) מציג את הכלי פעמיים.
      # חוזר על עצמו בלי נזק ("already moved"). שלב חובה: כשל כאן עוצר את הפריסה. mbe-cloud/data קיים בלי מסד —
      # עצירה בלי לגעת בכלום, גם לא בהפניה (קוד 3): הענן הישן ממשיך לעבוד על הנתונים שלו.
      - name: ענן MBE — העברת הנתונים מ-suite-cloud/ ל-mbe-cloud/ (חד-פעמי)
        env:
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          D="${DEPLOY_PATH%/}"
          HT=$(base64 -w0 suite-cloud/.htaccess)
          REMOTE=$(cat <<SH
          set -eu
          cd '$D'
          redirect() {
            mkdir -p suite-cloud
            printf '%s' '$HT' | base64 -d > suite-cloud/.htaccess.new
            mv -f suite-cloud/.htaccess.new suite-cloud/.htaccess
            echo "redirect up"
          }
          if [ -f mbe-cloud/data/cloud.sqlite ]; then
            redirect
            echo "already moved"
          elif [ -f suite-cloud/data/cloud.sqlite ]; then
            if [ -e mbe-cloud/data ]; then echo "mbe-cloud/data קיים בלי cloud.sqlite — לא הועבר כלום" >&2; exit 3; fi
            redirect
            mkdir -p mbe-cloud
            mv suite-cloud/data mbe-cloud/data
            date -u +%FT%TZ > mbe-cloud/data/MOVED_FROM_SUITE_CLOUD
            echo "moved"
          else
            redirect
            echo "nothing to move (אין suite-cloud/data/cloud.sqlite)"
          fi
          if [ -f suite-cloud/app.json ]; then mv suite-cloud/app.json suite-cloud/app.json.moved-to-mbe-cloud; echo "suite-cloud/app.json renamed"; fi
          SH
          )
          for w in 0 30 90 180; do
            sleep $w
            $SSH "$DEST" "$REMOTE"; code=$?
            if [ $code -eq 3 ]; then echo "::error::mbe-cloud/data קיים בשרת בלי cloud.sqlite — צריך בדיקה ידנית לפני פריסה"; exit 3; fi
            if [ $code -eq 0 ]; then exit 0; fi
            echo "::warning::העברת הנתונים — נסיון נכשל (קוד $code), מנסה שוב"
          done
          echo "::error::העברת הנתונים של הענן לא רצה — הפריסה נעצרת"; exit 1

      # השרת סוגר מדי פעם את חיבור ה-SSH מיד אחרי שנפתח —
      # "Connection closed by <ip> port 22", ו-rsync יוצא עם 255 בלי
      # שהעביר בית אחד. זה אינו כשל אימות (אין Permission denied) ואינו
      # כשל בקוד: אותם סודות בדיוק מצליחים ונכשלים לסירוגין.
      #
      # ההמתנות נגזרות ממדידה ולא מניחוש. ב-17.9 נצפה:
      #   15:19 נכשל → 15:24 הצליח, חמש דקות אחר כך, ללא שינוי בשום דבר.
      # כלומר החסימה משתחררת תוך דקות. גרסה קודמת ניסתה 5 ו-15 שניות,
      # כל שלושת הנסיונות נפלו בתוך אותו חלון חסימה ונכשלו זהה. לכן
      # ההמתנות כאן נמדדות בדקות: 30ש, 90ש, 180ש — כיסוי של כ-5 דקות,
      # בדיוק סדר הגודל שנצפה.
      #
      # ‏rsync כאן הוא idempotent — רץ בלי --delete ורק מעתיק — ולכן
      # נסיון חוזר בטוח לחלוטין ואינו עלול לשכפל או להרוס דבר.
      - name: Deploy code via rsync (no --delete; never touches runtime data)
        run: |
          set -uo pipefail
          attempt=1
          max=4
          until rsync -rlptz \
            --exclude='.git' --exclude='.github' --exclude='/devloop/' --exclude='/.devloop.json' --exclude='/.claude/skills/devloop/assets/' \
            --exclude='/creative-suite/mbe-core/tools/' --exclude='/creative-suite/mbe-core/tests/' \
            --exclude='/creative-suite/pdf-core/tools/' \
            --exclude='/creative-suite/pdf-core/tests/' \
            --exclude='/creative-suite/text-core/tools/' --exclude='/creative-suite/text-core/tests/' \
            --exclude='/creative-suite/image-io/tools/' --exclude='/creative-suite/image-io/tests/' \
            --exclude='/creative-suite/render-core/tools/' --exclude='/creative-suite/render-core/tests/' \
            --exclude='git-deploy/data/config.json' \
            --exclude='git-deploy/data/logs/' --exclude='git-deploy/data/cache/' \
            --exclude='renovation-punchlist/data/config.json' \
            --exclude='renovation-punchlist/data/store.json' \
            --exclude='renovation-punchlist/data/media/' \
            --exclude='claude-tasks/data/*.sqlite*' \
            --include='/trading-strategies/data/.htaccess' --exclude='/trading-strategies/data/*' \
            --include='/appraisers/data/.htaccess' --exclude='/appraisers/data/*' --exclude='/appraisers/team/' --exclude='/appraisers/docs/' \
            --exclude='creative-suite/dashboard/data/cadence.json' \
            --exclude='recipes-app/data/*.sqlite*' \
            --include='recipes-app/data/media/.htaccess' \
            --exclude='recipes-app/data/media/*' \
            --exclude='recipes-app/data/scans/' \
            --include='platform/downloads/.htaccess' \
            --exclude='platform/downloads/*' \
            --exclude='claude-tasks/data/config.json' \
            --exclude='claude-tasks/data/secret.key' \
            --exclude='claude-tasks/data/bell/' \
            --exclude='claude-tasks/data/throttle/' \
            --exclude='claude-tasks/models/' \
            --exclude='camera-app/data/*.sqlite*' \
            --exclude='camera-app/data/secret.key' \
            --exclude='camera-app/data/media/' \
            --exclude='camera-app/data/inbox/' \
            --exclude='camera-app/data/live/' \
            --exclude='node_modules/' \
            --exclude='guarded-browser/android/' \
            --exclude='recipes-app/android/' \
            --exclude='project-manager/android/' \
            --exclude='whatsapp-ai-scanner/android/' \
            --exclude='whatsapp-ai-scanner/data/scanner.sqlite*' \
            --exclude='whatsapp-ai-scanner/data/secret.key' \
            --exclude='guarded-browser/data/*.sqlite*' \
            --exclude='guarded-browser/data/apk/' \
            --exclude='catering-menu/data/orders/' \
            --exclude='catering-menu/data/config.json' \
            --exclude='catering-menu/data/settings.json' \
            --exclude='catering-menu/data/menu.json' \
            --exclude='catering-menu/data/sessions/' \
            --exclude='catering-menu/data/push.json' \
            --exclude='catering-menu/data/push-log.json' \
            --exclude='catering-menu/data/reminders.json*' \
            --exclude='catering-menu/data/logo.*' \
            --exclude='catering-menu/data/fonts/' \
            --exclude='carpentry-3d/data/*.sqlite*' \
            --exclude='carpentry-3d/data/media/' \
            --exclude='greeting-cards/data/studio/' \
            --exclude='platform/data/*.sqlite*' \
            --exclude='platform/data/devboard/' \
            --exclude='document-templates/data/*.sqlite*' \
            --exclude='document-templates/data/secret.key' \
            --exclude='document-templates/data/files/' \
            --exclude='project-manager/data/*.sqlite*' \
            --exclude='project-manager/data/config.json' \
            --exclude='project-manager/data/files/' \
            --exclude='project-manager/data/media/' \
            --exclude='project-manager/data/tmp/' \
            --exclude='org-budget-proposals/data/*.sqlite*' \
            --exclude='org-budget-proposals/data/files/' \
            --exclude='kol-maroko/data/*.sqlite*' --exclude='kol-maroko/data/files/' \
            --exclude='kol-maroko/data/secrets.json' --exclude='/kol-maroko/wordpress-plugin/' \
            --exclude='word-processor/data/*.sqlite*' \
            --exclude='word-processor/data/media/' \
            --exclude='time-clock/data/*.sqlite*' \
            --exclude='time-clock/data/certs/' \
            --exclude='payments/data/*.sqlite*' --exclude='payments/data/*.key' \
            --exclude='payments/data/config.json' --exclude='payments/data/backups/' \
            --exclude='payments/data/docs/' --exclude='payments/data/logs/' \
            --exclude='vector-studio/data/*.sqlite*' --exclude='vector-studio/data/files/' \
            --include='mbe-cloud/data/.htaccess' --exclude='mbe-cloud/data/*' \
            --exclude='/mbe-cloud/tests/' --exclude='/mbe-cloud/tools/' --exclude='/mbe-cloud/drives/tools/' --exclude='/mbe-cloud/drives/tests/' \
            --exclude='suite-cloud/data/*' \
            --exclude='layout-studio/data/*.sqlite*' --exclude='layout-studio/data/files/' \
            --exclude='raster-studio/data/*.sqlite*' --exclude='raster-studio/data/files/' \
            --exclude='mailbox/data/*.sqlite*' --exclude='mailbox/data/secret.key' --exclude='mailbox/data/cache/' --exclude='/mailbox/tests/' \
            --exclude='family-shopping/.env' --exclude='/family-shopping/tests/' \
            --include='family-shopping/uploads/.htaccess' --exclude='family-shopping/uploads/*' \
            --exclude='*.log' --exclude='error_log' \
            --exclude='.DS_Store' --exclude='._*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          do
            code=$?
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::הפריסה נכשלה ב-$max נסיונות לאורך כ-5 דקות. קוד היציאה האחרון: $code"
              echo "::error::קוד 255 עם 0 בתים = השרת סגר את חיבור ה-SSH. ראה .claude/skills/deploy-to-cpanel/references/troubleshooting.md"
              # כשגם חמש דקות לא הספיקו, השאלה הבאה היא *היכן* נסגר
              # החיבור: לפני האימות (חסימה או מגבלת קצב בשרת) או אחריו
              # (בעיה בחשבון או ב-shell). ssh מפורט עונה על זה, וללא
              # התשובה הזו הכשל הבא יהיה עוד ניחוש. רץ פעם אחת בלבד,
              # ורק כאן — ולכן אינו מוסיף רעש להרצה מוצלחת.
              echo "--- אבחון: היכן נסגר החיבור ---"
              ssh -vv -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 -o BatchMode=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'echo SSH_OK' 2>&1 \
                | tail -n 40 || true
              exit "$code"
            fi
            case "$attempt" in
              1) wait=30 ;;
              2) wait=90 ;;
              *) wait=180 ;;
            esac
            echo "::warning::נסיון $attempt מתוך $max נכשל (קוד $code). ממתין ${wait}ש ומנסה שוב"
            sleep "$wait"
            attempt=$(( attempt + 1 ))
          done
          echo "Deploy complete (נסיון $attempt מתוך $max)"

      # Digital Asset Links: קובץ אחד לכל הדומיין (https://mbe-plus.com/.well-known/assetlinks.json) — בלעדיו
      # אפליקציות שנסגרו (platform/retired.json): rsync בלי --delete משאיר בשרת תיקייה שנמחקה מהריפו, והרישום
      # היה ממשיך להציג אותה. platform/tools/retire-apps.php מעביר את ההרשאות לאפליקציה שנשארה, מנקה את המסד
      # ומוחק את התיקייה ואת תיקיית החנות. חוזר על עצמו בלי נזק. לא מפיל את הפריסה.
      - name: אפליקציות שנסגרו — העברת הרשאות ומחיקה מהשרת
        if: success()
        continue-on-error: true
        env:
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          for w in 0 30 90; do
            sleep $w
            if $SSH "$DEST" "cd '${DEPLOY_PATH%/}' && php platform/tools/retire-apps.php"; then exit 0; fi
          done
          echo "::warning::retire-apps.php לא רץ — ינסה שוב בפריסה הבאה"

      # משימות מתוזמנות בשרת (crontab של משתמש הפריסה). כל שורה מסומנת "# mini_projects:<id>": מוסיפים
      # רק שורה שחסרה, ולא נוגעים בשום שורה אחרת. שורה שנוספה עכשיו — מורצת פעם אחת מיד, והפלט בלוג.
      # רשימה: <id>|<תזמון>|<סקריפט יחסי ל-DEPLOY_PATH>. לא מפיל את הפריסה.
      - name: משימות מתוזמנות בשרת — crontab
        if: success()
        continue-on-error: true
        env:
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CRONS: |
            trading-strategies-alerts|*/15 * * * *|trading-strategies/bin/alerts-cron.php|trading-strategies/data/alerts-cron.log
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          REMOTE=$(cat <<'EOS'
          set -u
          ROOT="$1"; PHP=$(command -v php || true)
          [ -n "$PHP" ] || { echo "php לא נמצא בשרת — לא נוגע ב-crontab"; exit 1; }
          # קריאה שנכשלה (לא "no crontab") אסור שתיחשב כ-crontab ריק — ההתקנה הייתה מוחקת את כל השורות.
          read_tab() {
            TAB=$(crontab -l 2>&1); local rc=$?
            if [ $rc -ne 0 ]; then
              grep -qi 'no crontab' <<<"$TAB" || { echo "crontab -l נכשל — לא נוגע: $TAB"; return 1; }
              TAB=""
            fi
          }
          # שורות עבודה בלבד — בלי הערות, שורות ריקות ו-SHELL=/MAILTO= (cPanel מוסיף SHELL= לפני כל עבודה).
          # "שלנו" = השורה מסתיימת בתג בדיוק (לא מחרוזת חלקית: ...-alerts לא תופס את ...-alerts-daily).
          # רווחים / \r בסוף השורה לא מפילים את ההתאמה (cPanel עלול לשמור אותם).
          ours()    { awk -v t="$1" '{ s = $0; sub(/[ \t\r]+$/, "", s) } length(s) >= length(t) && substr(s, length(s) - length(t) + 1) == t'; }
          notours() { awk -v t="$1" '{ s = $0; sub(/[ \t\r]+$/, "", s) } !(length(s) >= length(t) && substr(s, length(s) - length(t) + 1) == t)'; }
          jobs() { grep -vE '^[[:space:]]*(#|$)' | grep -vE '^[A-Za-z_][A-Za-z0-9_]*=' | notours "$1" || true; }
          while IFS='|' read -r id sched script log; do
            [ -n "$id" ] || continue
            tag="# mini_projects:$id"
            out=/dev/null; [ -n "$log" ] && out="$ROOT/$log"
            line="$sched $PHP $ROOT/$script >> $out 2>&1 $tag"
            [ "$out" = /dev/null ] && line="$sched $PHP $ROOT/$script >/dev/null 2>&1 $tag"
            read_tab || exit 1
            if grep -qxF "$line" <<<"$TAB"; then echo "$id: כבר מותקן"; continue; fi
            [ -f "$ROOT/$script" ] || { echo "$id: הסקריפט לא נמצא — מדלג"; continue; }
            had=$(ours "$tag" <<<"$TAB" | grep -c . || true)
            others=$(jobs "$tag" <<<"$TAB")
            # השורה המסומנת (אם קיימת בגרסה אחרת) מוחלפת; כל שאר השורות נשארות כמו שהן.
            [ "$out" = /dev/null ] || mkdir -p "$(dirname "$out")"
            { [ -z "$TAB" ] || notours "$tag" <<<"$TAB"; echo "$line"; } | crontab -
            read_tab || exit 1
            if [ "$(grep -cxF "$line" <<<"$TAB")" = 1 ] && [ "$(ours "$tag" <<<"$TAB" | grep -c .)" = 1 ] && [ "$(jobs "$tag" <<<"$TAB")" = "$others" ]; then
              [ "$had" = 0 ] && echo "$id: הותקן ($sched)" || echo "$id: עודכן ($sched)"
            else echo "$id: ההתקנה לא אומתה — שאר העבודות השתנו או שהשורה חסרה"; exit 1; fi
            echo "$id: ריצה ראשונה ←"; timeout 300 "$PHP" "$ROOT/$script" </dev/null; echo "$id: קוד יציאה $?"
          done
          echo "--- crontab -l (שורות mini_projects) ---"
          read_tab && { grep -F '# mini_projects:' <<<"$TAB" || echo "(אין)"; }
          EOS
          )
          for w in 0 30 90; do
            sleep $w
            if printf '%s\n' "$CRONS" | $SSH "$DEST" "bash -c $(printf '%q' "$REMOTE") _ '${DEPLOY_PATH%/}'"; then exit 0; fi
          done
          echo "::warning::התקנת ה-crontab לא רצה — תנסה שוב בפריסה הבאה"

      # אפליקציית אנדרואיד (TWA) נפתחת עם שורת כתובת. הקובץ יושב בשורש הדומיין, מחוץ ל-DEPLOY_PATH (הותר
      # במפורש, 2026-10-19). מאוחד מהקיים בשרת (שום רשומה לא נמחקת), מתיקיית החנות של כל אפליקציה
      # ("install.release") ומ-<app>/.well-known/assetlinks.json — platform/tools/assetlinks.php.
      # לא מפיל את הפריסה.
      - name: Digital Asset Links — assetlinks.json משותף בשורש הדומיין
        if: success()
        continue-on-error: true
        env:
          SITE_ROOT: https://mbe-plus.com
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          case "$DEPLOY_PATH" in */mini_projects|*/mini_projects/) ;; *) echo "::notice::DEPLOY_PATH אינו <שורש>/mini_projects — מדלג"; exit 0 ;; esac
          W="$RUNNER_TEMP/assetlinks"; mkdir -p "$W"
          curl -sfL --max-time 20 "$SITE_ROOT/.well-known/assetlinks.json" -o "$W/existing.json" || rm -f "$W/existing.json"
          for f in */app.json; do
            rel=$(jq -r '.install.release // empty' "$f")
            [ -n "$rel" ] || continue
            curl -sfL --max-time 30 "https://github.com/${{ github.repository }}/releases/download/$rel/assetlinks.json" -o "$W/$rel.json" \
              || { echo "::notice::אין assetlinks.json ב-$rel"; rm -f "$W/$rel.json"; }
          done
          php platform/tools/assetlinks.php $(ls "$W"/existing.json 2>/dev/null) "$W"/*-store.json */.well-known/assetlinks.json > "$W/merged.json" 2>/dev/null
          if [ "$(jq 'length' "$W/merged.json")" -eq 0 ]; then echo "אין אפליקציות חתומות — אין מה לפרסם"; exit 0; fi
          if [ -f "$W/existing.json" ] && [ "$(jq -S . "$W/existing.json")" = "$(jq -S . "$W/merged.json")" ]; then echo "assetlinks.json כבר מעודכן"; exit 0; fi
          ROOT="${DEPLOY_PATH%/}"; ROOT="${ROOT%/mini_projects}"
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          for i in 1 2 3; do
            if $SSH "$DEST" "mkdir -p '$ROOT/.well-known'" && rsync -tz -e "$SSH" "$W/merged.json" "$DEST:$ROOT/.well-known/assetlinks.json"; then
              echo "assetlinks.json עודכן: $(jq -r '[.[].target.package_name] | join(", ")' "$W/merged.json")"; exit 0
            fi
            sleep 60
          done
          echo "::warning::לא הצלחתי לכתוב את assetlinks.json לשורש הדומיין"

      # קבצי ההתקנה מהשרת שלנו: כל Release <app>-store מועתק ל-platform/downloads/<app>/ עם meta.json
      # (גרסה וחבילה) — כפתור "התקנה" בפלטפורמה מוריד משם, לא מ-GitHub. גם store-mirror.yml (כל שעה),
      # כי בניית אנדרואיד מעדכנת את ה-Release בלי פריסה. לא מפיל את הפריסה.
      - name: תיקיות החנות — APK ו-AAB מהשרת שלנו
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash platform/tools/store-mirror.sh

      # DevLoop (מנהל הפרויקטים, "מטלות ושיח"): אחרי פריסה מוצלחת — כל קוד מטלה (PM-017) בהודעת ה-commit
      # מקבל ראיות (הפריסה וה-PR) ועובר ל"ממתין לאימות שלך". לא מפיל את הפריסה, ומדלג כשאין סוד.
      # סוד: PM_DEVLOOP_TOKEN — אסימון מ"🔑 גישה ל-Claude" באזור הפיתוח (pmd_…).
      - name: DevLoop — ראיות פריסה למטלות
        if: success()
        continue-on-error: true
        env:
          PM_DEVLOOP_TOKEN: ${{ secrets.PM_DEVLOOP_TOKEN }}
          PM_DEVLOOP_API: https://mbe-plus.com/mini_projects/project-manager/api.php
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PM_DEVLOOP_TOKEN" ]; then echo "::notice::אין PM_DEVLOOP_TOKEN — מדלג על ראיות DevLoop"; exit 0; fi
          MSG="$(git log -1 --format=%B)"
          CODES=$(printf '%s' "$MSG" | grep -oE '\bPM-[0-9]{3}\b' | sort -u || true)
          if [ -z "$CODES" ]; then echo "אין קודי מטלות בהודעת ה-commit"; exit 0; fi
          PR=$(printf '%s' "$MSG" | head -1 | grep -oE '\(#[0-9]+\)' | tr -dc 0-9 || true)
          SHA=$(git rev-parse --short HEAD)
          for CODE in $CODES; do
            BODY=$(jq -nc --arg code "$CODE" --arg run "run $RUN_NO" --arg url "$RUN_URL" --arg pr "$PR" --arg repo "$REPO" --arg sha "$SHA" '{
              code: $code, status: "verify", by: "github",
              evidence: ([{kind: "deploy", ref: $run, url: $url, note: ""}, {kind: "commit", ref: $sha, url: ("https://github.com/" + $repo + "/commit/" + $sha), note: ""}]
                + (if $pr == "" then [] else [{kind: "pr", ref: ("#" + $pr), url: ("https://github.com/" + $repo + "/pull/" + $pr), note: ""}] end))}')
            CODE_HTTP=$(curl -sS -o /tmp/devloop.json -w '%{http_code}' --max-time 30 -X POST "$PM_DEVLOOP_API?action=devapi-comment" \
              -H "X-Dev-Token: $PM_DEVLOOP_TOKEN" -H 'Content-Type: application/json' --data "$BODY" || echo 000)
            if [ "$CODE_HTTP" = 200 ]; then echo "$CODE ← ראיות פריסה ($(cat /tmp/devloop.json))"
            else echo "::warning::DevLoop: $CODE נכשל ($CODE_HTTP): $(head -c 300 /tmp/devloop.json 2>/dev/null)"; fi
          done

      # DevLoop (תבניות המסמכים): אותו דבר לקודים DT-… — ראיות פריסה ומעבר ל"ממתין לאימות שלך".
      # סוד: DT_DEVLOOP_TOKEN — אסימון מ"📋 מטלות ← 🔑 גישה ל-Claude" בתבניות המסמכים (dtd_…). בלעדיו — מדלג.
      - name: DevLoop — ראיות פריסה למטלות (תבניות מסמכים)
        if: success()
        continue-on-error: true
        env:
          DT_DEVLOOP_TOKEN: ${{ secrets.DT_DEVLOOP_TOKEN }}
          DT_DEVLOOP_API: https://mbe-plus.com/mini_projects/document-templates/api.php
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DT_DEVLOOP_TOKEN" ]; then echo "::notice::אין DT_DEVLOOP_TOKEN — מדלג על ראיות DevLoop של תבניות המסמכים"; exit 0; fi
          MSG="$(git log -1 --format=%B)"
          CODES=$(printf '%s' "$MSG" | grep -oE '\bDT-[0-9]{3}\b' | sort -u || true)
          if [ -z "$CODES" ]; then echo "אין קודי DT- בהודעת ה-commit"; exit 0; fi
          PR=$(printf '%s' "$MSG" | head -1 | grep -oE '\(#[0-9]+\)' | tr -dc 0-9 || true)
          SHA=$(git rev-parse --short HEAD)
          for CODE in $CODES; do
            BODY=$(jq -nc --arg code "$CODE" --arg run "run $RUN_NO" --arg url "$RUN_URL" --arg pr "$PR" --arg repo "$REPO" --arg sha "$SHA" '{
              code: $code, status: "verify", by: "github",
              evidence: ([{kind: "deploy", ref: $run, url: $url, note: ""}, {kind: "commit", ref: $sha, url: ("https://github.com/" + $repo + "/commit/" + $sha), note: ""}]
                + (if $pr == "" then [] else [{kind: "pr", ref: ("#" + $pr), url: ("https://github.com/" + $repo + "/pull/" + $pr), note: ""}] end))}')
            CODE_HTTP=$(curl -sS -o /tmp/devloop-dt.json -w '%{http_code}' --max-time 30 -X POST "$DT_DEVLOOP_API?action=devapi-comment" \
              -H "X-Dev-Token: $DT_DEVLOOP_TOKEN" -H 'Content-Type: application/json' --data "$BODY" || echo 000)
            if [ "$CODE_HTTP" = 200 ]; then echo "$CODE ← ראיות פריסה ($(cat /tmp/devloop-dt.json))"
            else echo "::warning::DevLoop: $CODE נכשל ($CODE_HTTP): $(head -c 300 /tmp/devloop-dt.json 2>/dev/null)"; fi
          done
