name: Deploy to production

# פריסה אוטומטית git -> שרת. מופעלת בכל push לענף שממנו האתר מוגש,
# ובהפעלה ידנית. מעלה קוד בלבד ב-rsync — לא נוגעת בנתוני הריצה שבשרת
# (data/ של git-deploy ושל renovation-punchlist מכילות אסימונים, הגדרות
# ומדיה שהמשתמשים העלו).
#
# rsync רץ בלי --delete בכוונה: קבצים שקיימים רק בשרת נשארים במקומם.
#
# Secrets נדרשים ב-Settings → Secrets and variables → Actions:
#   DEPLOY_SSH_KEY         מפתח SSH פרטי בעל גישה לשרת
#   DEPLOY_SSH_PASSPHRASE  אופציונלי. נדרש רק אם המפתח נעול בסיסמה
#                          (שורת Proc-Type: 4,ENCRYPTED בראש הקובץ).
#                          למפתח פתוח — להשמיט, והשלב מדלג על עצמו.
#   DEPLOY_HOST     כתובת השרת
#   DEPLOY_USER     שם המשתמש בשרת
#   DEPLOY_PATH     הנתיב לתיקיית האתר, למשל /home2/<user>/public_html/mini_projects

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# לעולם לא שתי פריסות במקביל.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 (matches the server)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax-check gate (abort deploy on any parse error)
        run: |
          set -euo pipefail
          ERR=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || ERR=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          if [ "$ERR" -ne 0 ]; then echo "::error::PHP syntax errors — aborting deploy"; exit 1; fi
          echo "PHP lint OK"

      - name: JS syntax-check gate
        run: |
          set -euo pipefail
          ERR=0
          while IFS= read -r -d '' f; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "::error file=$f::syntax error"; ERR=1; }
          done < <(find . \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path '*/vendor/*' -print0)
          if [ "$ERR" -ne 0 ]; then echo "::error::JS syntax errors — aborting deploy"; exit 1; fi
          echo "JS lint OK"

      - name: Validate the deploy target
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
        run: |
          bad=0
          [ "$(printf '%s' "$HOST"  | wc -l)" -eq 0 ] || { echo "::error::DEPLOY_HOST מכיל יותר משורה אחת"; bad=1; }
          [ "$(printf '%s' "$USER_" | wc -l)" -eq 0 ] || { echo "::error::DEPLOY_USER מכיל יותר משורה אחת"; bad=1; }
          [ "$(printf '%s' "$PATH_" | wc -l)" -eq 0 ] || { echo "::error::DEPLOY_PATH מכיל יותר משורה אחת — כנראה הודבק לשם המפתח במקום הנתיב"; bad=1; }
          case "$PATH_" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH חייב להיות נתיב מוחלט המתחיל ב-/"; bad=1 ;;
          esac
          [ "$bad" -eq 0 ] || exit 1
          echo "היעד תקין: שלושת הסודות בני שורה אחת, והנתיב מוחלט"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Unlock the deploy key if it has a passphrase
        env:
          DEPLOY_PASS: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        run: |
          if [ -z "$DEPLOY_PASS" ]; then
            echo "לא הוגדרה סיסמה — המפתח אמור להיות פתוח, ssh ישתמש בו ישירות"
            exit 0
          fi
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASS"
          SH
          chmod +x "$RUNNER_TEMP/askpass"
          SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force \
            ssh-add ~/.ssh/deploy_key
          rm -f "$RUNNER_TEMP/askpass"
          ssh-add -l

      - name: Verify the deploy key is readable
        run: ssh-keygen -l -f ~/.ssh/deploy_key
             || echo "::warning::DEPLOY_SSH_KEY אינו מפתח פרטי קריא (נעול בסיסמה?)"

      # השרת סוגר מדי פעם את חיבור ה-SSH מיד אחרי שנפתח —
      # "Connection closed by <ip> port 22", ו-rsync יוצא עם 255 בלי
      # שהעביר בית אחד. זה אינו כשל אימות (אין Permission denied) ואינו
      # כשל בקוד: אותם סודות בדיוק מצליחים ונכשלים לסירוגין.
      #
      # ההמתנות נגזרות ממדידה ולא מניחוש. ב-17.9 נצפה:
      #   15:19 נכשל → 15:24 הצליח, חמש דקות אחר כך, ללא שינוי בשום דבר.
      # כלומר החסימה משתחררת תוך דקות. גרסה קודמת ניסתה 5 ו-15 שניות,
      # כל שלושת הנסיונות נפלו בתוך אותו חלון חסימה ונכשלו זהה. לכן
      # ההמתנות כאן נמדדות בדקות: 30ש, 90ש, 180ש — כיסוי של כ-5 דקות,
      # בדיוק סדר הגודל שנצפה.
      #
      # ‏rsync כאן הוא idempotent — רץ בלי --delete ורק מעתיק — ולכן
      # נסיון חוזר בטוח לחלוטין ואינו עלול לשכפל או להרוס דבר.
      - name: Deploy code via rsync (no --delete; never touches runtime data)
        run: |
          set -uo pipefail
          attempt=1
          max=4
          until rsync -rlptz \
            --exclude='.git' --exclude='.github' \
            --exclude='git-deploy/data/config.json' \
            --exclude='git-deploy/data/logs/' --exclude='git-deploy/data/cache/' \
            --exclude='renovation-punchlist/data/config.json' \
            --exclude='renovation-punchlist/data/store.json' \
            --exclude='renovation-punchlist/data/media/' \
            --exclude='claude-tasks/data/*.sqlite*' \
            --exclude='claude-tasks/data/config.json' \
            --exclude='claude-tasks/data/secret.key' \
            --exclude='node_modules/' \
            --exclude='guarded-browser/android/' \
            --exclude='guarded-browser/data/*.sqlite*' \
            --exclude='*.log' --exclude='error_log' \
            --exclude='.DS_Store' --exclude='._*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          do
            code=$?
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::הפריסה נכשלה ב-$max נסיונות לאורך כ-5 דקות. קוד היציאה האחרון: $code"
              echo "::error::קוד 255 עם 0 בתים = השרת סגר את חיבור ה-SSH. ראה .claude/skills/deploy-to-cpanel/references/troubleshooting.md"
              # כשגם חמש דקות לא הספיקו, השאלה הבאה היא *היכן* נסגר
              # החיבור: לפני האימות (חסימה או מגבלת קצב בשרת) או אחריו
              # (בעיה בחשבון או ב-shell). ssh מפורט עונה על זה, וללא
              # התשובה הזו הכשל הבא יהיה עוד ניחוש. רץ פעם אחת בלבד,
              # ורק כאן — ולכן אינו מוסיף רעש להרצה מוצלחת.
              echo "--- אבחון: היכן נסגר החיבור ---"
              ssh -vv -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 -o BatchMode=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'echo SSH_OK' 2>&1 \
                | tail -n 40 || true
              exit "$code"
            fi
            case "$attempt" in
              1) wait=30 ;;
              2) wait=90 ;;
              *) wait=180 ;;
            esac
            echo "::warning::נסיון $attempt מתוך $max נכשל (קוד $code). ממתין ${wait}ש ומנסה שוב"
            sleep "$wait"
            attempt=$(( attempt + 1 ))
          done
          echo "Deploy complete (נסיון $attempt מתוך $max)"
