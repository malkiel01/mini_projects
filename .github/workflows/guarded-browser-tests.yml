name: Migdalor tests

# בדיקות ההתנהגות של מגדלור (guarded-browser/tests/*.php) — כל קובץ מול SQLite זמני משלו (GB_DATA_DIR).
# רצות בכל PR ובכל push ל-main שנוגע במגדלור, כדי ש-PR לא ימוזג כשהן נכשלות. בדיקת תחביר בלבד
# (php -l ב-deploy.yml) אינה מספיקה: היא לא תופסת הסלמת הרשאות או חוזה API שנשבר.

on:
  push:
    branches: [main]
    paths:
      - 'guarded-browser/**'
      - '.github/workflows/guarded-browser-tests.yml'
  pull_request:
    paths:
      - 'guarded-browser/**'
      - '.github/workflows/guarded-browser-tests.yml'

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sodium, mbstring, curl
          coverage: none
      - name: בדיקות PHP
        run: |
          FAIL=0
          for t in guarded-browser/tests/*.php; do
            echo "::group::$t"
            if php "$t"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error file=$t::נכשל"; FAIL=1; fi
          done
          exit $FAIL
