# בונה את הטמעת הנתונים לחנות של גוגל (TWA — data-embed-for-clients/android). העתק של recipes-twa.yml,
# במבנה של project-manager-apk.yml: assetlinks.json יוצא ב-Release, והפריסה מאחדת אותו לשורש הדומיין.
#
# "תיקיית החנות" — Release קבוע data-embed-for-clients-store, שה-app.json מצביע עליו
# ("install": {"release": "data-embed-for-clients-store"}). שמות קבועים, מתעדכנים בכל בנייה מ-main:
#   data-embed-for-clients.apk   התקנה ישירה בטלפון
#   data-embed-for-clients.aab   להעלאה ל-Play Console
#   store-listing.zip            STORE.md (טקסטים, תשובות מדיניות) + store/ (סמל, באנר, צילומי מסך)
#   assetlinks.json              טביעות המפתח — הפריסה מאחדת אותו לשורש הדומיין (platform/tools/assetlinks.php)
#   build.json                   מספר הבנייה, הכתובת, טביעת החתימה
#
# מפתח ההעלאה: הסוד המשותף ANDROID_KEYSTORE_PASSWORD (platform/docs/rollout.md, צעד 5). בבנייה הראשונה מ-main
# נוצר מפתח, מוצפן בסיסמה (AES-256) ונשמר בריפו — data-embed-for-clients/android/keystore/upload.jks.enc.
# מוצפן הוא חסר ערך בלי הסיסמה. גוגל מחזיקה מפתח חתימה משלה (Play App Signing).
#
# מענף אחר / PR — רק בדיקה שהקוד נבנה (APK בחתימת debug, artifact). ה-Release מתעדכן רק מ-main.

name: Build Data Embed app (Google Play)

on:
  push:
    branches: [main]
    paths:
      - 'data-embed-for-clients/android/**'
      - '.github/workflows/data-embed-for-clients-twa.yml'
  pull_request:
    paths:
      - 'data-embed-for-clients/android/**'
      - '.github/workflows/data-embed-for-clients-twa.yml'
  workflow_dispatch: {}

concurrency:
  group: data-embed-twa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: data-embed-for-clients/android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # המפתח המוצפן ו-Release
    env:
      APP_HOST: mbe-plus.com
      APP_PATH: /mini_projects/data-embed-for-clients/
      PACKAGE: com.mbeplus.dataembed
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ENC: keystore/upload.jks.enc
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ה-commit של המפתח נדחף אחרי pull --rebase

      # versionCode עולה בכל בנייה — כל העלאה לחנות חייבת מספר גבוה מהקודם
      - name: Version
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ‏packages במפורש: ברירת המחדל מתקינה גם את 'tools', שהוסרה ממאגר ה-SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # גרסה מפורשת: ה-9.x שב-runner אינו תואם ל-AGP 8.x
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo "mode=check" >> "$GITHUB_OUTPUT"; echo "ענף משנה — רק בדיקה שהקוד נבנה"; exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::אין סוד ANDROID_KEYSTORE_PASSWORD — בלעדיו אין חתימה ואין AAB לחנות"; exit 1
          fi
          if [ ${#ANDROID_KEYSTORE_PASSWORD} -lt 16 ]; then
            echo "::error::הסיסמה בסוד ANDROID_KEYSTORE_PASSWORD קצרה מ-16 תווים — המפתח המוצפן יושב בריפו ציבורי"; exit 1
          fi
          KS="$RUNNER_TEMP/upload.jks"
          if [ -f "$KS_ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$KS_ENC" -out "$KS" -pass env:ANDROID_KEYSTORE_PASSWORD \
              || { echo "::error::הסיסמה בסוד אינה פותחת את המפתח שבריפו. אל תמחקו את הקובץ — האפליקציה חתומה בו"; exit 1; }
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
              -dname "CN=MBE Plus Data Embed, O=mbe-plus.com, C=IL"
            mkdir -p keystore
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out "$KS_ENC" -pass env:ANDROID_KEYSTORE_PASSWORD
            echo "נוצר מפתח העלאה חדש: data-embed-for-clients/android/$KS_ENC"
          fi
          SHA=$(keytool -list -v -keystore "$KS" -alias upload -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build (release — AAB and APK)
        if: steps.key.outputs.mode == 'release'
        run: |
          gradle bundleRelease assembleRelease --no-daemon -PappHost="$APP_HOST" -PappPath="$APP_PATH" -PversionCode="$VERSION_CODE"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/data-embed-for-clients.aab"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/data-embed-for-clients.apk"

      - name: Build (check — debug APK)
        if: steps.key.outputs.mode != 'release'
        run: |
          gradle assembleDebug --no-daemon -PappHost="$APP_HOST" -PappPath="$APP_PATH" -PversionCode="$VERSION_CODE"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/data-embed-for-clients-debug.apk"

      # הטביעות שהאתר מאשר: מפתח ההעלאה (APK שהותקן ידנית) ומפתח החתימה של גוגל (מה שמותקן מהחנות),
      # מ-play-signing-sha256.txt. בלי הנכונה — האפליקציה נפתחת עם שורת כתובת.
      - name: Write assetlinks.json
        if: steps.key.outputs.mode == 'release'
        env:
          UPLOAD_SHA: ${{ steps.key.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          shas = [os.environ['UPLOAD_SHA'].strip()]
          for line in open('play-signing-sha256.txt', encoding='utf-8'):
              line = line.split('#')[0].strip().upper()
              if re.fullmatch(r'([0-9A-F]{2}:){31}[0-9A-F]{2}', line) and line not in shas:
                  shas.append(line)
          links = [{
              'relation': ['delegate_permission/common.handle_all_urls'],
              'target': {'namespace': 'android_app', 'package_name': os.environ['PACKAGE'], 'sha256_cert_fingerprints': shas},
          }]
          open(os.path.join(os.environ['RUNNER_TEMP'], 'out', 'assetlinks.json'), 'w', encoding='utf-8').write(json.dumps(links, indent=2) + '\n')
          print('assetlinks.json:', shas)
          PY

      - name: Store listing and build.json
        if: steps.key.outputs.mode == 'release'
        env:
          SHA: ${{ steps.key.outputs.sha }}
        run: |
          zip -qr "$RUNNER_TEMP/out/store-listing.zip" STORE.md store
          jq -n --arg sha "$SHA" --arg commit "$GITHUB_SHA" --arg url "https://$APP_HOST$APP_PATH" --arg pkg "$PACKAGE" --argjson code "$VERSION_CODE" \
            '{app: "data-embed-for-clients", package: $pkg, url: $url, versionCode: $code, signed: true,
              uploadKeySha256: $sha, commit: $commit, built: (now | todate)}' > "$RUNNER_TEMP/out/build.json"
          cat "$RUNNER_TEMP/out/build.json"

      - name: Save the encrypted key to the repo
        if: steps.key.outputs.mode == 'release'
        run: |
          git add "$KS_ENC"
          if git diff --cached --quiet; then echo "המפתח כבר בריפו"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "הטמעת נתונים — אנדרואיד: מפתח העלאה מוצפן (נוצר בבנייה $VERSION_CODE)"
          for i in 1 2 3; do
            # --autostash: הבנייה משאירה קבצים ששונו, ובלעדיו pull --rebase מסרב
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          echo "::error::לא הצלחתי לשמור את המפתח המוצפן בריפו — אל תעלו לחנות את הבנייה הזאת"; exit 1

      - name: Upload (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: data-embed-for-clients-${{ env.VERSION_CODE }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      - name: Publish the store folder (Release data-embed-for-clients-store)
        if: steps.key.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-embed-for-clients-store
          name: הטמעת נתונים — תיקיית החנות
          make_latest: false
          body: |
            מתעדכן לבד בכל בנייה מ-main (`.github/workflows/data-embed-for-clients-twa.yml`).
            - `data-embed-for-clients.apk` — התקנה ידנית בטלפון
            - `data-embed-for-clients.aab` — להעלאה ל-Play Console
            - `store-listing.zip` — טקסטים, תמונות ותשובות למדיניות
            - `assetlinks.json`, `build.json`
          files: ${{ runner.temp }}/out/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          MODE: ${{ steps.key.outputs.mode }}
          SHA: ${{ steps.key.outputs.sha }}
        run: |
          {
            echo "## הטמעת נתונים — אנדרואיד, בנייה $VERSION_CODE"
            echo "- כתובת: \`https://$APP_HOST$APP_PATH\`"
            if [ "$MODE" = "release" ]; then
              echo "- **חתום** — APK, AAB ו-store-listing.zip ב-Release \`data-embed-for-clients-store\`"
              echo "- טביעת מפתח ההעלאה (SHA-256): \`$SHA\`"
              echo "- אחרי ההעלאה הראשונה: Play Console → App integrity → את ה-SHA-256 של **App signing key** להוסיף ל-\`data-embed-for-clients/android/play-signing-sha256.txt\`"
            else
              echo "- ענף משנה: רק בדיקה שהקוד נבנה. ה-Release מתעדכן מ-main"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
