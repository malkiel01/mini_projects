name: Build Greeting Cards APK

# בונה את אפליקציית כרטיסי הברכה כ-APK.
# ה-APK חתום ב-debug — מספיק להתקנה ידנית (sideload).

on:
  push:
    paths:
      - 'greeting-cards/android/**'
      - '.github/workflows/greeting-cards-apk.yml'
  workflow_dispatch:
    inputs:
      webUrl:
        description: 'כתובת אתר כרטיסי הברכה'
        required: false
        default: 'https://mbe-plus.com/mini_projects/greeting-cards/'

defaults:
  run:
    working-directory: greeting-cards/android

jobs:
  build:
    runs-on: ubuntu-latest
    # נדרש כדי לפרסם את ה-APK כ-Release (ראו השלב האחרון).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ‏packages נדרש במפורש: ברירת המחדל של הפעולה מתקינה גם את
      # החבילה 'tools', שהוסרה ממאגר ה-SDK — sdkmanager נכשל עליה
      # ‏("Failed to find package 'tools'") לפני שהבנייה בכלל מתחילה.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
             -PwebUrl="${{ github.event.inputs.webUrl || 'https://mbe-plus.com/mini_projects/greeting-cards/' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: greeting-cards-apk
          path: greeting-cards/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ‏Artifact של Actions אינו ניתן להורדה מהטלפון. ל-Release יש קישור הורדה
      # ישיר — והוא הקישור שבכרטיס של הכלי בדף הראשי ("⬇️ הורדת APK", ב-app.json).
      # התג נייח ומתעדכן בכל בנייה, כך שהקישור תמיד מצביע ל-APK האחרון. רק מ-main:
      # בנייה מענף אחר לא מחליפה את מה שהמשתמשים מורידים.
      - name: Publish APK to a GitHub Release (mobile-friendly)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: greeting-cards-apk
          name: כרטיסי ברכה — APK (debug)
          body: |
            APK בחתימת debug להתקנה ידנית בטלפון (sideload).
            מתעדכן אוטומטית בכל בנייה מ-main.
          files: greeting-cards/android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
