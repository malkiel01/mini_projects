name: Build Project Manager APK
# אפליקציית האנדרואיד של ניהול הפרויקטים (project-manager/android) — האתר בתוך WebView, ושיתוף ישיר
# מתפריט "שיתוף" של הטלפון לתיקיות האחרונות. README: project-manager/README.md, "אפליקציית אנדרואיד".
#
# חתימה קבועה — כדי שהעדכונים יותקנו מעל הגרסה הקודמת (חתימת debug משתנה בכל בנייה, ואז אנדרואיד
# מסרב לעדכן). המפתח נוצר בבנייה הראשונה מ-main, מוצפן (AES-256) ונשמר בריפו:
# project-manager/android/keystore/release.jks.enc. סיסמת ההצפנה נגזרת מהסוד DEPLOY_SSH_KEY שכבר קיים
# (לא נדרש סוד חדש), ואינה מודפסת. מוצפן — חסר ערך בלי הסוד.
# אם DEPLOY_SSH_KEY הוחלף — הפענוח נכשל והבנייה עוצרת. אז: למחוק את release.jks.enc, ובנייה חדשה
# תיצור מפתח חדש; בטלפון צריך להסיר את האפליקציה פעם אחת ולהתקין מחדש.
#
# בנייה מ-PR — רק בדיקה שהקוד נבנה (חתימת debug, artifact). רק מ-main — Release עם קישור הורדה קבוע:
# https://github.com/malkiel01/mini_projects/releases/download/project-manager-apk/project-manager.apk
on:
  push:
    branches: [main]
    paths:
      - 'project-manager/android/**'
      - 'project-manager/assets/icon-maskable-512.png'
      - '.github/workflows/project-manager-apk.yml'
  pull_request:
    paths:
      - 'project-manager/android/**'
      - '.github/workflows/project-manager-apk.yml'
  workflow_dispatch: {}

concurrency:
  group: project-manager-apk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: project-manager/android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # המפתח המוצפן (בבנייה הראשונה) ו-Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ‏packages במפורש: ברירת המחדל מתקינה גם את 'tools', שהוסרה ממאגר ה-SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Signing key (main only)
        id: key
        if: github.ref == 'refs/heads/main'
        env:
          SEED: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SEED:-}" ]; then echo "::warning::אין DEPLOY_SSH_KEY — APK בחתימת debug"; exit 0; fi
          export PASS=$(printf 'pm-android:%s' "$SEED" | sha256sum | cut -c1-48)
          echo "::add-mask::$PASS"
          mkdir -p keystore
          if [ -f keystore/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in keystore/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
              || { echo "::error::פענוח המפתח נכשל — DEPLOY_SSH_KEY הוחלף? ראו את ההסבר בראש הקובץ"; exit 1; }
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias pm -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Project Manager, O=mbe-plus, C=IL"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -in "$RUNNER_TEMP/release.jks" -out keystore/release.jks.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks.enc
            git commit -m "ניהול פרויקטים — אנדרואיד: מפתח החתימה (מוצפן)"
            git pull --rebase origin main && git push origin HEAD:main
          fi
          echo "PASS=$PASS" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build APK
        run: |
          set -euo pipefail
          ARGS="-PversionCode=${{ github.run_number }}"
          if [ "${{ steps.key.outputs.signed }}" = "1" ]; then ARGS="$ARGS -PkeystoreFile=$RUNNER_TEMP/release.jks -PkeystorePassword=$PASS"; fi
          gradle assembleRelease --no-daemon $ARGS
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/project-manager.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: project-manager-apk
          path: ${{ runner.temp }}/project-manager.apk
          if-no-files-found: error

      # ‏Artifact לא ניתן להורדה מהטלפון; ל-Release יש קישור ישיר וקבוע — הוא שבמסך "התקנה במכשיר"
      # (assets/js/app.js, APK_URL) וב-app.json. רק מ-main ורק חתום.
      - name: Publish to a GitHub Release
        if: github.ref == 'refs/heads/main' && steps.key.outputs.signed == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-manager-apk
          name: ניהול פרויקטים — אפליקציית אנדרואיד
          body: |
            אפליקציית האנדרואיד של ניהול הפרויקטים — עם שיתוף ישיר לתיקיות האחרונות מתפריט "שיתוף".
            מתעדכנת אוטומטית בכל בנייה מ-main. גרסה ${{ github.run_number }}.
          files: ${{ runner.temp }}/project-manager.apk
          fail_on_unmatched_files: true
