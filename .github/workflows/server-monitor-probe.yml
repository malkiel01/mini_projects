# זמני — בדיקה חד-פעמית (קריאה בלבד) של מה חשבון האחסון חושף, לאפיון server-monitor.
# רץ רק בענף הזה, לעולם לא ממוזג. הפלט מוצפן למפתח שאינו בריפו (הריפו ציבורי).
name: Server monitor probe (temporary)
on:
  push:
    branches: [server-monitor-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Unlock the deploy key if it has a passphrase
        env:
          DEPLOY_PASS: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        run: |
          [ -n "$DEPLOY_PASS" ] || exit 0
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_PASS"\n' > "$RUNNER_TEMP/askpass"
          chmod +x "$RUNNER_TEMP/askpass"
          SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm -f "$RUNNER_TEMP/askpass"
      - name: Probe and encrypt
        env:
          DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqUfGKg+1azpmwMtrv+Td
          ilrqR3Fsc5Gq4d+4lc8EiN8TDsLNzwdha5x2kT/yHsfEGTCrgfMeaxW5DBxcfMTi
          EUcG0c1bgngcDQUi9iI7fsUAgsU3OMwQTdMwV7Dpjk/RZfWOBY1/pM8c5WbwVe90
          xA43vIVwR7xkZ7a2eknF8pfxi26wBSroiFDocOBRJScJTmCSEZN/dJR8K9SHR1NR
          R7WJEDfAYrtVv5AqxXzDhTboXcsSTNmoiikzf6AX8nGxPvVpKtL4xMFa1Vwi8HAO
          duB1yjuYWnkGdpqYWc/aHH0it9+kcEESggUsAxta3gqJ36mavGmwCSy68VWMllV0
          C+Omo0GEpF7+3m84aag0UageCsqxJOO7Hm/WP6wHZ4yGifG8Subh/zRvtg2lY9JN
          WkbQHFE4nJUSXQSFaVHhI7i6rvmXjGNYYmvG2XDU8qas+d5GyzsbZbrPArxB9RQ3
          eDjwPWY6TNbvcQPZ0ioicriwvwAAaP2LUFEuA8VN3x9lAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' pub.pem
          ok=0
          for w in 0 30 90 180; do
            sleep $w
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEST" "cd '${DEPLOY_PATH%/}' && php" < server-monitor/probe/probe.php > out.json; then ok=1; break; fi
          done
          [ $ok = 1 ] || exit 1
          echo "bytes: $(wc -c < out.json)"
          gzip -9 out.json
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out.json.gz -out out.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out k.enc
          echo "KEY:$(base64 -w0 k.enc)"
          echo "DATA:$(base64 -w0 out.enc)"
