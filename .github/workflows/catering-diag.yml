name: Catering push diagnostics

# אבחון התראות של catering-menu: מתחבר לשרת עם מפתח הפריסה ומדפיס מצב —
# מכשירים רשומים, יומן השליחות, מצב התזכורות וה-cron, ושגיאות PHP.
# בנוסף מוודא שקיימת ב-crontab שורת התקתוק של התזכורות (פעם ב-5 דקות) —
# בלעדיה תזכורות יוצאות רק כשמישהו נכנס לאתר. לא מעלה קבצים — אינו פריסה.
# רץ רק בדחיפה לענף diag/catering-menu.
# הלוג ציבורי (ריפו ציבורי) — לכן הסקריפט לא מדפיס שמות לקוחות או מפתחות.

on:
  push:
    branches: [diag/catering-menu]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Unlock the deploy key if it has a passphrase
        env:
          DEPLOY_PASS: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        run: |
          [ -z "$DEPLOY_PASS" ] && exit 0
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_PASS"\n' > "$RUNNER_TEMP/askpass"
          chmod +x "$RUNNER_TEMP/askpass"
          SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm -f "$RUNNER_TEMP/askpass"
      - name: Ensure the reminders cron line
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          for wait in 0 30 90 180; do
            sleep "$wait"
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$USER_@$HOST" bash -s <<'SH'
          LINE='*/5 * * * * curl -s "https://mbe-plus.com/mini_projects/catering-menu/api.php?action=tick" >/dev/null 2>&1'
          current="$(crontab -l 2>/dev/null || true)"
          if printf '%s\n' "$current" | grep -qF 'catering-menu/api.php?action=tick'; then
            echo "שורת התזכורות כבר קיימת ב-crontab"
          else
            { [ -n "$current" ] && printf '%s\n' "$current"; printf '%s\n' "$LINE"; } | crontab -
            echo "נוספה שורת התזכורות ל-crontab"
          fi
          echo "--- crontab (שורות catering בלבד):"
          crontab -l 2>/dev/null | grep -F 'catering-menu' || echo "(אין)"
          SH
            then exit 0; fi
            echo "::warning::החיבור נכשל — מנסה שוב"
          done
          exit 1

      - name: Send a test push (only when the commit message has [test-push])
        if: contains(github.event.head_commit.message, '[test-push]')
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$USER_@$HOST" \
            "cd '$PATH_/catering-menu' && php -d display_errors=1 2>&1" < .github/diag/catering-testpush.php

      - name: Read push state from the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
        run: |
          for wait in 0 30 90 180; do
            sleep "$wait"
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$USER_@$HOST" \
                 "cd '$PATH_/catering-menu' && php -d display_errors=1 2>&1" < .github/diag/catering-push.php; then
              exit 0
            fi
            echo "::warning::החיבור נכשל — מנסה שוב"
          done
          exit 1
