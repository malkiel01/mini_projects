<section class="tk-faq">
  <h2 class="tk-faq__title">שאלות נפוצות</h2>
  <p class="tk-faq__intro">לא מצאתם תשובה? כתבו לנו.</p>
  <section class="kol-acc kol-acc--one" data-kol-component="accordion">
    <details class="kol-acc__item" open>
      <summary class="kol-acc__title">מה זה קול מרוקו?</summary>
      <div class="kol-acc__body">
        <p>מילון של מילים מרוקאיות, עם התרגום וההקלטה של כל מילה.</p>
      </div>
    </details>
    <details class="kol-acc__item">
      <summary class="kol-acc__title">איך מחפשים מילה?</summary>
      <div class="kol-acc__body">
        <p>כותבים בשורת החיפוש — בעברית או בתעתיק.</p>
      </div>
    </details>
    <details class="kol-acc__item">
      <summary class="kol-acc__title">אפשר להציע מילה חדשה?</summary>
      <div class="kol-acc__body">
        <p>כן — בטופס שבתחתית העמוד.</p>
      </div>
    </details>
  </section>
</section>
