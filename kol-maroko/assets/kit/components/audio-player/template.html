<div class="kol-audio">
  <audio class="kol-audio__el" controls preload="metadata"></audio>
  <button class="kol-audio__play" type="button"><span class="kol-audio__icon" aria-hidden="true"></span><span class="kol-audio__vh kol-audio__t-play">נגן</span><span class="kol-audio__vh kol-audio__t-pause">השהה</span></button>
  <div class="kol-audio__info">
    <span class="kol-audio__title">שם ההקלטה</span>
    <label class="kol-audio__seekwrap"><span class="kol-audio__vh">מיקום בהקלטה</span><input class="kol-audio__seek" type="range" min="0" max="1000" value="0" step="1"></label>
  </div>
  <span class="kol-audio__time">0:00</span>
</div>
