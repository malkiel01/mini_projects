<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>הדמיה — נגרות בתלת מימד</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body class="view-page">
<!-- צפיית לקוח: לפי אסימון בלבד, בלי כניסה. תלת מימד והדמיה — בלי מחירים ובלי רשימת חיתוך. -->
<header class="bar">
  <div class="bar__titles">
    <h1 class="bar__title"><span id="view-name">הדמיה</span></h1>
    <span class="bar__sub" id="view-sub"></span>
  </div>
  <div class="views">
    <button type="button" data-view="iso">איזומטרי</button>
    <button type="button" data-view="front">חזית</button>
    <button type="button" data-view="side">צד</button>
    <button type="button" data-view="top">מבט על</button>
  </div>
</header>
<main class="view-main">
  <div class="stage-wrap">
    <canvas id="stage" class="stage"></canvas>
    <div id="view-error" class="stage-error" hidden></div>
  </div>
  <div class="part" id="part"><p class="muted">גרירה מסובבת; שתי אצבעות או גלגלת מזמנות. הקשה על לוח מציגה את מידותיו.</p></div>
</main>
<script>
(function load(list) {
  function app() { var s = document.createElement('script'); s.type = 'module'; s.src = './assets/js/view.js'; document.body.appendChild(s); }
  if (!list.length) { app(); return; }
  var s = document.createElement('script'); s.src = list[0];
  s.onload = function () { if (window.THREE) app(); else load(list.slice(1)); };
  s.onerror = function () { load(list.slice(1)); };
  document.head.appendChild(s);
})(['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    './vendor/three.min.js']);
</script>
</body>
</html>
