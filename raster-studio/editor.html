<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#2d4a8a">
  <title>עיצוב רסטר</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="editor">
  <header class="top">
    <a class="icon-btn" href="index.html" aria-label="חזרה לתמונות שלי">→</a>
    <div class="titles"><h1 id="title">&nbsp;</h1><div class="sub" id="meta">&nbsp;</div></div>
    <!-- מימין לשמאל: החצים מראה — "ביטול" מצביע ימינה, כמו בגוגל דוקס בעברית -->
    <button class="icon-btn" id="adjust-btn" type="button" aria-label="תיקונים: בהירות, גוון, טשטוש" title="תיקונים" disabled>🎚️</button>
    <button class="icon-btn" id="save-btn" type="button" aria-label="שמירה בשרת" title="שמירה בשרת (Ctrl+S)" aria-keyshortcuts="Control+S" disabled>💾</button>
    <button class="icon-btn" id="versions-btn" type="button" aria-label="גרסאות קודמות" title="גרסאות" disabled>🕘</button>
    <button class="icon-btn" id="export-btn" type="button" aria-label="הורדה: PNG, JPG, ORA או ‎.mbe" title="הורדה" disabled>⬇️</button>
    <button class="icon-btn" id="undo-btn" type="button" aria-label="ביטול" aria-keyshortcuts="Control+Z" disabled>↷</button>
    <button class="icon-btn" id="redo-btn" type="button" aria-label="ביצוע מחדש" aria-keyshortcuts="Control+Shift+Z" disabled>↶</button>
  </header>

  <div class="work">
    <main class="stage" id="stage" aria-label="קנבס">
      <canvas id="canvas"></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <textarea class="text-edit" id="text-edit" hidden aria-label="טקסט" spellcheck="false" autocomplete="off" rows="1"></textarea>
      <div class="brush-cursor" id="brush-cursor" hidden></div>
      <p class="stage-msg" id="msg" role="status">טוען…</p>
      <nav class="tools" id="tools" aria-label="כלים">
        <label class="swatch" id="color-wrap" title="צבע"><input type="color" id="color" aria-label="צבע"></label>
      </nav>
      <section class="adjust" id="adjust" aria-labelledby="adjust-title" hidden>
        <header class="adjust-head"><h2 id="adjust-title">תיקונים</h2><span class="hint one" id="adjust-layer"></span></header>
        <div class="seg-tabs" role="tablist" aria-label="סוג התיקון">
          <button type="button" role="tab" data-adj-tab="bc">בהירות</button>
          <button type="button" role="tab" data-adj-tab="hsl">גוון</button>
          <button type="button" role="tab" data-adj-tab="blur">טשטוש</button>
        </div>
        <div class="adjust-fields" data-adj="bc">
          <label class="opt"><span>בהירות <output for="adj-brightness">0</output></span><input id="adj-brightness" type="range" min="-100" max="100" value="0"></label>
          <label class="opt"><span>ניגודיות <output for="adj-contrast">0</output></span><input id="adj-contrast" type="range" min="-100" max="100" value="0"></label>
        </div>
        <div class="adjust-fields" data-adj="hsl" hidden>
          <label class="opt"><span>גוון <output for="adj-hue">0</output></span><input id="adj-hue" type="range" min="-180" max="180" value="0"></label>
          <label class="opt"><span>רוויה <output for="adj-saturation">0</output></span><input id="adj-saturation" type="range" min="-100" max="100" value="0"></label>
          <label class="opt"><span>בהירות <output for="adj-lightness">0</output></span><input id="adj-lightness" type="range" min="-100" max="100" value="0"></label>
        </div>
        <div class="adjust-fields" data-adj="blur" hidden>
          <label class="opt"><span>רדיוס <output for="adj-radius">0</output></span><input id="adj-radius" type="range" min="0" max="64" value="0"></label>
        </div>
        <div class="adjust-actions">
          <button class="btn ghost" type="button" data-adj-act="cancel">✕ ביטול</button>
          <button class="btn primary" type="button" data-adj-act="apply">✓ החלה</button>
        </div>
      </section>
      <div class="tool-opts" id="tool-opts" role="group" aria-label="אפשרויות הכלי">
        <label class="opt" data-for="brush eraser"><span>גודל <output for="opt-size"></output></span>
          <input id="opt-size" type="range" min="0" max="100" step="1"></label>
        <label class="opt" data-for="brush eraser"><span>קשיות <output for="opt-hardness"></output></span>
          <input id="opt-hardness" type="range" min="0" max="100" step="1"></label>
        <label class="opt" data-for="brush eraser bucket"><span>אטימות <output for="opt-opacity"></output></span>
          <input id="opt-opacity" type="range" min="1" max="100" step="1"></label>
        <label class="opt" data-for="bucket wand"><span>סבולת <output for="opt-tolerance"></output></span>
          <input id="opt-tolerance" type="range" min="0" max="255" step="1"></label>
        <label class="opt-check" data-for="wand"><input id="opt-contiguous" type="checkbox" checked><span>רציף</span></label>
        <label class="opt-check" data-for="wand"><input id="opt-sample-all" type="checkbox"><span>כל השכבות</span></label>
        <label class="opt opt-font" data-for="text"><span>גופן</span><select id="opt-font"></select></label>
        <label class="opt opt-num" data-for="text"><span>גודל</span><input id="opt-font-size" type="number" min="4" max="1000" value="48" inputmode="numeric" dir="ltr"></label>
        <div class="opt-btns" data-for="text">
          <button class="icon-btn" type="button" id="opt-bold" aria-pressed="false" aria-label="מודגש"><b>B</b></button>
          <fieldset class="seg opt-seg" aria-label="יישור">
            <label><input type="radio" name="align" value="start" checked><span aria-label="לימין">⇥</span></label>
            <label><input type="radio" name="align" value="center"><span aria-label="למרכז">↔</span></label>
            <label><input type="radio" name="align" value="end"><span aria-label="לשמאל">⇤</span></label>
          </fieldset>
          <button class="btn ghost" type="button" data-text="cancel" disabled>✕</button>
          <button class="btn primary" type="button" data-text="apply" disabled>✓ אישור</button>
        </div>
        <div class="opt-btns xf-opts" data-for="crop">
          <span class="hint one" id="crop-info" dir="ltr"></span>
          <button class="btn ghost" type="button" data-crop="cancel" disabled>✕ ביטול</button>
          <button class="btn primary" type="button" data-crop="apply" disabled>✓ חיתוך</button>
        </div>
        <div class="opt-btns xf-opts" data-for="move">
          <span class="hint one" id="xf-info" dir="ltr"></span>
          <button class="btn ghost" type="button" data-xf="cancel" disabled>✕ ביטול</button>
          <button class="btn primary" type="button" data-xf="apply" disabled>✓ החלה</button>
        </div>
        <fieldset class="seg opt-seg" data-for="rect ellipse lasso wand" aria-label="מצב הבחירה">
          <label><input type="radio" name="selmode" value="new" checked><span>חדשה</span></label>
          <label><input type="radio" name="selmode" value="add"><span>הוספה</span></label>
          <label><input type="radio" name="selmode" value="sub"><span>חיסור</span></label>
        </fieldset>
        <div class="opt-btns" data-for="rect ellipse lasso wand">
          <button class="icon-btn" type="button" data-sel="all" aria-label="בחירת הכול (Ctrl+A)" title="בחירת הכול (Ctrl+A)">▣</button>
          <button class="icon-btn" type="button" data-sel="none" aria-label="ביטול הבחירה (Ctrl+D)" title="ביטול הבחירה (Ctrl+D)">⊘</button>
          <button class="icon-btn" type="button" data-sel="invert" aria-label="היפוך הבחירה (Ctrl+Shift+I)" title="היפוך הבחירה (Ctrl+Shift+I)">◐</button>
          <button class="icon-btn" type="button" data-sel="fill" aria-label="מילוי הבחירה בצבע (Alt+Backspace)" title="מילוי הבחירה בצבע (Alt+Backspace)">🎨</button>
          <button class="icon-btn" type="button" data-sel="delete" aria-label="מחיקת הבחירה (Delete)" title="מחיקת הבחירה (Delete)">🗑️</button>
        </div>
      </div>
    </main>

    <aside class="panel" id="layers" aria-labelledby="layers-title">
      <header class="panel-head">
        <h2 id="layers-title">שכבות</h2>
        <button class="icon-btn panel-close" type="button" aria-label="סגירת השכבות">✕</button>
      </header>
      <div class="layer-props">
        <label class="f blend-f"><span>מיזוג</span><select id="layer-blend"></select></label>
        <label class="f opacity-f"><span>אטימות <output id="layer-opacity-out" for="layer-opacity">100%</output></span>
          <input id="layer-opacity" type="range" min="0" max="100" step="1" value="100"></label>
      </div>
      <ul class="layer-list" role="listbox" aria-label="השכבות, העליונה ראשונה"></ul>
      <div class="layer-actions">
        <button class="btn ghost" type="button" data-act="add"><span aria-hidden="true">+</span> שכבה</button>
        <button class="icon-btn" type="button" data-act="duplicate" aria-label="שכפול השכבה">⧉</button>
        <button class="icon-btn" type="button" data-act="group" aria-label="קיבוץ לקבוצה (Ctrl+G)" title="קיבוץ (Ctrl+G)">📁</button>
        <button class="icon-btn" type="button" data-act="ungroup" aria-label="פירוק הקבוצה (Ctrl+Shift+G)" title="פירוק (Ctrl+Shift+G)" hidden>📂</button>
        <button class="icon-btn" type="button" data-act="up" aria-label="העלאה בשכבה">▲</button>
        <button class="icon-btn" type="button" data-act="down" aria-label="הורדה בשכבה">▼</button>
        <button class="icon-btn" type="button" data-act="remove" aria-label="מחיקת השכבה">🗑️</button>
      </div>
    </aside>
  </div>

  <footer class="bar">
    <button class="icon-btn" id="open-btn" type="button" aria-label="הוספת תמונה כשכבה" disabled>🖼️</button>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
    <button class="btn ghost layers-btn" id="layers-btn" type="button" aria-controls="layers" aria-expanded="false" data-layer-count="1" aria-label="שכבות" disabled><span class="lbl">שכבות</span></button>
    <span class="grow hint one" id="hint" aria-live="polite"></span>
    <div class="zoom" role="group" aria-label="זום">
      <button class="icon-btn" id="zoom-out" type="button" aria-label="הקטנה">−</button>
      <button class="btn zoom-lbl" id="zoom-lbl" type="button">100%</button>
      <button class="icon-btn" id="zoom-in" type="button" aria-label="הגדלה">+</button>
    </div>
    <button class="icon-btn" id="fit-btn" type="button" aria-label="התאמה למסך">⛶</button>
  </footer>

  <dialog id="export-dlg" aria-labelledby="export-title">
    <form method="dialog">
      <header class="sheet-head">
        <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
        <h2 id="export-title">הורדה</h2>
        <span></span>
      </header>
      <div class="sheet-body">
        <div class="tiles export-tiles">
          <button type="button" class="tile" data-export="png"><span class="tile-ic">🖼️</span><b>PNG</b><small>משוטחת, עם שקיפות</small></button>
          <button type="button" class="tile" data-export="jpg"><span class="tile-ic">📷</span><b>JPG</b><small>משוטחת, קטנה, רקע לבן</small></button>
          <button type="button" class="tile" data-export="ora"><span class="tile-ic">🗂️</span><b>ORA</b><small>עם השכבות — GIMP, Krita</small></button>
          <button type="button" class="tile" data-export="mbe"><span class="tile-ic">📦</span><b>‎.mbe</b><small>הקובץ של החבילה — כל השכבות, נפתח בכל האפליקציות</small></button>
        </div>
        <p class="hint" id="export-gaps"></p>
        <button type="button" class="btn" id="versions-open" hidden>🕘 גרסאות קודמות בשרת</button>
      </div>
    </form>
  </dialog>

  <dialog id="versions-dlg" aria-labelledby="versions-title">
    <form method="dialog">
      <header class="sheet-head">
        <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
        <h2 id="versions-title">גרסאות</h2>
        <span></span>
      </header>
      <div class="sheet-body">
        <p class="hint">כל שמירה בשרת — גרסה. פתיחת גרסה ישנה לא מוחקת כלום: שמירה ממנה היא גרסה חדשה.</p>
        <ul class="versions" id="versions-list" aria-live="polite"></ul>
      </div>
    </form>
  </dialog>

  <div class="toast" role="status" hidden></div>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});</script>
  <script src="assets/js/editor.js" type="module"></script>
</body>
</html>
