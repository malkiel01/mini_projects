<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#2d4a8a">
  <title>עיצוב רסטר</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip" href="#main">דילוג לתוכן</a>
  <header class="top">
    <div class="titles"><h1>🎨 עיצוב רסטר</h1><div class="sub" id="who">&nbsp;</div></div>
  </header>

  <main id="main" tabindex="-1">
    <div class="toolbar">
      <p class="hint one" style="flex:1;margin:0">תמונות בשכבות</p>
      <button class="icon-btn ghost" id="open-btn" type="button" aria-label="פתיחת תמונה מהמכשיר">📂</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp,.ora,image/openraster" hidden>
      <button class="btn primary" id="new-btn" type="button" disabled><span aria-hidden="true">+</span> תמונה</button>
    </div>
    <p class="error" id="load-err" role="alert" hidden></p>
    <ul class="list" id="docs" aria-label="התמונות שלי" aria-busy="true"></ul>
    <p class="hint" style="margin-top:var(--s3)">בשלב הזה: קנבס, זום ופתיחת PNG / JPG / WebP. שמירה — בשלב הבא.</p>
  </main>

  <dialog id="new-dlg" aria-labelledby="new-title">
    <form method="dialog" novalidate>
      <header class="sheet-head">
        <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
        <h2 id="new-title">תמונה חדשה</h2>
        <button type="submit" class="btn primary">יצירה</button>
      </header>
      <div class="sheet-body">
        <label class="f"><span>שם *</span><input name="title" required maxlength="120" autocomplete="off"></label>
        <div class="f">
          <span id="size-lbl">גודל קנבס</span>
          <fieldset class="seg grid" style="--cols:5" aria-labelledby="size-lbl">
            <label><input type="radio" name="size" value="screen" checked><span>מסך</span></label>
            <label><input type="radio" name="size" value="square"><span>ריבוע</span></label>
            <label><input type="radio" name="size" value="story"><span>סטורי</span></label>
            <label><input type="radio" name="size" value="a4"><span>A4</span></label>
            <label><input type="radio" name="size" value="custom"><span>אחר</span></label>
          </fieldset>
          <small class="hint" id="size-dims" dir="auto"></small>
        </div>
        <div class="fields two custom-size" hidden>
          <label class="f"><span>רוחב (פיקסלים)</span><input name="w" inputmode="numeric" dir="ltr" value="1920"></label>
          <label class="f"><span>גובה (פיקסלים)</span><input name="h" inputmode="numeric" dir="ltr" value="1080"></label>
        </div>
        <p class="error" role="alert" hidden></p>
      </div>
    </form>
  </dialog>

  <div class="toast" role="status" hidden></div>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});</script>
  <script src="assets/js/app.js" type="module"></script>
</body>
</html>
