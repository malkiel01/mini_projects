<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="assets/js/i18n.js?v=22"></script>
    <script src="assets/js/theme.js?v=89"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#2d4a8a">
    <meta name="color-scheme" content="light dark">
    <title>כניסה — ניהול פרויקטים</title>
    <link rel="stylesheet" href="assets/css/app.css?v=22">
    <link rel="icon" href="assets/icon.svg">
    <!-- אפליקציה עצמאית במסך הבית: מניפסט לאנדרואיד, ותגיות לאייפון -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="פרויקטים">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="auth">
    <main id="main" class="auth-box">
        <header class="auth-head">
            <img src="assets/icon.svg" alt="" width="40" height="40">
            <h1>ניהול פרויקטים</h1>
        </header>

        <div class="seg auth-tabs" role="radiogroup" aria-label="כניסה או הרשמה">
            <label><input type="radio" name="mode" value="login" checked><span>כניסה</span></label>
            <label><input type="radio" name="mode" value="register"><span>הרשמה</span></label>
        </div>

        <!-- מסך אחד לכל המצבים; data-modes קובע באילו מצבים שדה מוצג:
             login · register · setup (המפתח הראשון, רק כשאין משתמשים) · forgot · reset (מקישור) -->
        <p class="hint" id="mode-hint" hidden></p>
        <form id="auth-form" novalidate>
            <label class="f" data-modes="setup"><span>קוד ההקמה</span><input name="code" type="password" autocomplete="off" dir="ltr"></label>
            <label class="f" data-modes="register setup"><span>שם מלא</span><input name="display_name" maxlength="60" autocomplete="name"></label>
            <label class="f" data-modes="register setup"><span class="lbl-email">אימייל</span><input name="email" type="email" maxlength="120" autocomplete="email" dir="ltr"></label>
            <label class="f" data-modes="register"><span>טלפון</span><input name="phone" type="tel" maxlength="30" dir="ltr" autocomplete="tel"></label>
            <label class="f" data-modes="login register setup forgot"><span class="lbl-user">שם משתמש</span><input name="username" maxlength="100" autocomplete="username" dir="ltr" autocapitalize="off" spellcheck="false"></label>
            <label class="f" data-modes="login register setup reset"><span class="lbl-pass">סיסמה</span><input name="password" type="password" maxlength="200" autocomplete="current-password" dir="ltr"></label>
            <label class="f" data-modes="reset"><span>שוב, לאימות</span><input name="password2" type="password" maxlength="200" autocomplete="new-password" dir="ltr"></label>
            <p class="error" id="auth-error" role="alert" hidden></p>
            <p class="ok" id="auth-ok" role="status" hidden></p>
            <button class="btn primary" id="auth-submit">כניסה</button>
            <button type="button" class="btn ghost" data-modes="login" data-go="forgot">שכחתי סיסמה</button>
            <button type="button" class="btn ghost" data-modes="forgot" data-go="login">חזרה לכניסה</button>
        </form>

        <section id="waiting" class="waiting" hidden aria-live="polite">
            <p class="big" aria-hidden="true">⏳</p>
            <h2 id="waiting-title"></h2>
            <p id="waiting-text" class="hint"></p>
            <div class="row-btns">
                <button class="btn ghost" id="recheck">בדיקה שוב</button>
                <button class="btn ghost" id="logout">יציאה</button>
            </div>
        </section>
    </main>
    <script src="assets/js/login.js?v=21"></script>
</body>
</html>
