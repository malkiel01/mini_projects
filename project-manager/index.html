<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d4a8a">
    <title>ניהול פרויקטים</title>
    <link rel="stylesheet" href="assets/css/app.css?v=1">
    <link rel="icon" href="assets/icon.svg">
</head>
<body>
    <header class="top">
        <a class="home" href="../" title="חזרה לאפליקציות">←</a>
        <h1>📊 ניהול פרויקטים</h1>
        <div class="who" id="who"></div>
    </header>

    <nav class="tabs" id="tabs">
        <button data-tab="client" class="active">👤 לקוחות</button>
        <button data-tab="supplier">🧰 ספקים</button>
        <button data-tab="lawyer">⚖️ עורכי דין</button>
        <button data-tab="trades" class="dev-only" hidden>🏷️ תחומים</button>
    </nav>

    <main id="main">
        <section id="contacts-view">
            <div class="toolbar">
                <input type="search" id="q" placeholder="חיפוש לפי שם, עסק, טלפון או אימייל" autocomplete="off">
                <select id="trade-filter" hidden><option value="">כל התחומים</option></select>
                <label class="check"><input type="checkbox" id="show-archived"> ארכיון</label>
                <button class="primary" id="add">+ חדש</button>
            </div>
            <div id="list" class="list"></div>
        </section>

        <section id="trades-view" hidden>
            <p class="hint">התחומים משותפים לכל המנהלים. תחום שמשויך לספק לא ניתן למחיקה.</p>
            <form id="trade-add" class="toolbar">
                <input id="trade-name" placeholder="תחום חדש" maxlength="40" required>
                <button class="primary">הוספה</button>
            </form>
            <ul id="trade-list" class="trade-list"></ul>
        </section>
    </main>

    <dialog id="editor">
        <form id="form" method="dialog" novalidate>
            <h2 id="form-title"></h2>
            <div class="grid">
                <label>שם *<input name="name" required maxlength="100"></label>
                <label class="k-supplier k-lawyer">שם העסק / המשרד<input name="company" maxlength="100"></label>
                <label><span class="lbl-tax">ח.פ. / ע.מ.</span><input name="tax_id" maxlength="20" inputmode="numeric"></label>
                <label>טלפון<input name="phone" type="tel" maxlength="30" dir="ltr"></label>
                <label>וואטסאפ <small>(אם שונה)</small><input name="whatsapp" type="tel" maxlength="30" dir="ltr"></label>
                <label>אימייל<input name="email" type="email" maxlength="120" dir="ltr"></label>
                <label class="wide">כתובת<input name="address" maxlength="200"></label>
            </div>

            <fieldset class="k-supplier">
                <legend>תחומים</legend>
                <div id="trade-chips" class="chips"></div>
            </fieldset>

            <fieldset class="k-supplier">
                <legend>פרטי בנק <small>(יוצגו ללקוח בדרישת תשלום)</small></legend>
                <div class="grid">
                    <label>בנק<input name="bank.bank" maxlength="60"></label>
                    <label>סניף<input name="bank.branch" maxlength="60" inputmode="numeric"></label>
                    <label>מספר חשבון<input name="bank.account" maxlength="60" inputmode="numeric"></label>
                    <label>על שם<input name="bank.holder" maxlength="60"></label>
                </div>
            </fieldset>

            <fieldset class="k-client">
                <legend>הגדרות הלקוח</legend>
                <label>עורך הדין
                    <select name="settings.lawyer_id"><option value="">— ללא —</option></select>
                </label>
                <div class="row">
                    <span class="row-label">אופן אישור</span>
                    <label class="check"><input type="radio" name="settings.approval_method" value="click"> לחיצה על "מאשר"</label>
                    <label class="check"><input type="radio" name="settings.approval_method" value="signature"> חתימה ביד</label>
                </div>
                <div class="row">
                    <span class="row-label">ערוצי הודעות</span>
                    <label class="check"><input type="checkbox" name="settings.channels" value="email"> אימייל</label>
                    <label class="check"><input type="checkbox" name="settings.channels" value="whatsapp"> וואטסאפ</label>
                    <label class="check"><input type="checkbox" name="settings.channels" value="sms"> SMS</label>
                </div>
                <div class="row">
                    <span class="row-label">מי משלם בדרך כלל</span>
                    <label class="check"><input type="radio" name="settings.default_payer" value="client"> הלקוח</label>
                    <label class="check"><input type="radio" name="settings.default_payer" value="lawyer"> העו"ד</label>
                </div>
            </fieldset>

            <fieldset class="k-supplier">
                <legend>דירוג פנימי</legend>
                <div class="stars" id="stars"></div>
            </fieldset>

            <label class="wide">הערות<textarea name="notes" rows="3" maxlength="4000"></textarea></label>

            <p class="error" id="form-error" hidden></p>
            <div class="actions">
                <button type="button" id="archive" class="ghost" hidden></button>
                <span class="spacer"></span>
                <button type="button" id="cancel" class="ghost">ביטול</button>
                <button type="submit" class="primary" id="save">שמירה</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="assets/js/app.js?v=1"></script>
</body>
</html>
