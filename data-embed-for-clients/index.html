<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הטמעת נתונים לריכוז לקוחות</title>
    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            direction: rtl;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header a {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            opacity: 0.8;
        }
        header a:hover { opacity: 1; }
        header h1 { font-size: 1.4rem; }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .step {
            background: white;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .step.hidden { display: none; }
        .step h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #1a1a2e;
            border-bottom: 2px solid #e8e8e8;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-group input[type="file"],
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a6cf7;
        }
        .coords-row {
            display: flex;
            gap: 16px;
        }
        .coords-row .form-group { flex: 1; }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #4a6cf7;
            color: white;
        }
        .btn-primary:hover { background: #3a5ce5; }
        .btn-primary:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover { background: #16a34a; }
        .btn-secondary {
            background: #e8e8e8;
            color: #333;
        }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 6px 14px;
            font-size: 0.85rem;
        }
        .btn-danger:hover { background: #dc2626; }
        .preview-area {
            position: relative;
            display: inline-block;
            margin-top: 12px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            max-width: 100%;
            cursor: crosshair;
        }
        .preview-area img {
            display: block;
            max-width: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }
        .text-handle {
            position: absolute;
            cursor: grab;
            user-select: none;
        }
        .text-handle.active .handle {
            display: block;
        }
        .text-handle.active .rotate-line {
            display: block;
        }
        .text-handle.active .border-box {
            display: block;
        }
        .text-handle.dragging {
            cursor: grabbing;
        }
        .border-box {
            display: none;
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 2px dashed #4a6cf7;
            pointer-events: none;
        }
        .preview-text {
            color: #000;
            white-space: pre;
            pointer-events: none;
        }
        .handle {
            display: none;
            position: absolute;
            background: #4a6cf7;
            border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .rh {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        .rh-tl { top: -11px; left: -11px; cursor: nwse-resize; }
        .rh-tc { top: -11px; left: 50%; margin-left: -5px; cursor: ns-resize; }
        .rh-tr { top: -11px; right: -11px; cursor: nesw-resize; }
        .rh-ml { top: 50%; left: -11px; margin-top: -5px; cursor: ew-resize; }
        .rh-mr { top: 50%; right: -11px; margin-top: -5px; cursor: ew-resize; }
        .rh-bl { bottom: -11px; left: -11px; cursor: nesw-resize; }
        .rh-bc { bottom: -11px; left: 50%; margin-left: -5px; cursor: ns-resize; }
        .rh-br { bottom: -11px; right: -11px; cursor: nwse-resize; }
        .rotate-handle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            top: -32px;
            left: 50%;
            margin-left: -7px;
            cursor: grab;
        }
        .rotate-line {
            position: absolute;
            width: 1px;
            height: 22px;
            background: #4a6cf7;
            top: -22px;
            left: 50%;
            display: none;
            pointer-events: none;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .records-table th,
        .records-table td {
            padding: 10px 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        .records-table th {
            background: #f8f9fa;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .records-table tr:hover td { background: #fafbff; }
        .add-record-form {
            display: flex;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .add-record-form .form-group { margin-bottom: 0; }
        .settings-summary {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        .settings-summary span { color: #555; }
        .settings-summary strong { color: #1a1a2e; }
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .font-size-group {
            display: flex;
            gap: 16px;
            align-items: end;
        }
        .font-size-group .form-group { flex: 1; }
        .progress-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .progress-overlay.hidden { display: none; }
        .progress-box {
            background: white;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            min-width: 280px;
        }
        .progress-box .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4a6cf7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .color-preview {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            vertical-align: middle;
        }
        .font-selector select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 10px;
            background: white;
        }
        .font-selector select:focus {
            outline: none;
            border-color: #4a6cf7;
        }
        .font-upload-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .save-font-label {
            white-space: nowrap;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .font-color-row {
            display: flex;
            gap: 16px;
            align-items: end;
            flex-wrap: wrap;
        }
        .font-color-row .form-group { flex: 1; min-width: 140px; }
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: white;
        }
        .form-group select:focus {
            outline: none;
            border-color: #4a6cf7;
        }
        /* Fields management */
        .fields-section { margin-bottom: 20px; }
        .fields-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .fields-header h3 { font-size: 1.05rem; color: #1a1a2e; }
        .fields-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .field-card {
            padding: 8px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s, background 0.2s;
        }
        .field-card:hover { border-color: #4a6cf7; }
        .field-card.active {
            border-color: #4a6cf7;
            background: #eef1ff;
        }
        .field-card .field-type-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e8e8e8;
            color: #555;
        }
        .field-card.active .field-type-badge { background: #4a6cf7; color: white; }
        .field-card .field-delete {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 2px;
            line-height: 1;
        }
        .field-card .field-delete:hover { color: #ef4444; }
        .field-settings { display: none; }
        .field-settings.visible { display: block; }
        .field-settings-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #4a6cf7;
        }
        .field-value-row {
            margin-top: 10px;
        }
        .btn-sm {
            padding: 8px 18px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html">→</a>
        <h1>הטמעת נתונים לריכוז לקוחות</h1>
    </header>

    <div class="container">
        <!-- Step 1: Settings -->
        <div class="step" id="step1">
            <h2>שלב 1: הגדרות בסיס</h2>

            <div class="form-group">
                <label>תמונת רקע (PNG / JPG)</label>
                <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg">
            </div>

            <div class="form-group">
                <label>פונט</label>
                <div class="font-selector">
                    <select id="fontSelect">
                        <option value="">-- בחר פונט שמור --</option>
                    </select>
                    <div class="font-upload-row">
                        <input type="file" id="fontInput" accept=".ttf,.otf">
                        <label class="save-font-label">
                            <input type="checkbox" id="saveFontCheck"> שמור בשרת
                        </label>
                    </div>
                </div>
            </div>

            <!-- Fields management -->
            <div class="fields-section">
                <div class="fields-header">
                    <h3>שדות</h3>
                    <button class="btn btn-primary btn-sm" id="addFieldBtn">+ הוסף שדה</button>
                </div>
                <div class="fields-list" id="fieldsList"></div>

                <div class="field-settings" id="fieldSettings">
                    <div class="field-settings-title" id="fieldSettingsTitle">הגדרות שדה</div>

                    <div class="form-group">
                        <label>שם שדה</label>
                        <input type="text" id="fieldNameInput" placeholder="שם השדה">
                    </div>

                    <div class="coords-row">
                        <div class="form-group">
                            <label>סוג ערך</label>
                            <select id="fieldValueTypeInput">
                                <option value="list">ערך מרשימה (שונה לכל מסמך)</option>
                                <option value="fixed">ערך קבוע (זהה לכולם)</option>
                            </select>
                        </div>
                    </div>

                    <div class="field-value-row" id="fixedValueRow" style="display:none;">
                        <div class="form-group">
                            <label>ערך קבוע</label>
                            <input type="text" id="fieldFixedValueInput" placeholder="הטקסט שיופיע בכל המסמכים">
                        </div>
                    </div>

                    <div class="font-color-row">
                        <div class="form-group">
                            <label>גודל פונט (px)</label>
                            <input type="number" id="fontSizeInput" value="24" min="8" max="200">
                        </div>
                        <div class="form-group">
                            <label>צבע טקסט</label>
                            <input type="color" id="textColorInput" value="#000000" class="color-preview">
                        </div>
                        <div class="form-group">
                            <label>התנהגות טקסט</label>
                            <select id="textModeInput">
                                <option value="wrap">גלישת טקסט</option>
                                <option value="fixed">מידות מקובעות</option>
                            </select>
                        </div>
                    </div>

                    <div class="coords-row">
                        <div class="form-group">
                            <label>מיקום X</label>
                            <input type="number" id="xInput" value="430" min="0">
                        </div>
                        <div class="form-group">
                            <label>מיקום Y</label>
                            <input type="number" id="yInput" value="220" min="0">
                        </div>
                        <div class="form-group">
                            <label>סיבוב (מעלות)</label>
                            <input type="number" id="rotationInput" value="0" min="-360" max="360">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>תצוגה מקדימה (גרור את הטקסט למיקום הרצוי)</label>
                <div class="preview-area" id="previewArea" style="display:none;">
                    <img id="previewImg" src="">
                    <!-- text-handles are created dynamically per field -->
                </div>
            </div>

            <button class="btn btn-primary" id="toStep2Btn" disabled>המשך לשלב הבא</button>
        </div>

        <!-- Step 2: Records -->
        <div class="step hidden" id="step2">
            <h2>שלב 2: יצירת רשומות</h2>

            <div class="settings-summary" id="settingsSummary"></div>

            <div class="add-record-form" id="addRecordForm">
                <!-- Dynamic inputs generated per list-type field -->
            </div>

            <table class="records-table" id="recordsTable">
                <thead id="recordsHead">
                    <!-- Dynamic columns -->
                </thead>
                <tbody id="recordsBody"></tbody>
            </table>

            <div class="actions-bar">
                <button class="btn btn-success" id="generateBtn" disabled>הורד ZIP</button>
                <button class="btn btn-secondary" id="backBtn">חזרה להגדרות</button>
            </div>
        </div>
    </div>

    <!-- Progress overlay -->
    <div class="progress-overlay hidden" id="progressOverlay">
        <div class="progress-box">
            <div class="spinner"></div>
            <div id="progressText">מייצר קבצים...</div>
        </div>
    </div>

    <script>
        if (!window.jspdf) {
            alert('שגיאה: ספריית jsPDF לא נטענה. נסה לרענן את הדף.');
        }
        const { jsPDF } = window.jspdf;

        // State
        let imageData = null;
        let imageType = '';
        let imageWidth = 0;
        let imageHeight = 0;
        let fontData = null;
        let fontName = '';
        let records = [];

        // Fields system
        let fields = [];
        let activeFieldId = null;
        let fieldIdCounter = 0;

        function createField(name) {
            return {
                id: ++fieldIdCounter,
                name: name || 'שדה ' + fieldIdCounter,
                x: 430,
                y: 220,
                fontSize: 24,
                color: '#000000',
                rotation: 0,
                scaleX: 1,
                scaleY: 1,
                textMode: 'wrap',
                valueType: 'list',
                fixedValue: '',
                frameWidthImg: 0,
                frameHeightImg: 0,
            };
        }

        function getActiveField() {
            return fields.find(f => f.id === activeFieldId) || null;
        }

        // Elements
        const imageInput = document.getElementById('imageInput');
        const fontInput = document.getElementById('fontInput');
        const fontSelect = document.getElementById('fontSelect');
        const saveFontCheck = document.getElementById('saveFontCheck');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const textColorInput = document.getElementById('textColorInput');
        const textModeInput = document.getElementById('textModeInput');
        const xInput = document.getElementById('xInput');
        const yInput = document.getElementById('yInput');
        const rotationInput = document.getElementById('rotationInput');
        const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg');
        // textHandle and previewText are now created dynamically per field
        const toStep2Btn = document.getElementById('toStep2Btn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        // recordName and record inputs are now dynamic
        const addFieldBtn = document.getElementById('addFieldBtn');
        const fieldsList = document.getElementById('fieldsList');
        const fieldSettings = document.getElementById('fieldSettings');
        const fieldSettingsTitle = document.getElementById('fieldSettingsTitle');
        const fieldNameInput = document.getElementById('fieldNameInput');
        const fieldValueTypeInput = document.getElementById('fieldValueTypeInput');
        const fieldFixedValueInput = document.getElementById('fieldFixedValueInput');
        const fixedValueRow = document.getElementById('fixedValueRow');

        // --- FIELD MANAGEMENT ---
        addFieldBtn.addEventListener('click', () => {
            const field = createField();
            fields.push(field);
            selectField(field.id);
            renderFieldsList();
            checkStep1();
        });

        function selectField(id) {
            activeFieldId = id;
            const field = getActiveField();
            if (!field) {
                fieldSettings.classList.remove('visible');
                return;
            }
            fieldSettings.classList.add('visible');
            fieldSettingsTitle.textContent = 'הגדרות: ' + field.name;
            fieldNameInput.value = field.name;
            fieldValueTypeInput.value = field.valueType;
            fieldFixedValueInput.value = field.fixedValue;
            fixedValueRow.style.display = field.valueType === 'fixed' ? 'block' : 'none';
            fontSizeInput.value = field.fontSize;
            textColorInput.value = field.color;
            textModeInput.value = field.textMode;
            xInput.value = field.x;
            yInput.value = field.y;
            rotationInput.value = field.rotation;
            renderFieldsList();
            updateAllHandles();
        }

        function deleteField(id) {
            fields = fields.filter(f => f.id !== id);
            if (activeFieldId === id) {
                activeFieldId = fields.length > 0 ? fields[0].id : null;
                if (activeFieldId) selectField(activeFieldId);
                else fieldSettings.classList.remove('visible');
            }
            renderFieldsList();
            updateAllHandles();
            checkStep1();
        }

        function renderFieldsList() {
            fieldsList.innerHTML = '';
            fields.forEach(f => {
                const card = document.createElement('div');
                card.className = 'field-card' + (f.id === activeFieldId ? ' active' : '');
                const typeBadge = f.valueType === 'fixed' ? 'קבוע' : 'רשימה';
                card.innerHTML = `
                    <span>${escapeHtml(f.name)}</span>
                    <span class="field-type-badge">${typeBadge}</span>
                    <button class="field-delete" data-id="${f.id}">&times;</button>
                `;
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('field-delete')) {
                        deleteField(parseInt(e.target.dataset.id));
                    } else {
                        selectField(f.id);
                    }
                });
                fieldsList.appendChild(card);
            });
        }

        // Sync settings inputs → active field
        function syncFieldFromInputs() {
            const field = getActiveField();
            if (!field) return;
            field.name = fieldNameInput.value.trim() || field.name;
            field.valueType = fieldValueTypeInput.value;
            field.fixedValue = fieldFixedValueInput.value;
            field.fontSize = parseInt(fontSizeInput.value) || 24;
            field.color = textColorInput.value;
            field.textMode = textModeInput.value;
            field.x = parseInt(xInput.value) || 0;
            field.y = parseInt(yInput.value) || 0;
            field.rotation = parseInt(rotationInput.value) || 0;
        }

        // Bind all settings inputs to sync
        [fontSizeInput, xInput, yInput, rotationInput].forEach(el => {
            el.addEventListener('input', () => { syncFieldFromInputs(); updateAllHandles(); });
        });
        [textColorInput].forEach(el => {
            el.addEventListener('input', () => { syncFieldFromInputs(); updateAllHandles(); });
        });
        [textModeInput].forEach(el => {
            el.addEventListener('change', () => { syncFieldFromInputs(); });
        });
        fieldNameInput.addEventListener('input', () => {
            syncFieldFromInputs();
            fieldSettingsTitle.textContent = 'הגדרות: ' + (fieldNameInput.value.trim() || '');
            renderFieldsList();
        });
        fieldValueTypeInput.addEventListener('change', () => {
            fixedValueRow.style.display = fieldValueTypeInput.value === 'fixed' ? 'block' : 'none';
            syncFieldFromInputs();
            updateAllHandles();
        });
        fieldFixedValueInput.addEventListener('input', () => {
            syncFieldFromInputs();
            updateAllHandles();
        });
        const progressOverlay = document.getElementById('progressOverlay');
        const progressText = document.getElementById('progressText');

        // Image upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imageType = file.type === 'image/png' ? 'PNG' : 'JPEG';
            const reader = new FileReader();
            reader.onload = (ev) => {
                imageData = ev.target.result;
                previewImg.src = imageData;
                previewArea.style.display = 'inline-block';
                const img = new Image();
                img.onload = () => {
                    imageWidth = img.naturalWidth;
                    imageHeight = img.naturalHeight;
                    updateAllHandles();
                    checkStep1();
                };
                img.src = imageData;
            };
            reader.readAsDataURL(file);
        });

        // Load saved fonts from server
        async function loadSavedFonts() {
            try {
                const res = await fetch('api.php?action=list');
                const data = await res.json();
                fontSelect.innerHTML = '<option value="">-- בחר פונט שמור --</option>';
                (data.fonts || []).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.filename;
                    opt.textContent = f.name;
                    fontSelect.appendChild(opt);
                });
            } catch (e) {
                // No server / API not available - hide select
                fontSelect.style.display = 'none';
                saveFontCheck.parentElement.style.display = 'none';
            }
        }
        loadSavedFonts();

        // Select saved font from server
        fontSelect.addEventListener('change', async () => {
            const filename = fontSelect.value;
            if (!filename) return;
            try {
                const res = await fetch('fonts/' + filename);
                const buffer = await res.arrayBuffer();
                fontData = buffer;
                fontName = filename.replace(/\.(ttf|otf)$/i, '');
                fontInput.value = '';
                updateAllHandles();
                checkStep1();
            } catch (e) {
                alert('שגיאה בטעינת הפונט מהשרת');
            }
        });

        // Font upload (from file)
        fontInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fontName = file.name.replace(/\.(ttf|otf)$/i, '');
            const reader = new FileReader();
            reader.onload = async (ev) => {
                fontData = ev.target.result;
                fontSelect.value = '';
                updateAllHandles();
                checkStep1();

                // Save to server if checked
                if (saveFontCheck.checked) {
                    const formData = new FormData();
                    formData.append('font', file);
                    try {
                        const res = await fetch('api.php?action=upload', { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) {
                            await loadSavedFonts();
                            fontSelect.value = data.font.filename;
                        }
                    } catch (e) {
                        console.error('Failed to save font to server');
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // ========== MULTI-FIELD PREVIEW SYSTEM ==========
        let handleElements = {}; // { fieldId: { handle, text } }
        let dragState = null;
        let resizeState = null;
        let rotateState = null;
        let interactFieldId = null; // field being dragged/resized/rotated

        function createHandleEl(field) {
            const handle = document.createElement('div');
            handle.className = 'text-handle';
            handle.dataset.fieldId = field.id;
            handle.innerHTML = `
                <div class="preview-text">${field.valueType === 'fixed' ? escapeHtml(field.fixedValue || field.name) : escapeHtml(field.name)}</div>
                <div class="border-box"></div>
                <div class="rotate-line"></div>
                <div class="handle rotate-handle" data-type="rotate"></div>
                <div class="handle rh rh-tl" data-type="resize" data-dir="tl"></div>
                <div class="handle rh rh-tc" data-type="resize" data-dir="tc"></div>
                <div class="handle rh rh-tr" data-type="resize" data-dir="tr"></div>
                <div class="handle rh rh-ml" data-type="resize" data-dir="ml"></div>
                <div class="handle rh rh-mr" data-type="resize" data-dir="mr"></div>
                <div class="handle rh rh-bl" data-type="resize" data-dir="bl"></div>
                <div class="handle rh rh-bc" data-type="resize" data-dir="bc"></div>
                <div class="handle rh rh-br" data-type="resize" data-dir="br"></div>
            `;
            const textEl = handle.querySelector('.preview-text');

            // Click to select
            handle.addEventListener('mousedown', (e) => {
                if (e.target.dataset.type) return;
                selectField(field.id);
                e.preventDefault();
                e.stopPropagation();
                handle.classList.add('dragging');
                interactFieldId = field.id;
                dragState = {
                    startMouseX: e.clientX,
                    startMouseY: e.clientY,
                    startX: field.x,
                    startY: field.y,
                    ratioX: imageWidth / previewImg.clientWidth,
                    ratioY: imageHeight / previewImg.clientHeight,
                };
            });

            // Resize handles
            handle.querySelectorAll('[data-type="resize"]').forEach(rh => {
                rh.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    selectField(field.id);
                    interactFieldId = field.id;
                    const dir = rh.dataset.dir;
                    const textRect = textEl.getBoundingClientRect();
                    const imgScale = previewImg.clientWidth / imageWidth;
                    const nwi = (textRect.width / field.scaleX) / imgScale;
                    const nhi = (textRect.height / field.scaleY) / imgScale;
                    resizeState = {
                        dir,
                        startMouseX: e.clientX,
                        startMouseY: e.clientY,
                        startScaleX: field.scaleX,
                        startScaleY: field.scaleY,
                        textWidth: textRect.width / field.scaleX,
                        textHeight: textRect.height / field.scaleY,
                        naturalW_img: nwi,
                        naturalH_img: nhi,
                        leftEdge: field.x - nwi * field.scaleX,
                        bottomEdge: field.y + nhi * field.scaleY,
                        startX: field.x,
                        startY: field.y,
                    };
                });
            });

            // Rotate handle
            handle.querySelector('[data-type="rotate"]').addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                selectField(field.id);
                interactFieldId = field.id;
                const rect = handle.getBoundingClientRect();
                rotateState = {
                    centerX: rect.left + rect.width / 2,
                    centerY: rect.top + rect.height / 2,
                };
            });

            previewArea.appendChild(handle);
            handleElements[field.id] = { handle, text: textEl };
        }

        // Click on image → move active field
        previewArea.addEventListener('click', (e) => {
            if (e.target === previewImg && activeFieldId) {
                const field = getActiveField();
                if (!field) return;
                const rect = previewImg.getBoundingClientRect();
                field.x = Math.round((e.clientX - rect.left) * (imageWidth / previewImg.clientWidth));
                field.y = Math.round((e.clientY - rect.top) * (imageHeight / previewImg.clientHeight));
                xInput.value = field.x;
                yInput.value = field.y;
                updateAllHandles();
            }
        });

        // Deselect on outside click
        document.addEventListener('click', (e) => {
            if (!previewArea.contains(e.target) && !document.querySelector('.field-card.active')?.contains(e.target)) {
                // Don't deselect - keep active field for usability
            }
        });

        // Global mousemove for drag/resize/rotate
        document.addEventListener('mousemove', (e) => {
            const field = fields.find(f => f.id === interactFieldId);
            if (!field) return;

            if (dragState) {
                const dx = (e.clientX - dragState.startMouseX) * dragState.ratioX;
                const dy = (e.clientY - dragState.startMouseY) * dragState.ratioY;
                field.x = Math.round(dragState.startX + dx);
                field.y = Math.round(dragState.startY + dy);
                xInput.value = field.x;
                yInput.value = field.y;
                syncFieldFromInputs();
                updateAllHandles();
            }
            if (resizeState) {
                const dx = e.clientX - resizeState.startMouseX;
                const dy = e.clientY - resizeState.startMouseY;
                const dir = resizeState.dir;
                if (dir.includes('l') || dir.includes('r')) {
                    const sign = dir.includes('l') ? -1 : 1;
                    field.scaleX = Math.max(0.1, resizeState.startScaleX + (dx * sign) / resizeState.textWidth);
                }
                if (dir.includes('t') || dir.includes('b')) {
                    const sign = dir.includes('t') ? -1 : 1;
                    field.scaleY = Math.max(0.1, resizeState.startScaleY + (dy * sign) / resizeState.textHeight);
                }
                if (dir.includes('r')) {
                    field.x = Math.round(resizeState.leftEdge + resizeState.naturalW_img * field.scaleX);
                } else { field.x = resizeState.startX; }
                if (dir.includes('t')) {
                    field.y = Math.round(resizeState.bottomEdge - resizeState.naturalH_img * field.scaleY);
                } else { field.y = resizeState.startY; }
                xInput.value = field.x;
                yInput.value = field.y;
                updateAllHandles();
            }
            if (rotateState) {
                const angle = Math.atan2(e.clientY - rotateState.centerY, e.clientX - rotateState.centerX) * (180 / Math.PI) + 90;
                field.rotation = Math.round(angle);
                rotationInput.value = field.rotation;
                syncFieldFromInputs();
                updateAllHandles();
            }
        });

        document.addEventListener('mouseup', () => {
            if (interactFieldId && handleElements[interactFieldId]) {
                handleElements[interactFieldId].handle.classList.remove('dragging');
            }
            dragState = null;
            resizeState = null;
            rotateState = null;
            interactFieldId = null;
        });

        // ========== RENDER ALL HANDLES ==========
        function updateAllHandles() {
            if (!imageWidth) return;
            const imgScale = previewImg.clientWidth / imageWidth;

            // Remove handles for deleted fields
            Object.keys(handleElements).forEach(id => {
                if (!fields.find(f => f.id == id)) {
                    handleElements[id].handle.remove();
                    delete handleElements[id];
                }
            });

            fields.forEach(field => {
                // Create handle if not exists
                if (!handleElements[field.id]) {
                    createHandleEl(field);
                }
                const { handle, text } = handleElements[field.id];

                // Active state
                if (field.id === activeFieldId) {
                    handle.classList.add('active');
                } else {
                    handle.classList.remove('active');
                }

                // Update text content
                const displayText = field.valueType === 'fixed' ? (field.fixedValue || field.name) : field.name;
                text.textContent = displayText;

                // Style
                text.style.fontSize = (field.fontSize * imgScale) + 'px';
                text.style.color = field.color;
                text.style.direction = 'rtl';
                text.style.transform = 'none';

                if (fontData && fontName) {
                    try {
                        const fontFace = new FontFace('PreviewFont', fontData);
                        fontFace.load().then((loaded) => {
                            document.fonts.add(loaded);
                            text.style.fontFamily = 'PreviewFont';
                        });
                    } catch (e) {}
                }

                // Measure and position
                handle.style.display = 'block';
                handle.style.width = 'auto';
                handle.style.height = 'auto';
                handle.style.transform = 'none';

                requestAnimationFrame(() => {
                    const naturalW = text.offsetWidth;
                    const naturalH = text.offsetHeight;

                    // Save frame dimensions
                    field.frameWidthImg = (naturalW * field.scaleX) / imgScale;
                    field.frameHeightImg = (naturalH * field.scaleY) / imgScale;

                    text.style.transform = `scale(${field.scaleX}, ${field.scaleY})`;
                    text.style.transformOrigin = 'top right';

                    const scaledW = naturalW * field.scaleX;
                    const scaledH = naturalH * field.scaleY;
                    const displayX = (field.x / imageWidth) * previewImg.clientWidth;
                    const displayY = (field.y / imageHeight) * previewImg.clientHeight;

                    handle.style.width = scaledW + 'px';
                    handle.style.height = scaledH + 'px';
                    handle.style.left = (displayX - scaledW) + 'px';
                    handle.style.top = displayY + 'px';
                    handle.style.transform = `rotate(${field.rotation}deg)`;
                    handle.style.transformOrigin = 'top right';

                    text.style.position = 'absolute';
                    text.style.right = '0';
                    text.style.top = '0';
                });
            });
        }

        function checkStep1() {
            toStep2Btn.disabled = !(imageData && fontData && fields.length > 0);
        }

        // ========== STEP 2: DYNAMIC RECORDS ==========
        const addRecordForm = document.getElementById('addRecordForm');
        const recordsHead = document.getElementById('recordsHead');
        const recordsBody = document.getElementById('recordsBody');
        const generateBtn = document.getElementById('generateBtn');
        const backBtn = document.getElementById('backBtn');
        const settingsSummary = document.getElementById('settingsSummary');

        function getListFields() {
            return fields.filter(f => f.valueType === 'list');
        }

        function getFixedFields() {
            return fields.filter(f => f.valueType === 'fixed');
        }

        // Go to step 2
        toStep2Btn.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            const listFields = getListFields();
            const fixedFields = getFixedFields();
            let summaryHtml = `<span>שדות: <strong>${fields.length}</strong></span>`;
            summaryHtml += `<span>פונט: <strong>${fontName}</strong></span>`;
            if (fixedFields.length > 0) {
                summaryHtml += `<span>שדות קבועים: <strong>${fixedFields.map(f => f.name).join(', ')}</strong></span>`;
            }
            settingsSummary.innerHTML = summaryHtml;
            buildRecordForm();
            renderRecords();
        });

        // Back to step 1
        backBtn.addEventListener('click', () => {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
        });

        function buildRecordForm() {
            const listFields = getListFields();
            addRecordForm.innerHTML = '';

            // One input per list field
            listFields.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'form-group';
                div.style.flex = '2';
                div.innerHTML = `<label>${escapeHtml(f.name)}</label>
                    <input type="text" data-field-id="${f.id}" class="record-field-input" placeholder="${escapeHtml(f.name)}">`;
                addRecordForm.appendChild(div);
            });

            // Filename input
            const nameDiv = document.createElement('div');
            nameDiv.className = 'form-group';
            nameDiv.style.flex = '1';
            nameDiv.innerHTML = `<label>שם קובץ</label>
                <input type="text" id="recordNameInput" placeholder="ימולא אוטומטית">`;
            addRecordForm.appendChild(nameDiv);

            // Add button
            const btn = document.createElement('button');
            btn.className = 'btn btn-primary';
            btn.textContent = 'הוסף';
            btn.addEventListener('click', addRecord);
            addRecordForm.appendChild(btn);

            // Auto-fill filename from first list field
            const firstInput = addRecordForm.querySelector('.record-field-input');
            if (firstInput) {
                firstInput.addEventListener('input', () => {
                    const nameInput = document.getElementById('recordNameInput');
                    if (!nameInput.dataset.manual) {
                        nameInput.value = firstInput.value.trim();
                    }
                });
            }

            // Enter key on inputs
            addRecordForm.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addRecord(); });
            });

            // Build table header
            recordsHead.innerHTML = '';
            const headTr = document.createElement('tr');
            headTr.innerHTML = '<th>#</th><th>שם קובץ</th>';
            listFields.forEach(f => {
                headTr.innerHTML += `<th>${escapeHtml(f.name)}</th>`;
            });
            headTr.innerHTML += '<th></th>';
            recordsHead.appendChild(headTr);
        }

        function addRecord() {
            const listFields = getListFields();
            const inputs = addRecordForm.querySelectorAll('.record-field-input');
            const nameInput = document.getElementById('recordNameInput');
            const values = {};
            let hasValue = false;

            inputs.forEach(inp => {
                const val = inp.value.trim();
                values[inp.dataset.fieldId] = val;
                if (val) hasValue = true;
            });

            if (!hasValue) return;

            const name = nameInput.value.trim() || inputs[0]?.value.trim() || 'document';
            records.push({ name, values });

            // Clear inputs
            inputs.forEach(inp => inp.value = '');
            nameInput.value = '';
            delete nameInput.dataset.manual;
            if (inputs[0]) inputs[0].focus();

            renderRecords();
        }

        function renderRecords() {
            const listFields = getListFields();
            recordsBody.innerHTML = '';
            records.forEach((rec, i) => {
                const tr = document.createElement('tr');
                let html = `<td>${i + 1}</td><td>${escapeHtml(rec.name)}</td>`;
                listFields.forEach(f => {
                    html += `<td>${escapeHtml(rec.values[f.id] || '')}</td>`;
                });
                html += `<td><button class="btn btn-danger" onclick="removeRecord(${i})">מחק</button></td>`;
                tr.innerHTML = html;
                recordsBody.appendChild(tr);
            });
            generateBtn.disabled = records.length === 0;
        }

        function removeRecord(index) {
            records.splice(index, 1);
            renderRecords();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Generate PDFs and ZIP
        generateBtn.addEventListener('click', async () => {
            progressOverlay.classList.remove('hidden');
            const zip = new JSZip();
            const x = parseInt(xInput.value) || 0;
            const y = parseInt(yInput.value) || 0;
            const fontSize = parseInt(fontSizeInput.value) || 24;
            const textColor = textColorInput.value;

            // Convert hex color to RGB
            const cr = parseInt(textColor.slice(1, 3), 16);
            const cg = parseInt(textColor.slice(3, 5), 16);
            const cb = parseInt(textColor.slice(5, 7), 16);

            // Convert font to base64
            const fontBase64 = arrayBufferToBase64(fontData);

            for (let i = 0; i < records.length; i++) {
                const rec = records[i];
                progressText.textContent = `מייצר קובץ ${i + 1} מתוך ${records.length}...`;

                // Create PDF with image dimensions (px to pt: 1px = 0.75pt)
                const pxToPt = 72 / 96;
                const widthPt = imageWidth * pxToPt;
                const heightPt = imageHeight * pxToPt;

                const doc = new jsPDF({
                    orientation: imageWidth > imageHeight ? 'landscape' : 'portrait',
                    unit: 'pt',
                    format: [widthPt, heightPt]
                });

                // Add font
                doc.addFileToVFS(fontName + '.ttf', fontBase64);
                doc.addFont(fontName + '.ttf', fontName, 'normal');
                doc.setFont(fontName);
                doc.setTextColor(cr, cg, cb);

                // Add image
                doc.addImage(imageData, imageType, 0, 0, widthPt, heightPt);

                // Add text
                const textX = x * pxToPt;
                const textY = y * pxToPt;
                const reversedText = rec.text.split('').reverse().join('');
                const textMode = textModeInput.value;
                const baseFontSize = fontSize * pxToPt;
                // Frame dimensions in pt (from image coordinates)
                const fwPt = frameWidthImg * pxToPt;
                const fhPt = frameHeightImg * pxToPt;

                if (textMode === 'fixed' && fwPt > 0 && fhPt > 0) {
                    // Fixed frame: stretch/squish text to fill frame exactly
                    doc.setFontSize(baseFontSize);
                    const textWidth = doc.getTextWidth(reversedText);
                    const textHeight = baseFontSize;
                    const sx = fwPt / textWidth;
                    const sy = fhPt / textHeight;

                    // Apply transform matrix with rotation + scale
                    const rad = (-rotation) * Math.PI / 180;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);
                    const ma = sx * cos;
                    const mb = sx * sin;
                    const mc = -sy * sin;
                    const md = sy * cos;
                    // PDF coords: y is from bottom
                    const pdfX = textX;
                    const pdfY = heightPt - textY;

                    doc.saveGraphicsState();
                    doc.internal.write(
                        `${ma.toFixed(6)} ${(-mb).toFixed(6)} ${(-mc).toFixed(6)} ${md.toFixed(6)} ${pdfX.toFixed(2)} ${pdfY.toFixed(2)} cm`
                    );
                    // y=heightPt compensates for jsPDF's internal y-flip → places text at (0,0) in transformed space
                    doc.text(reversedText, 0, heightPt + baseFontSize, { align: 'right' });
                    doc.restoreGraphicsState();
                } else {
                    // Wrap mode: height matches frame (scaleY), width flows freely
                    doc.setFontSize(baseFontSize * scaleY);
                    doc.text(reversedText, textX, textY, { align: 'right', baseline: 'top', angle: -rotation });
                }

                const pdfBlob = doc.output('arraybuffer');
                zip.file(rec.name + '.pdf', pdfBlob);

                // Small delay to keep UI responsive
                await new Promise(r => setTimeout(r, 10));
            }

            progressText.textContent = 'אורז קובץ ZIP...';
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'documents.zip';
            a.click();
            URL.revokeObjectURL(url);
            progressOverlay.classList.add('hidden');
        });

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }
    </script>
</body>
</html>
