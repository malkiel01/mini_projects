<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הטמעת נתונים לריכוז לקוחות</title>
    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            direction: rtl;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header a {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            opacity: 0.8;
        }
        header a:hover { opacity: 1; }
        header h1 { font-size: 1.4rem; }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .step {
            background: white;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .step.hidden { display: none; }
        .step h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #1a1a2e;
            border-bottom: 2px solid #e8e8e8;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-group input[type="file"],
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a6cf7;
        }
        .coords-row {
            display: flex;
            gap: 16px;
        }
        .coords-row .form-group { flex: 1; }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #4a6cf7;
            color: white;
        }
        .btn-primary:hover { background: #3a5ce5; }
        .btn-primary:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover { background: #16a34a; }
        .btn-secondary {
            background: #e8e8e8;
            color: #333;
        }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 6px 14px;
            font-size: 0.85rem;
        }
        .btn-danger:hover { background: #dc2626; }
        .preview-area {
            position: relative;
            display: inline-block;
            margin-top: 12px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            max-width: 100%;
            cursor: crosshair;
        }
        .preview-area img {
            display: block;
            max-width: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }
        .text-handle {
            position: absolute;
            cursor: grab;
            user-select: none;
        }
        .text-handle.active .handle {
            display: block;
        }
        .text-handle.active .rotate-line {
            display: block;
        }
        .text-handle.active .border-box {
            display: block;
        }
        .text-handle.dragging {
            cursor: grabbing;
        }
        .border-box {
            display: none;
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 2px dashed #4a6cf7;
            pointer-events: none;
        }
        .preview-text {
            color: #000;
            white-space: pre;
            pointer-events: none;
        }
        .handle {
            display: none;
            position: absolute;
            background: #4a6cf7;
            border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .rh {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        .rh-tl { top: -11px; left: -11px; cursor: nwse-resize; }
        .rh-tc { top: -11px; left: 50%; margin-left: -5px; cursor: ns-resize; }
        .rh-tr { top: -11px; right: -11px; cursor: nesw-resize; }
        .rh-ml { top: 50%; left: -11px; margin-top: -5px; cursor: ew-resize; }
        .rh-mr { top: 50%; right: -11px; margin-top: -5px; cursor: ew-resize; }
        .rh-bl { bottom: -11px; left: -11px; cursor: nesw-resize; }
        .rh-bc { bottom: -11px; left: 50%; margin-left: -5px; cursor: ns-resize; }
        .rh-br { bottom: -11px; right: -11px; cursor: nwse-resize; }
        .rotate-handle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            top: -32px;
            left: 50%;
            margin-left: -7px;
            cursor: grab;
        }
        .rotate-line {
            position: absolute;
            width: 1px;
            height: 22px;
            background: #4a6cf7;
            top: -22px;
            left: 50%;
            display: none;
            pointer-events: none;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .records-table th,
        .records-table td {
            padding: 10px 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        .records-table th {
            background: #f8f9fa;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .records-table tr:hover td { background: #fafbff; }
        .add-record-form {
            display: flex;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .add-record-form .form-group { margin-bottom: 0; }
        .settings-summary {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        .settings-summary span { color: #555; }
        .settings-summary strong { color: #1a1a2e; }
        .actions-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .font-size-group {
            display: flex;
            gap: 16px;
            align-items: end;
        }
        .font-size-group .form-group { flex: 1; }
        .progress-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .progress-overlay.hidden { display: none; }
        .progress-box {
            background: white;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            min-width: 280px;
        }
        .progress-box .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4a6cf7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .color-preview {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            vertical-align: middle;
        }
        .font-selector select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 10px;
            background: white;
        }
        .font-selector select:focus {
            outline: none;
            border-color: #4a6cf7;
        }
        .font-upload-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .save-font-label {
            white-space: nowrap;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .font-color-row {
            display: flex;
            gap: 16px;
            align-items: end;
        }
        .font-color-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html">→</a>
        <h1>הטמעת נתונים לריכוז לקוחות</h1>
    </header>

    <div class="container">
        <!-- Step 1: Settings -->
        <div class="step" id="step1">
            <h2>שלב 1: הגדרות בסיס</h2>

            <div class="form-group">
                <label>תמונת רקע (PNG / JPG)</label>
                <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg">
            </div>

            <div class="form-group">
                <label>פונט</label>
                <div class="font-selector">
                    <select id="fontSelect">
                        <option value="">-- בחר פונט שמור --</option>
                    </select>
                    <div class="font-upload-row">
                        <input type="file" id="fontInput" accept=".ttf,.otf">
                        <label class="save-font-label">
                            <input type="checkbox" id="saveFontCheck"> שמור בשרת
                        </label>
                    </div>
                </div>
            </div>

            <div class="font-color-row">
                <div class="form-group">
                    <label>גודל פונט (px)</label>
                    <input type="number" id="fontSizeInput" value="24" min="8" max="200">
                </div>
                <div class="form-group">
                    <label>צבע טקסט</label>
                    <input type="color" id="textColorInput" value="#000000" class="color-preview">
                </div>
            </div>

            <div class="coords-row">
                <div class="form-group">
                    <label>מיקום X</label>
                    <input type="number" id="xInput" value="430" min="0">
                </div>
                <div class="form-group">
                    <label>מיקום Y</label>
                    <input type="number" id="yInput" value="220" min="0">
                </div>
                <div class="form-group">
                    <label>סיבוב (מעלות)</label>
                    <input type="number" id="rotationInput" value="0" min="-360" max="360">
                </div>
            </div>

            <div class="form-group">
                <label>תצוגה מקדימה (גרור את הטקסט למיקום הרצוי)</label>
                <div class="preview-area" id="previewArea" style="display:none;">
                    <img id="previewImg" src="">
                    <div class="text-handle" id="textHandle" style="display:none;">
                        <div class="preview-text" id="previewText">טקסט לדוגמה</div>
                        <div class="border-box"></div>
                        <div class="rotate-line"></div>
                        <div class="handle rotate-handle" data-type="rotate"></div>
                        <div class="handle rh rh-tl" data-type="resize" data-dir="tl"></div>
                        <div class="handle rh rh-tc" data-type="resize" data-dir="tc"></div>
                        <div class="handle rh rh-tr" data-type="resize" data-dir="tr"></div>
                        <div class="handle rh rh-ml" data-type="resize" data-dir="ml"></div>
                        <div class="handle rh rh-mr" data-type="resize" data-dir="mr"></div>
                        <div class="handle rh rh-bl" data-type="resize" data-dir="bl"></div>
                        <div class="handle rh rh-bc" data-type="resize" data-dir="bc"></div>
                        <div class="handle rh rh-br" data-type="resize" data-dir="br"></div>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" id="toStep2Btn" disabled>המשך לשלב הבא</button>
        </div>

        <!-- Step 2: Records -->
        <div class="step hidden" id="step2">
            <h2>שלב 2: יצירת רשומות</h2>

            <div class="settings-summary" id="settingsSummary"></div>

            <div class="add-record-form">
                <div class="form-group" style="flex:2;">
                    <label>טקסט לשדה</label>
                    <input type="text" id="recordText" placeholder="למשל: לכבוד משה כהן">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>שם קובץ</label>
                    <input type="text" id="recordName" placeholder="ימולא אוטומטית">
                </div>
                <button class="btn btn-primary" id="addRecordBtn">הוסף</button>
            </div>

            <table class="records-table" id="recordsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>שם קובץ</th>
                        <th>טקסט</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
            </table>

            <div class="actions-bar">
                <button class="btn btn-success" id="generateBtn" disabled>הורד ZIP</button>
                <button class="btn btn-secondary" id="backBtn">חזרה להגדרות</button>
            </div>
        </div>
    </div>

    <!-- Progress overlay -->
    <div class="progress-overlay hidden" id="progressOverlay">
        <div class="progress-box">
            <div class="spinner"></div>
            <div id="progressText">מייצר קבצים...</div>
        </div>
    </div>

    <script>
        if (!window.jspdf) {
            alert('שגיאה: ספריית jsPDF לא נטענה. נסה לרענן את הדף.');
        }
        const { jsPDF } = window.jspdf;

        // State
        let imageData = null;
        let imageType = '';
        let imageWidth = 0;
        let imageHeight = 0;
        let fontData = null;
        let fontName = '';
        let records = [];
        let rotation = 0;
        let scaleX = 1;
        let scaleY = 1;

        // Elements
        const imageInput = document.getElementById('imageInput');
        const fontInput = document.getElementById('fontInput');
        const fontSelect = document.getElementById('fontSelect');
        const saveFontCheck = document.getElementById('saveFontCheck');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const textColorInput = document.getElementById('textColorInput');
        const xInput = document.getElementById('xInput');
        const yInput = document.getElementById('yInput');
        const rotationInput = document.getElementById('rotationInput');
        const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg');
        const textHandle = document.getElementById('textHandle');
        const previewText = document.getElementById('previewText');
        const toStep2Btn = document.getElementById('toStep2Btn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const recordName = document.getElementById('recordName');
        const recordText = document.getElementById('recordText');
        const addRecordBtn = document.getElementById('addRecordBtn');
        const recordsBody = document.getElementById('recordsBody');
        const generateBtn = document.getElementById('generateBtn');
        const backBtn = document.getElementById('backBtn');
        const settingsSummary = document.getElementById('settingsSummary');
        const progressOverlay = document.getElementById('progressOverlay');
        const progressText = document.getElementById('progressText');

        // Image upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imageType = file.type === 'image/png' ? 'PNG' : 'JPEG';
            const reader = new FileReader();
            reader.onload = (ev) => {
                imageData = ev.target.result;
                previewImg.src = imageData;
                previewArea.style.display = 'inline-block';
                const img = new Image();
                img.onload = () => {
                    imageWidth = img.naturalWidth;
                    imageHeight = img.naturalHeight;
                    updateTextHandle();
                    checkStep1();
                };
                img.src = imageData;
            };
            reader.readAsDataURL(file);
        });

        // Load saved fonts from server
        async function loadSavedFonts() {
            try {
                const res = await fetch('api.php?action=list');
                const data = await res.json();
                fontSelect.innerHTML = '<option value="">-- בחר פונט שמור --</option>';
                (data.fonts || []).forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.filename;
                    opt.textContent = f.name;
                    fontSelect.appendChild(opt);
                });
            } catch (e) {
                // No server / API not available - hide select
                fontSelect.style.display = 'none';
                saveFontCheck.parentElement.style.display = 'none';
            }
        }
        loadSavedFonts();

        // Select saved font from server
        fontSelect.addEventListener('change', async () => {
            const filename = fontSelect.value;
            if (!filename) return;
            try {
                const res = await fetch('fonts/' + filename);
                const buffer = await res.arrayBuffer();
                fontData = buffer;
                fontName = filename.replace(/\.(ttf|otf)$/i, '');
                fontInput.value = '';
                updateTextHandle();
                checkStep1();
            } catch (e) {
                alert('שגיאה בטעינת הפונט מהשרת');
            }
        });

        // Font upload (from file)
        fontInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fontName = file.name.replace(/\.(ttf|otf)$/i, '');
            const reader = new FileReader();
            reader.onload = async (ev) => {
                fontData = ev.target.result;
                fontSelect.value = '';
                updateTextHandle();
                checkStep1();

                // Save to server if checked
                if (saveFontCheck.checked) {
                    const formData = new FormData();
                    formData.append('font', file);
                    try {
                        const res = await fetch('api.php?action=upload', { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) {
                            await loadSavedFonts();
                            fontSelect.value = data.font.filename;
                        }
                    } catch (e) {
                        console.error('Failed to save font to server');
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Click on preview image to set position (not on the text handle)
        previewArea.addEventListener('click', (e) => {
            if (e.target === previewImg) {
                const rect = previewImg.getBoundingClientRect();
                const scaleX = imageWidth / previewImg.clientWidth;
                const scaleY = imageHeight / previewImg.clientHeight;
                const x = Math.round((e.clientX - rect.left) * scaleX);
                const y = Math.round((e.clientY - rect.top) * scaleY);
                xInput.value = x;
                yInput.value = y;
                updateTextHandle();
                textHandle.classList.add('active');
            }
        });

        // Select/deselect text handle
        textHandle.addEventListener('mousedown', (e) => {
            textHandle.classList.add('active');
            e.stopPropagation();
        });
        document.addEventListener('click', (e) => {
            if (!textHandle.contains(e.target) && e.target !== previewImg) {
                textHandle.classList.remove('active');
            }
        });

        // Input fields sync
        xInput.addEventListener('input', updateTextHandle);
        yInput.addEventListener('input', updateTextHandle);
        rotationInput.addEventListener('input', () => {
            rotation = parseInt(rotationInput.value) || 0;
            updateTextHandle();
        });
        fontSizeInput.addEventListener('input', updateTextHandle);
        textColorInput.addEventListener('input', updateTextHandle);

        // --- DRAG ---
        let dragState = null;
        textHandle.addEventListener('mousedown', (e) => {
            if (e.target.dataset.type) return; // handle clicks go to resize/rotate
            e.preventDefault();
            textHandle.classList.add('dragging');
            const rect = previewImg.getBoundingClientRect();
            dragState = {
                startMouseX: e.clientX,
                startMouseY: e.clientY,
                startX: parseInt(xInput.value) || 0,
                startY: parseInt(yInput.value) || 0,
                scaleX: imageWidth / previewImg.clientWidth,
                scaleY: imageHeight / previewImg.clientHeight,
            };
        });

        // --- RESIZE ---
        let resizeState = null;
        textHandle.querySelectorAll('[data-type="resize"]').forEach(handle => {
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const dir = handle.dataset.dir;
                const textRect = previewText.getBoundingClientRect();
                const imgScale = previewImg.clientWidth / imageWidth;
                const naturalW_img = (textRect.width / scaleX) / imgScale;
                const naturalH_img = (textRect.height / scaleY) / imgScale;
                const currentX = parseInt(xInput.value) || 0;
                const currentY = parseInt(yInput.value) || 0;
                resizeState = {
                    dir,
                    startMouseX: e.clientX,
                    startMouseY: e.clientY,
                    startScaleX: scaleX,
                    startScaleY: scaleY,
                    textWidth: textRect.width / scaleX,
                    textHeight: textRect.height / scaleY,
                    naturalW_img,
                    naturalH_img,
                    // Anchor edges (opposite side of handle)
                    leftEdge: currentX - naturalW_img * scaleX,
                    bottomEdge: currentY + naturalH_img * scaleY,
                    startX: currentX,
                    startY: currentY,
                };
            });
        });

        // --- ROTATE ---
        let rotateState = null;
        textHandle.querySelector('[data-type="rotate"]').addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const rect = textHandle.getBoundingClientRect();
            rotateState = {
                centerX: rect.left + rect.width / 2,
                centerY: rect.top + rect.height / 2,
                startAngle: rotation,
            };
        });

        document.addEventListener('mousemove', (e) => {
            if (dragState) {
                const dx = (e.clientX - dragState.startMouseX) * dragState.scaleX;
                const dy = (e.clientY - dragState.startMouseY) * dragState.scaleY;
                // RTL: moving mouse right means X decreases (text start moves left in image coords)
                xInput.value = Math.round(dragState.startX + dx);
                yInput.value = Math.round(dragState.startY + dy);
                updateTextHandle();
            }
            if (resizeState) {
                const dx = e.clientX - resizeState.startMouseX;
                const dy = e.clientY - resizeState.startMouseY;
                const dir = resizeState.dir;
                const affectsX = dir.includes('l') || dir.includes('r');
                const affectsY = dir.includes('t') || dir.includes('b');
                if (affectsX) {
                    const sign = dir.includes('l') ? -1 : 1;
                    scaleX = Math.max(0.1, resizeState.startScaleX + (dx * sign) / resizeState.textWidth);
                }
                if (affectsY) {
                    const sign = dir.includes('t') ? -1 : 1;
                    scaleY = Math.max(0.1, resizeState.startScaleY + (dy * sign) / resizeState.textHeight);
                }
                // Adjust position to keep opposite edge anchored
                if (dir.includes('r')) {
                    // Dragging right side → left edge stays fixed
                    xInput.value = Math.round(resizeState.leftEdge + resizeState.naturalW_img * scaleX);
                } else {
                    xInput.value = resizeState.startX;
                }
                if (dir.includes('t')) {
                    // Dragging top side → bottom edge stays fixed
                    yInput.value = Math.round(resizeState.bottomEdge - resizeState.naturalH_img * scaleY);
                } else {
                    yInput.value = resizeState.startY;
                }
                updateTextHandle();
            }
            if (rotateState) {
                const angle = Math.atan2(
                    e.clientY - rotateState.centerY,
                    e.clientX - rotateState.centerX
                ) * (180 / Math.PI) + 90;
                rotation = Math.round(angle);
                rotationInput.value = rotation;
                updateTextHandle();
            }
        });

        document.addEventListener('mouseup', () => {
            dragState = null;
            resizeState = null;
            rotateState = null;
            textHandle.classList.remove('dragging');
        });

        function updateTextHandle() {
            if (!imageWidth) return;
            const x = parseInt(xInput.value) || 0;
            const y = parseInt(yInput.value) || 0;
            const fontSize = parseInt(fontSizeInput.value) || 24;
            const color = textColorInput.value;
            const imgScale = previewImg.clientWidth / imageWidth;
            const displayX = (x / imageWidth) * previewImg.clientWidth;
            const displayY = (y / imageHeight) * previewImg.clientHeight;

            // Set text style first (before measuring)
            previewText.style.fontSize = (fontSize * imgScale) + 'px';
            previewText.style.color = color;
            previewText.style.direction = 'rtl';
            previewText.style.transform = 'none';

            if (fontData && fontName) {
                try {
                    const fontFace = new FontFace('PreviewFont', fontData);
                    fontFace.load().then((loaded) => {
                        document.fonts.add(loaded);
                        previewText.style.fontFamily = 'PreviewFont';
                        // Re-measure after font loads
                        sizeTextHandle(displayX, displayY);
                    });
                } catch (e) {}
            }

            // Make visible so we can measure
            textHandle.style.display = 'block';
            textHandle.style.width = 'auto';
            textHandle.style.height = 'auto';
            textHandle.style.transform = 'none';

            // Defer measurement to next frame
            requestAnimationFrame(() => sizeTextHandle(displayX, displayY));
        }

        function sizeTextHandle(displayX, displayY) {
            // Measure unscaled text size
            const naturalW = previewText.offsetWidth;
            const naturalH = previewText.offsetHeight;

            // Apply scale to text via transform
            previewText.style.transform = `scale(${scaleX}, ${scaleY})`;
            previewText.style.transformOrigin = 'top right';

            // Set wrapper to scaled dimensions
            const scaledW = naturalW * scaleX;
            const scaledH = naturalH * scaleY;
            textHandle.style.width = scaledW + 'px';
            textHandle.style.height = scaledH + 'px';

            // Position: right edge at X (RTL), rotate around top-right
            textHandle.style.left = (displayX - scaledW) + 'px';
            textHandle.style.top = displayY + 'px';
            textHandle.style.transform = `rotate(${rotation}deg)`;
            textHandle.style.transformOrigin = 'top right';

            // Position text inside: anchor at top-right of wrapper
            previewText.style.position = 'absolute';
            previewText.style.right = '0';
            previewText.style.top = '0';
        }

        function checkStep1() {
            toStep2Btn.disabled = !(imageData && fontData);
        }

        // Go to step 2
        toStep2Btn.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            const fontSize = fontSizeInput.value;
            settingsSummary.innerHTML = `
                <span>מיקום: <strong>X=${xInput.value}, Y=${yInput.value}</strong></span>
                <span>גודל פונט: <strong>${fontSize}px</strong></span>
                <span>סיבוב: <strong>${rotation}°</strong></span>
                <span>פונט: <strong>${fontName}</strong></span>
            `;
        });

        // Back to step 1
        backBtn.addEventListener('click', () => {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
        });

        // Auto-fill filename from text
        recordText.addEventListener('input', () => {
            if (!recordName.dataset.manual) {
                recordName.value = recordText.value.trim();
            }
        });
        recordName.addEventListener('input', () => {
            recordName.dataset.manual = recordName.value.trim() !== recordText.value.trim() ? '1' : '';
        });

        // Add record
        function addRecord() {
            const text = recordText.value.trim();
            if (!text) return;
            const name = recordName.value.trim() || text;
            records.push({ name, text });
            recordName.value = '';
            recordText.value = '';
            delete recordName.dataset.manual;
            recordText.focus();
            renderRecords();
        }

        addRecordBtn.addEventListener('click', addRecord);
        recordText.addEventListener('keydown', (e) => { if (e.key === 'Enter') addRecord(); });
        recordName.addEventListener('keydown', (e) => { if (e.key === 'Enter') addRecord(); });

        function renderRecords() {
            recordsBody.innerHTML = '';
            records.forEach((rec, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${escapeHtml(rec.name)}</td>
                    <td>${escapeHtml(rec.text)}</td>
                    <td><button class="btn btn-danger" onclick="removeRecord(${i})">מחק</button></td>
                `;
                recordsBody.appendChild(tr);
            });
            generateBtn.disabled = records.length === 0;
        }

        function removeRecord(index) {
            records.splice(index, 1);
            renderRecords();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Generate PDFs and ZIP
        generateBtn.addEventListener('click', async () => {
            progressOverlay.classList.remove('hidden');
            const zip = new JSZip();
            const x = parseInt(xInput.value) || 0;
            const y = parseInt(yInput.value) || 0;
            const fontSize = parseInt(fontSizeInput.value) || 24;
            const textColor = textColorInput.value;

            // Convert hex color to RGB
            const r = parseInt(textColor.slice(1, 3), 16);
            const g = parseInt(textColor.slice(3, 5), 16);
            const b = parseInt(textColor.slice(5, 7), 16);

            // Convert font to base64
            const fontBase64 = arrayBufferToBase64(fontData);

            for (let i = 0; i < records.length; i++) {
                const rec = records[i];
                progressText.textContent = `מייצר קובץ ${i + 1} מתוך ${records.length}...`;

                // Create PDF with image dimensions (px to pt: 1px = 0.75pt)
                const pxToPt = 72 / 96;
                const widthPt = imageWidth * pxToPt;
                const heightPt = imageHeight * pxToPt;

                const doc = new jsPDF({
                    orientation: imageWidth > imageHeight ? 'landscape' : 'portrait',
                    unit: 'pt',
                    format: [widthPt, heightPt]
                });

                // Add font
                doc.addFileToVFS(fontName + '.ttf', fontBase64);
                doc.addFont(fontName + '.ttf', fontName, 'normal');
                doc.setFont(fontName);
                doc.setFontSize(fontSize * pxToPt);
                doc.setTextColor(r, g, b);

                // Add image
                doc.addImage(imageData, imageType, 0, 0, widthPt, heightPt);

                // Add text with scale and rotation using PDF transform matrix
                const textX = x * pxToPt;
                const textY = y * pxToPt;
                const reversedText = rec.text.split('').reverse().join('');
                const rad = (-rotation) * Math.PI / 180;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);
                // Transform matrix: scale then rotate, anchored at (textX, textY)
                doc.saveGraphicsState();
                const a = cos * scaleX;
                const b = sin * scaleX;
                const c = -sin * scaleY;
                const d = cos * scaleY;
                const eVal = textX;
                const f = textY;
                // jsPDF Matrix: [a, b, c, d, e, f] in PDF coordinate system (y-up)
                const pageH = heightPt;
                doc.internal.write(
                    `${a.toFixed(6)} ${(-b).toFixed(6)} ${(-c).toFixed(6)} ${d.toFixed(6)} ${eVal.toFixed(2)} ${(pageH - f).toFixed(2)} cm`
                );
                doc.text(reversedText, 0, 0, { align: 'right', baseline: 'top' });
                doc.restoreGraphicsState();

                const pdfBlob = doc.output('arraybuffer');
                zip.file(rec.name + '.pdf', pdfBlob);

                // Small delay to keep UI responsive
                await new Promise(r => setTimeout(r, 10));
            }

            progressText.textContent = 'אורז קובץ ZIP...';
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'documents.zip';
            a.click();
            URL.revokeObjectURL(url);
            progressOverlay.classList.add('hidden');
        });

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }
    </script>
</body>
</html>
