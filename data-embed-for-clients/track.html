<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב חתימות</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            direction: rtl;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { font-size: 1.3rem; }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .summary {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .summary-card {
            flex: 1;
            min-width: 140px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .summary-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #4a6cf7;
        }
        .summary-card .label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        th, td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
        }
        td { font-size: 0.9rem; }
        tr:hover td { background: #fafbff; }
        .device-info {
            font-size: 0.75rem;
            color: #888;
            max-width: 250px;
        }
        .device-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .device-mobile { background: #dcfce7; color: #166534; }
        .device-desktop { background: #dbeafe; color: #1e40af; }
        .device-tablet { background: #fef3c7; color: #92400e; }
        .download-link {
            color: #4a6cf7;
            text-decoration: none;
            font-weight: 600;
        }
        .download-link:hover { text-decoration: underline; }
        .loading { text-align: center; padding: 60px; color: #999; }
        .empty { text-align: center; padding: 40px; color: #999; font-size: 1rem; }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #4a6cf7;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>📋 מעקב חתימות</h1>
    </header>
    <div class="container">
        <a href="index.html" class="back-link">← חזרה לעורך</a>
        <div id="loading" class="loading">טוען נתונים...</div>
        <div id="content" style="display:none;">
            <div class="summary" id="summary"></div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>תאריך</th>
                        <th>מכשיר</th>
                        <th>IP</th>
                        <th>מסך</th>
                        <th>קובץ</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="emptyMsg" class="empty" style="display:none;">אין חתימות עדיין</div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const templateId = params.get('id');

        function detectDevice(ua) {
            if (!ua) return { type: 'unknown', label: 'לא ידוע', cls: '' };
            ua = ua.toLowerCase();
            if (/ipad|tablet/i.test(ua)) return { type: 'tablet', label: 'טאבלט', cls: 'device-tablet' };
            if (/mobile|iphone|android.*mobile/i.test(ua)) return { type: 'mobile', label: 'נייד', cls: 'device-mobile' };
            return { type: 'desktop', label: 'מחשב', cls: 'device-desktop' };
        }

        function getBrowser(ua) {
            if (!ua) return '';
            if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Chrome';
            if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Edg')) return 'Edge';
            return '';
        }

        function getOS(ua) {
            if (!ua) return '';
            if (ua.includes('Windows')) return 'Windows';
            if (ua.includes('Mac OS')) return 'macOS';
            if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('Linux')) return 'Linux';
            return '';
        }

        async function init() {
            if (!templateId) {
                document.getElementById('loading').textContent = 'חסר מזהה תבנית';
                return;
            }
            try {
                const res = await fetch('api.php?action=list_signed&id=' + templateId);
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const files = data.files || [];
                if (files.length === 0) {
                    document.getElementById('emptyMsg').style.display = 'block';
                    renderSummary(files);
                    return;
                }

                renderSummary(files);
                renderTable(files);
            } catch (e) {
                document.getElementById('loading').textContent = 'שגיאה: ' + e.message;
            }
        }

        function renderSummary(files) {
            const devices = files.map(f => detectDevice(f.device?.userAgent));
            const mobile = devices.filter(d => d.type === 'mobile').length;
            const desktop = devices.filter(d => d.type === 'desktop').length;
            const tablet = devices.filter(d => d.type === 'tablet').length;

            document.getElementById('summary').innerHTML = `
                <div class="summary-card">
                    <div class="number">${files.length}</div>
                    <div class="label">סה"כ חתימות</div>
                </div>
                <div class="summary-card">
                    <div class="number">${mobile}</div>
                    <div class="label">📱 נייד</div>
                </div>
                <div class="summary-card">
                    <div class="number">${desktop}</div>
                    <div class="label">💻 מחשב</div>
                </div>
                <div class="summary-card">
                    <div class="number">${tablet}</div>
                    <div class="label">📟 טאבלט</div>
                </div>
            `;
        }

        function renderTable(files) {
            const tbody = document.getElementById('tableBody');
            // Sort by date descending
            files.sort((a, b) => new Date(b.date) - new Date(a.date));

            files.forEach((f, i) => {
                const dev = f.device || {};
                const ua = dev.userAgent || '';
                const deviceInfo = detectDevice(ua);
                const browser = getBrowser(ua);
                const os = getOS(ua);
                const dateStr = new Date(f.date).toLocaleString('he-IL');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${dateStr}</td>
                    <td>
                        <span class="device-badge ${deviceInfo.cls}">${deviceInfo.label}</span>
                        <div class="device-info">${os} ${browser ? '· ' + browser : ''}</div>
                    </td>
                    <td>${f.ip || '-'}</td>
                    <td>${dev.screen || '-'}</td>
                    <td><a class="download-link" href="signed/${templateId}/${f.filename}" target="_blank">הורד</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        init();
    </script>
</body>
</html>
