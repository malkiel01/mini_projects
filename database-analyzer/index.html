<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אנליסט מסד נתונים</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    overflow: hidden;
  }

  /* =========================================================
     CONNECTION SCREEN
     ========================================================= */
  #connectionScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
  }
  .connection-card {
    background: white; border-radius: 16px; padding: 40px;
    width: 100%; max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .connection-card .header-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .connection-card .icon-box {
    font-size: 2.5rem;
  }
  .connection-card h1 {
    font-size: 1.5rem; color: #1a1a2e;
  }
  .connection-card .subtitle {
    color: #666; font-size: 0.95rem; margin-bottom: 24px;
  }
  .back-link {
    display: inline-block; color: #5a8dee; text-decoration: none;
    font-size: 0.9rem; margin-bottom: 16px;
  }
  .back-link:hover { text-decoration: underline; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 0.85rem; color: #555;
    margin-bottom: 6px; font-weight: 500;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px;
    border: 1px solid #ddd; border-radius: 8px;
    font-size: 0.95rem; font-family: inherit;
    background: #fafafa; transition: all 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #5a8dee;
    background: white; box-shadow: 0 0 0 3px rgba(90,141,238,0.15);
  }
  .form-row {
    display: grid; grid-template-columns: 2fr 1fr; gap: 12px;
  }

  .btn {
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 0.95rem; cursor: pointer; font-family: inherit;
    transition: all 0.2s; display: inline-flex; align-items: center;
    gap: 6px; font-weight: 500;
  }
  .btn-primary {
    background: linear-gradient(135deg, #5a8dee 0%, #3b5bdb 100%);
    color: white;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,91,219,0.3); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #e9ecef; color: #333; }
  .btn-secondary:hover { background: #dee2e6; }
  .btn-danger { background: #dc3545; color: white; }
  .btn-danger:hover { background: #c82333; }
  .btn-success { background: #28a745; color: white; }
  .btn-success:hover { background: #218838; }
  .btn-block { width: 100%; justify-content: center; padding: 12px; }

  .error-message {
    background: #fee; color: #c33; border: 1px solid #fcc;
    padding: 10px 14px; border-radius: 8px; margin-top: 12px;
    font-size: 0.9rem; display: none;
  }

  /* =========================================================
     MAIN LAYOUT
     ========================================================= */
  #mainScreen { display: none; height: 100vh; flex-direction: column; }

  .main-header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex-shrink: 0;
  }
  .main-header .back-btn {
    color: white; text-decoration: none; font-size: 1.4rem;
    padding: 4px 8px; border-radius: 6px;
    transition: background 0.2s;
  }
  .main-header .back-btn:hover { background: rgba(255,255,255,0.15); }
  .main-header h1 { font-size: 1.2rem; font-weight: 500; }
  .main-header .db-badge {
    background: rgba(255,255,255,0.15); padding: 4px 12px;
    border-radius: 20px; font-size: 0.85rem;
  }
  .main-header .spacer { flex: 1; }

  .layout {
    display: flex; flex: 1; overflow: hidden;
  }

  /* --- Sidebar --- */
  .sidebar {
    width: 280px; background: white;
    border-left: 1px solid #e0e0e0;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-search {
    padding: 12px; border-bottom: 1px solid #eee;
  }
  .sidebar-search input {
    width: 100%; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 6px; font-size: 0.9rem;
  }
  .sidebar-section { padding: 8px 0; }
  .sidebar-section-title {
    padding: 8px 16px; font-size: 0.75rem; color: #888;
    font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar-list {
    list-style: none; max-height: 40vh; overflow-y: auto;
  }
  .sidebar-item {
    padding: 8px 16px; cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.15s; border-right: 3px solid transparent;
  }
  .sidebar-item:hover { background: #f5f7fa; }
  .sidebar-item.active {
    background: #eef2ff; color: #3b5bdb;
    border-right-color: #3b5bdb; font-weight: 500;
  }
  .sidebar-item .item-icon {
    opacity: 0.6; flex-shrink: 0;
  }
  .sidebar-scroll { flex: 1; overflow-y: auto; }

  /* --- Content area --- */
  .content {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
    background: #f7f8fa;
  }
  .table-view { display: none; flex-direction: column; height: 100%; }
  .table-view.active { display: flex; }

  .table-header-bar {
    background: white; padding: 16px 24px;
    border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
  }
  .table-header-bar .title-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
  }
  .table-header-bar h2 {
    font-size: 1.3rem; color: #1a1a2e;
  }
  .table-header-bar .type-badge {
    background: #e9ecef; color: #555;
    padding: 2px 10px; border-radius: 12px;
    font-size: 0.75rem; font-weight: 600;
  }
  .table-header-bar .type-badge.view { background: #fff3cd; color: #856404; }
  .table-header-bar .meta {
    color: #888; font-size: 0.85rem;
  }

  .tabs-bar {
    background: white; padding: 0 24px;
    border-bottom: 1px solid #e0e0e0;
    display: flex; gap: 4px; flex-shrink: 0;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 12px 20px; border: none; background: none;
    cursor: pointer; font-size: 0.9rem;
    border-bottom: 3px solid transparent;
    color: #666; font-family: inherit;
    transition: all 0.15s; white-space: nowrap;
  }
  .tab-btn:hover { color: #3b5bdb; }
  .tab-btn.active {
    color: #3b5bdb; border-bottom-color: #3b5bdb; font-weight: 500;
  }

  .tab-content {
    flex: 1; overflow: auto; padding: 24px;
    display: none;
  }
  .tab-content.active { display: block; }

  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 40px; color: #888;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid #eee; border-top-color: #3b5bdb;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-left: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* =========================================================
     DATA TABLES (shared across tabs)
     ========================================================= */
  .section-card {
    background: white; border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .section-card h3 {
    font-size: 1.05rem; color: #1a1a2e;
    margin-bottom: 14px; display: flex;
    align-items: center; gap: 8px;
    padding-bottom: 10px; border-bottom: 1px solid #f0f0f0;
  }
  .section-card .section-actions { margin-right: auto; display: flex; gap: 6px; }
  .section-card .count-badge {
    background: #eef2ff; color: #3b5bdb;
    padding: 2px 10px; border-radius: 12px;
    font-size: 0.8rem; font-weight: 600;
  }

  .data-table {
    width: 100%; border-collapse: collapse;
    font-size: 0.88rem;
  }
  .data-table th, .data-table td {
    padding: 8px 12px; text-align: right;
    border-bottom: 1px solid #f0f0f0;
  }
  .data-table th {
    background: #f8f9fb; color: #555;
    font-weight: 600; font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    position: sticky; top: 0;
  }
  .data-table tbody tr:hover { background: #fafbfc; }
  .data-table tbody td {
    color: #333; white-space: nowrap;
    max-width: 300px; overflow: hidden;
    text-overflow: ellipsis;
  }
  .data-table .mono {
    font-family: 'Consolas', 'Monaco', monospace;
    color: #5a6268; font-size: 0.85rem;
  }
  .data-table .muted { color: #888; font-style: italic; }
  .table-wrap {
    overflow-x: auto; border-radius: 8px;
    border: 1px solid #eee;
  }

  .pill {
    display: inline-block; padding: 2px 8px;
    border-radius: 10px; font-size: 0.72rem;
    font-weight: 600; background: #e9ecef;
    color: #555;
  }
  .pill.pk  { background: #fff3cd; color: #856404; }
  .pill.fk  { background: #d1ecf1; color: #0c5460; }
  .pill.uq  { background: #d4edda; color: #155724; }
  .pill.idx { background: #e2e3e5; color: #383d41; }
  .pill.null-yes { background: #f8d7da; color: #721c24; }
  .pill.null-no  { background: #d4edda; color: #155724; }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .info-item {
    background: #f8f9fb; padding: 10px 14px;
    border-radius: 8px; border: 1px solid #f0f0f0;
  }
  .info-item .label {
    font-size: 0.75rem; color: #888;
    text-transform: uppercase; letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  .info-item .value {
    font-size: 0.95rem; color: #1a1a2e;
    font-weight: 500; word-break: break-all;
  }

  .empty-state {
    text-align: center; padding: 30px 20px;
    color: #999; font-size: 0.9rem;
  }

  .trigger-item {
    background: #f8f9fb; padding: 14px;
    border-radius: 8px; margin-bottom: 10px;
    border-right: 3px solid #3b5bdb;
  }
  .trigger-item .trigger-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .trigger-item .trigger-name {
    font-weight: 600; color: #1a1a2e;
  }
  .trigger-item pre {
    background: #1e1e2e; color: #d4d4d4;
    padding: 10px; border-radius: 6px;
    font-size: 0.82rem; overflow-x: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    white-space: pre-wrap; word-wrap: break-word;
  }

  /* =========================================================
     DATA TAB - pagination + crud
     ========================================================= */
  .data-toolbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .data-toolbar .stat {
    color: #666; font-size: 0.9rem;
  }
  .data-toolbar .spacer { flex: 1; }

  .pagination {
    display: flex; gap: 4px; align-items: center;
    margin-top: 14px; justify-content: center;
  }
  .pagination button {
    padding: 6px 12px; border: 1px solid #ddd;
    background: white; border-radius: 6px;
    cursor: pointer; font-size: 0.85rem;
    color: #555; min-width: 36px;
  }
  .pagination button:hover:not(:disabled) { background: #eef2ff; border-color: #3b5bdb; color: #3b5bdb; }
  .pagination button.active {
    background: #3b5bdb; border-color: #3b5bdb; color: white;
  }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .page-info {
    padding: 0 10px; font-size: 0.85rem; color: #666;
  }
  .pagination select {
    padding: 6px 10px; border: 1px solid #ddd;
    border-radius: 6px; font-size: 0.85rem;
  }

  .rows-table {
    font-size: 0.85rem;
  }
  .rows-table td.cell-value {
    max-width: 240px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .rows-table td.actions-cell {
    white-space: nowrap;
    text-align: center;
  }
  .rows-table .null-val {
    color: #aaa; font-style: italic; font-size: 0.8rem;
  }
  .rows-table tr.highlight { background: #fff8e1 !important; }

  /* =========================================================
     MODAL
     ========================================================= */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px; overflow-y: auto;
  }
  .modal {
    background: white; border-radius: 12px;
    max-width: 640px; width: 100%;
    max-height: 90vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { font-size: 1.1rem; color: #1a1a2e; }
  .modal-close {
    background: none; border: none; font-size: 1.4rem;
    cursor: pointer; color: #888; padding: 0 6px;
    border-radius: 4px;
  }
  .modal-close:hover { background: #f0f0f0; color: #333; }
  .modal-body {
    padding: 20px; overflow-y: auto; flex: 1;
  }
  .modal-footer {
    padding: 14px 20px; border-top: 1px solid #eee;
    display: flex; gap: 8px; justify-content: flex-end;
  }

  .row-field {
    margin-bottom: 14px;
  }
  .row-field label {
    display: block; margin-bottom: 4px; font-size: 0.85rem;
    color: #555; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .row-field label .col-type {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.75rem; color: #888;
    background: #f0f2f5; padding: 2px 6px;
    border-radius: 4px;
  }
  .row-field .null-toggle {
    font-size: 0.75rem; color: #666;
    margin-right: auto; cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  .row-field input, .row-field textarea {
    width: 100%; padding: 8px 12px;
    border: 1px solid #ddd; border-radius: 6px;
    font-size: 0.9rem; font-family: inherit;
    background: #fafafa;
  }
  .row-field textarea { resize: vertical; min-height: 60px; }
  .row-field.is-null input, .row-field.is-null textarea {
    background: #f5f5f5; color: #aaa;
    text-decoration: line-through;
  }
  .row-field .hint {
    font-size: 0.75rem; color: #888; margin-top: 2px;
  }

  /* =========================================================
     RELATIONSHIPS - visual ERD
     ========================================================= */
  .rel-view-toggle {
    display: inline-flex; border: 1px solid #ddd;
    border-radius: 8px; overflow: hidden; margin-bottom: 16px;
  }
  .rel-view-toggle button {
    padding: 8px 16px; border: none; background: white;
    cursor: pointer; font-size: 0.9rem; color: #666;
    font-family: inherit;
  }
  .rel-view-toggle button.active {
    background: #3b5bdb; color: white;
  }

  .erd-wrap {
    position: relative; background: #fafbfc;
    border: 1px solid #e0e0e0; border-radius: 8px;
    height: 70vh; overflow: auto;
  }
  .erd-canvas {
    position: relative; width: 2400px; height: 1600px;
  }
  .erd-svg {
    position: absolute; inset: 0;
    pointer-events: none; width: 100%; height: 100%;
  }
  .erd-svg path {
    fill: none; stroke: #3b5bdb;
    stroke-width: 2; opacity: 0.6;
  }
  .erd-svg path.highlighted {
    stroke: #dc3545; stroke-width: 3; opacity: 1;
  }

  .erd-table {
    position: absolute; background: white;
    border: 1.5px solid #3b5bdb; border-radius: 8px;
    min-width: 180px; font-size: 0.8rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    user-select: none;
  }
  .erd-table.selected {
    border-color: #dc3545;
    box-shadow: 0 0 0 3px rgba(220,53,69,0.2);
  }
  .erd-table.highlighted {
    border-color: #28a745;
    box-shadow: 0 0 0 3px rgba(40,167,69,0.2);
  }
  .erd-table-header {
    background: linear-gradient(135deg, #3b5bdb, #1a1a2e);
    color: white; padding: 8px 12px;
    border-radius: 6px 6px 0 0;
    cursor: move; font-weight: 600;
  }
  .erd-table.selected .erd-table-header {
    background: linear-gradient(135deg, #dc3545, #8b0000);
  }
  .erd-table-col {
    padding: 5px 12px; border-top: 1px solid #eee;
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem;
  }
  .erd-table-col.is-pk {
    background: #fff9e6; font-weight: 600; color: #856404;
  }
  .erd-table-col.is-fk {
    background: #e7f3ff; color: #004085;
  }
  .erd-table-col .col-icon {
    flex-shrink: 0; opacity: 0.7;
  }
  .erd-table-col .col-type {
    font-family: monospace; color: #888;
    font-size: 0.72rem; margin-right: auto;
  }

  .erd-legend {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(255,255,255,0.95);
    padding: 10px 14px; border-radius: 8px;
    font-size: 0.78rem; color: #666;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .erd-legend div { margin: 3px 0; }

  /* =========================================================
     DASHBOARD - main screen after connection
     ========================================================= */
  .dashboard { display: none; flex-direction: column; height: 100%; }
  .dashboard.active { display: flex; }

  .dashboard-header {
    background: white; padding: 18px 24px;
    border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
  }
  .dashboard-header h2 {
    font-size: 1.35rem; color: #1a1a2e;
    display: flex; align-items: center; gap: 10px;
  }
  .dashboard-header .db-name {
    font-family: monospace; color: #3b5bdb;
    background: #eef2ff; padding: 2px 10px;
    border-radius: 6px; font-size: 0.95rem;
  }
  .dashboard-content {
    flex: 1; overflow: auto; padding: 24px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .stat-card {
    background: white; border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border-right: 4px solid #3b5bdb;
  }
  .stat-card .stat-label {
    font-size: 0.8rem; color: #888;
    margin-bottom: 6px;
  }
  .stat-card .stat-value {
    font-size: 1.6rem; font-weight: 700;
    color: #1a1a2e;
  }
  .stat-card.green   { border-right-color: #28a745; }
  .stat-card.orange  { border-right-color: #fd7e14; }
  .stat-card.purple  { border-right-color: #6f42c1; }
  .stat-card.cyan    { border-right-color: #17a2b8; }

  .dl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .dl-btn {
    background: white; border: 2px solid #e0e0e0;
    border-radius: 10px; padding: 18px 16px;
    cursor: pointer; text-align: right;
    transition: all 0.15s; font-family: inherit;
    display: flex; flex-direction: column; gap: 4px;
  }
  .dl-btn:hover {
    border-color: #3b5bdb; transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(59,91,219,0.12);
  }
  .dl-btn:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none;
  }
  .dl-btn .dl-title {
    font-size: 1rem; font-weight: 600; color: #1a1a2e;
  }
  .dl-btn .dl-desc {
    font-size: 0.82rem; color: #666;
  }
  .dl-btn .dl-spinner {
    width: 16px; height: 16px;
    border: 2px solid #eee; border-top-color: #3b5bdb;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  .rel-list-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid #f0f0f0;
    font-size: 0.88rem;
  }
  .rel-list-item:last-child { border-bottom: none; }
  .rel-list-item:hover { background: #fafbfc; }
  .rel-list-item .rel-arrow { color: #3b5bdb; font-weight: 700; }
  .rel-list-item code {
    font-family: monospace; background: #f0f0f5;
    padding: 2px 6px; border-radius: 4px;
    font-size: 0.82rem;
  }
  .rel-list-item .rel-link {
    color: #3b5bdb; cursor: pointer; text-decoration: none;
  }
  .rel-list-item .rel-link:hover { text-decoration: underline; }

  .back-to-dash {
    background: #eef2ff; color: #3b5bdb;
    border: 1px solid #c7d2fe; border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
    font-family: inherit; font-size: 0.82rem;
    margin-left: 8px;
  }
  .back-to-dash:hover { background: #dbeafe; }

  /* =========================================================

<body>

<!-- ============================================================

<div id="connectionScreen">

    <a href="../index.html" class="back-link">→ חזרה לכלים</a>

<!-- ============================================================
     MAIN SCREEN
     ============================================================ -->
<div id="mainScreen">

    <a href="../index.html" class="back-btn" title="חזרה לכלים">→</a>

    <span class="db-badge" id="dbBadge"></span>

            <h2 id="currentTableName">-</h2>
            <span class="type-badge" id="currentTableType">טבלה</span>

        </div>

        <div class="tabs-bar">
          <button class="tab-btn active" data-tab="structure">📋 מבנה</button>
          <button class="tab-btn" data-tab="data">📊 נתונים</button>
          <button class="tab-btn" data-tab="relationships">🔗 קשרים</button>

        <div class="tab-content active" id="tab-structure">

            <div class="spinner"></div>
            <span>טוען...</span>

        <div class="tab-content" id="tab-relationships"></div>

<div id="toastContainer"></div>

<script>
/* ===============================================================
   STATE - connection credentials held in memory only
   =============================================================== */
const state = {
  conn: null,       // {host, port, database, username, password}
  tables: [],
  views: [],
  currentItem: null,   // {name, type: 'table'|'view'}
  activeTab: 'structure',
  tableCache: {}       // per-table cached data to avoid re-fetching on tab switch
};

/* ===============================================================
   API helper
   =============================================================== */
async function api(action, params = {}) {
  if (!state.conn) throw new Error('לא מחובר למסד נתונים');
  const res = await fetch('api.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...state.conn, ...params })
  });
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    console.error('[API RAW Response]', text);
    throw new Error('שגיאת שרת (status ' + res.status + '): ' + text.substring(0, 200));
  }
  if (!data.success) {
    throw new Error(data.error || 'שגיאה לא ידועה');
  }
  return data;
}

/* ===============================================================
   UI helpers
   =============================================================== */
function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function toast(message, type = 'info') {
  if (type === 'error') console.error('[DB Analyzer]', message);
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = message;
  $('toastContainer').appendChild(t);
  const duration = type === 'error' ? 10000 : 3500;
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, duration);
}

function showLoading(container) {
  container.innerHTML = '<div class="loading"><div class="spinner"></div><span>טוען...</span></div>';
}

/* ===============================================================
   CONNECTION
   =============================================================== */
$('connectionForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('connectBtn');
  const errBox = $('connectionError');
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0 0 0 8px"></div> מתחבר...';

  const conn = {
    host: $('dbHost').value.trim(),
    port: $('dbPort').value.trim() || 3306,
    database: $('dbName').value.trim(),
    username: $('dbUser').value.trim(),
    password: $('dbPass').value
  };
  state.conn = conn;

  try {
    const result = await api('connect');
    state.tables = result.tables || [];
    state.views = result.views || [];
    showMainScreen();
  } catch (err) {
    state.conn = null;
    errBox.textContent = '❌ שגיאת חיבור: ' + err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🔌 התחברות';
  }
});

$('disconnectBtn').addEventListener('click', () => {
  if (!confirm('להתנתק ממסד הנתונים?')) return;
  state.conn = null;
  state.tables = [];
  state.views = [];
  state.currentItem = null;
  state.tableCache = {};
  $('connectionScreen').style.display = 'flex';
  $('mainScreen').style.display = 'none';
  $('dbPass').value = '';
});

function showMainScreen() {
  $('connectionScreen').style.display = 'none';
  $('mainScreen').style.display = 'flex';
  $('dbBadge').textContent = state.conn.database;
  $('dashDbName').textContent = state.conn.database;
  renderSidebar();
  showDashboard();
}

function showDashboard() {
  state.currentItem = null;
  $('dashboardScreen').classList.add('active');
  $('tableView').classList.remove('active');
  document.querySelectorAll('.sidebar-item.active').forEach(el => el.classList.remove('active'));
  renderDashboard();
}

function showTableView() {
  $('dashboardScreen').classList.remove('active');
  $('tableView').classList.add('active');
}

/* ===============================================================
   SIDEBAR
   =============================================================== */
function renderSidebar() {
  const filter = ($('sidebarSearch').value || '').toLowerCase();
  const filteredTables = state.tables.filter(t => t.toLowerCase().includes(filter));
  const filteredViews = state.views.filter(v => v.toLowerCase().includes(filter));

  $('tablesCount').textContent = filteredTables.length;
  $('viewsCount').textContent = filteredViews.length;
  $('viewsSection').style.display = state.views.length ? '' : 'none';

  const tablesList = $('tablesList');
  tablesList.innerHTML = filteredTables.map(t => `
    <li class="sidebar-item ${state.currentItem && state.currentItem.name === t && state.currentItem.type === 'table' ? 'active' : ''}"
        data-name="${escapeHtml(t)}" data-type="table">
      <span class="item-icon">📋</span>
      <span>${escapeHtml(t)}</span>
    </li>
  `).join('');

  const viewsList = $('viewsList');
  viewsList.innerHTML = filteredViews.map(v => `
    <li class="sidebar-item ${state.currentItem && state.currentItem.name === v && state.currentItem.type === 'view' ? 'active' : ''}"
        data-name="${escapeHtml(v)}" data-type="view">
      <span class="item-icon">👁️</span>
      <span>${escapeHtml(v)}</span>
    </li>
  `).join('');

  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', () => {
      selectItem(item.dataset.name, item.dataset.type);
    });
  });
}

$('sidebarSearch').addEventListener('input', renderSidebar);

$('backToDashBtn').addEventListener('click', showDashboard);

/* ===============================================================
   DASHBOARD - main overview after connecting
   =============================================================== */
async function renderDashboard() {
  const body = $('dashboardBody');
  body.innerHTML = '<div class="loading"><div class="spinner"></div><span>טוען סקירה...</span></div>';

  let overview;
  try {
    overview = await api('get_database_overview');
  } catch (err) {
    body.innerHTML = `<div class="empty-state">❌ שגיאה: ${escapeHtml(err.message)}</div>`;
    return;
  }

  const tables = overview.tables || [];
  const views = overview.views || [];
  const rels = overview.relationships || [];
  const triggers = overview.triggers || [];
  const tableInfo = overview.tableInfo || {};
  const tableColumns = overview.tableColumns || {};

  let totalRows = 0;
  let totalSize = 0;
  Object.values(tableInfo).forEach(info => {
    totalRows += parseInt(info.TABLE_ROWS || 0, 10);
    totalSize += parseInt(info.DATA_LENGTH || 0, 10) + parseInt(info.INDEX_LENGTH || 0, 10);
  });

  const sizeStr = formatBytes(totalSize);

  body.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">📋 טבלאות</div>
        <div class="stat-value">${tables.length}</div>
      </div>
      <div class="stat-card cyan">
        <div class="stat-label">👁️ תצוגות</div>
        <div class="stat-value">${views.length}</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">🔗 קשרי FK</div>

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function renderDashboardErd(container, tables, tableColumns, rels) {
  // Auto-layout: simple grid, no center table (whole-DB view)
  const positions = {};
  const cols = Math.ceil(Math.sqrt(tables.length * 1.4));
  const colW = 240, rowH = 270;
  tables.forEach((t, i) => {
    const r = Math.floor(i / cols);
    const c = i % cols;
    positions[t] = { x: c * colW + 40, y: r * rowH + 40 };
  });

  const pkSet = {}, fkSet = {};
  tables.forEach(t => {
    pkSet[t] = new Set();
    fkSet[t] = new Set();
    (tableColumns[t] || []).forEach(c => {
      if (c.Key === 'PRI') pkSet[t].add(c.Field);
    });
  });
  rels.forEach(r => {
    if (!fkSet[r.TABLE_NAME]) fkSet[r.TABLE_NAME] = new Set();
    fkSet[r.TABLE_NAME].add(r.COLUMN_NAME);
  });

  const totalRows = Math.ceil(tables.length / cols);
  const canvasW = Math.max(2400, cols * colW + 80);
  const canvasH = Math.max(800, totalRows * rowH + 80);

  container.innerHTML = `
    <div class="erd-wrap">
      <div class="erd-canvas" id="dashErdCanvas" style="width:${canvasW}px;height:${canvasH}px">
        <svg class="erd-svg" id="dashErdSvg"></svg>
        ${tables.map(t => {
          const p = positions[t];
          const colsArr = tableColumns[t] || [];
          return `
            <div class="erd-table" data-table="${escapeHtml(t)}"
                 style="right: ${p.x}px; top: ${p.y}px">
              <div class="erd-table-header">📋 ${escapeHtml(t)}</div>
              ${colsArr.slice(0, 12).map(c => {
                const isPk = pkSet[t].has(c.Field);
                const isFk = fkSet[t] && fkSet[t].has(c.Field);
                const cls = ['erd-table-col'];
                if (isPk) cls.push('is-pk');
                if (isFk) cls.push('is-fk');
                return `
                  <div class="${cls.join(' ')}">
                    <span class="col-icon">${isPk ? '🔑' : isFk ? '🔗' : '·'}</span>
                    <span>${escapeHtml(c.Field)}</span>
                    <span class="col-type">${escapeHtml(c.Type.split('(')[0])}</span>
                  </div>`;
              }).join('')}
              ${colsArr.length > 12 ? `<div class="erd-table-col" style="color:#888;font-style:italic">+ ${colsArr.length - 12} נוספות</div>` : ''}
            </div>`;
        }).join('')}
      </div>
      <div class="erd-legend">
        <div>🔑 מפתח ראשי (PK)</div>
        <div>🔗 מפתח זר (FK)</div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid #eee">
          לחצו על טבלה לצפייה בפרטים · גררו את הכותרת להזזה
        </div>
      </div>
    </div>`;

  drawDashErdLines(rels, positions);

  container.querySelectorAll('.erd-table').forEach(el => {
    enableDashDrag(el, positions, rels);
    el.querySelector('.erd-table-header').addEventListener('dblclick', () => {
      selectItem(el.dataset.table, 'table');
    });
  });
}

function drawDashErdLines(rels, positions) {
  const svg = $('dashErdSvg');
  const canvas = $('dashErdCanvas');
  if (!svg || !canvas) return;
  svg.setAttribute('viewBox', `0 0 ${canvas.offsetWidth} ${canvas.offsetHeight}`);

  function anchor(tableName) {
    const p = positions[tableName];
    if (!p) return null;
    const el = canvas.querySelector(`.erd-table[data-table="${CSS.escape(tableName)}"]`);
    if (!el) return null;
    const w = canvas.offsetWidth;
    return {
      cx: w - p.x - el.offsetWidth / 2,
      cy: p.y + el.offsetHeight / 2
    };
  }

  const paths = [];
  const seen = new Set();
  rels.forEach(r => {
    const key = r.TABLE_NAME + '|' + r.REFERENCED_TABLE_NAME;
    if (seen.has(key)) return;
    seen.add(key);
    const a = anchor(r.TABLE_NAME);
    const b = anchor(r.REFERENCED_TABLE_NAME);
    if (!a || !b) return;
    const dx = (b.cx - a.cx) * 0.4;
    const d = `M ${a.cx},${a.cy} C ${a.cx + dx},${a.cy} ${b.cx - dx},${b.cy} ${b.cx},${b.cy}`;
    paths.push(`<path d="${d}"></path>`);
  });
  svg.innerHTML = paths.join('');
}

function enableDashDrag(el, positions, rels) {
  const header = el.querySelector('.erd-table-header');
  if (!header) return;
  let dragging = false, startX, startY, startRight, startTop;

  header.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startRight = parseFloat(el.style.right);
    startTop = parseFloat(el.style.top);
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    el.style.right = (startRight - dx) + 'px';
    el.style.top = (startTop + dy) + 'px';
    positions[el.dataset.table] = { x: startRight - dx, y: startTop + dy };
    drawDashErdLines(rels, positions);
  });
  document.addEventListener('mouseup', () => { dragging = false; });
}

function renderDashboardRelList(container, rels) {
  if (!rels.length) {
    container.innerHTML = '<div class="empty-state">לא נמצאו קשרי Foreign Key במסד הנתונים</div>';
    return;
  }
  container.innerHTML = rels.map(r => `
    <div class="rel-list-item">
      <a class="rel-link" data-table="${escapeHtml(r.TABLE_NAME)}">${escapeHtml(r.TABLE_NAME)}</a>
      <code>${escapeHtml(r.COLUMN_NAME)}</code>
      <span class="rel-arrow">←</span>
      <a class="rel-link" data-table="${escapeHtml(r.REFERENCED_TABLE_NAME)}">${escapeHtml(r.REFERENCED_TABLE_NAME)}</a>
      <code>${escapeHtml(r.REFERENCED_COLUMN_NAME)}</code>
      <span style="color:#aaa;margin-right:auto;font-size:0.78rem">${escapeHtml(r.CONSTRAINT_NAME || '')}</span>
    </div>
  `).join('');

  container.querySelectorAll('.rel-link').forEach(a => {
    a.addEventListener('click', () => selectItem(a.dataset.table, 'table'));
  });
}

async function downloadFullExport(mode, btn) {
  const labels = { structure: 'מבנה', data: 'תוכן', both: 'מבנה + תוכן' };
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="dl-spinner"></span><span class="dl-desc">מכין ${labels[mode]} (ZIP)...</span>`;
  try {
    const res = await api('export_database', { mode });
    // Download the ZIP file
    const link = document.createElement('a');
    link.href = res.file;
    link.download = res.filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    const sizeStr = res.size > 1048576
      ? (res.size / 1048576).toFixed(1) + ' MB'
      : (res.size / 1024).toFixed(0) + ' KB';
    toast(`✅ הקובץ מוכן להורדה (${sizeStr})`, 'success');
  } catch (err) {
    toast('❌ שגיאה: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ===============================================================
   ITEM SELECTION & TABS
   =============================================================== */
function selectItem(name, type) {
  state.currentItem = { name, type };
  state.activeTab = 'structure';
  state.tableCache[name] = state.tableCache[name] || {};

  showTableView();
  $('currentTableName').textContent = name;

  const typeBadge = $('currentTableType');
  typeBadge.textContent = type === 'view' ? 'תצוגה' : 'טבלה';
  typeBadge.className = 'type-badge' + (type === 'view' ? ' view' : '');
  $('currentTableMeta').textContent = '';

  // reset tabs
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === 'structure');
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === 'tab-structure');
  });

  renderSidebar();
  loadActiveTab();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-content').forEach(c => {
      c.classList.toggle('active', c.id === 'tab-' + state.activeTab);
    });
    loadActiveTab();
  });
});

function loadActiveTab() {
  if (!state.currentItem) return;
  const container = $('tab-' + state.activeTab);

  switch (state.activeTab) {
    case 'structure':    renderStructureTab(container); break;
    case 'data':         renderDataTab(container); break;
    case 'relationships':renderRelationshipsTab(container); break;
    case 'sql':          renderSqlTab(container); break;
    case 'export':       renderExportTab(container); break;
  }
}

/* ===============================================================

async function renderStructureTab(c) {

  if (!item) return;
  showLoading(c);

  try {
    // Views only need columns; fetch from get_table_structure anyway

            <div class="info-item"><div class="label">מנוע</div><div class="value">${escapeHtml(info.ENGINE || '-')}</div></div>
            <div class="info-item"><div class="label">קידוד</div><div class="value">${escapeHtml(info.TABLE_COLLATION || '-')}</div></div>
            <div class="info-item"><div class="label">מספר שורות (משוער)</div><div class="value">${info.TABLE_ROWS ?? '-'}</div></div>
            <div class="info-item"><div class="label">AUTO_INCREMENT</div><div class="value">${info.AUTO_INCREMENT ?? '-'}</div></div>

        <h3>
          📋 עמודות

                if (col.Key === 'UNI') pills.push('<span class="pill uq">UNIQUE</span>');
                if (col.Key === 'MUL') pills.push('<span class="pill idx">INDEX</span>');
                if (fkCols.has(col.Field)) pills.push('<span class="pill fk">FK</span>');

        <div class="section-card">
          <h3>🔗 מפתחות זרים <span class="count-badge">${fks.length}</span></h3>
          <div class="table-wrap">

                    <td class="mono">${idx.columns.map(escapeHtml).join(', ')}</td>

    // Triggers section

      html += `
        <div class="section-card">
          <h3>⚡ טריגרים <span class="count-badge">${triggers.length}</span></h3>

function updateTableMeta(data) {
  const meta = [];
  const info = data.tableInfo;
  if (info) {
    if (info.ENGINE) meta.push(info.ENGINE);
    if (info.TABLE_ROWS !== null && info.TABLE_ROWS !== undefined) meta.push(info.TABLE_ROWS + ' שורות');
  }
  meta.push((data.columns || []).length + ' עמודות');
  $('currentTableMeta').textContent = meta.join(' · ');
}

/* ===============================================================
   ADD COLUMN MODAL

function openAddColumnModal() {
  const item = state.currentItem;
  const structure = state.tableCache[item.name].structure;
  const existingCols = structure ? structure.columns.map(c => c.Field) : [];

  const commonTypes = [
    'INT', 'BIGINT', 'SMALLINT', 'TINYINT',
    'VARCHAR(255)', 'TEXT', 'LONGTEXT',
    'DECIMAL(10,2)', 'FLOAT', 'DOUBLE',
    'DATE', 'DATETIME', 'TIMESTAMP', 'TIME',
    'BOOLEAN', 'JSON', 'BLOB'
  ];

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>➕ הוספת עמודה ל-${escapeHtml(item.name)}</h3>
        <button class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="row-field">
          <label>שם העמודה <span style="color:#dc3545">*</span></label>
          <input type="text" id="colName" placeholder="למשל: email, created_at" required>

        </div>

        <div class="row-field">
          <label>סוג הנתונים</label>
          <div style="display:flex;gap:8px">
            <select id="colTypeSelect" style="flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#fafafa">
              ${commonTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
              <option value="__custom__">-- מותאם אישית --</option>
            </select>
            <input type="text" id="colTypeCustom" placeholder="למשל: ENUM('a','b')" style="flex:1;display:none">
          </div>
        </div>

        <div class="row-field">
          <label>
            <input type="checkbox" id="colNullable" checked style="margin-left:4px">
            מאפשר NULL
          </label>
        </div>

        <div class="row-field">
          <label>ערך ברירת מחדל (אופציונלי)</label>
          <input type="text" id="colDefault" placeholder="השאר ריק אם אין">
        </div>

        <div class="row-field">
          <label>מיקום בטבלה</label>
          <select id="colAfter" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#fafafa">
            <option value="">בסוף (ברירת מחדל)</option>
            ${existingCols.map(c => `<option value="${escapeHtml(c)}">אחרי ${escapeHtml(c)}</option>`).join('')}
          </select>
        </div>

        <div class="row-field">
          <label>הערה (אופציונלי)</label>
          <input type="text" id="colComment" placeholder="תיאור העמודה">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelColBtn">ביטול</button>
        <button class="btn btn-success" id="saveColBtn">💾 הוסף עמודה</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const close = () => modal.remove();
  modal.querySelector('.modal-close').addEventListener('click', close);
  modal.querySelector('#cancelColBtn').addEventListener('click', close);
  modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

  const typeSelect = modal.querySelector('#colTypeSelect');
  const typeCustom = modal.querySelector('#colTypeCustom');
  typeSelect.addEventListener('change', () => {
    if (typeSelect.value === '__custom__') {
      typeCustom.style.display = 'block';
      typeCustom.focus();
    } else {
      typeCustom.style.display = 'none';
    }
  });

  modal.querySelector('#saveColBtn').addEventListener('click', async () => {
    const colName = modal.querySelector('#colName').value.trim();
    if (!colName) { toast('יש להזין שם עמודה', 'error'); return; }
    if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(colName)) {
      toast('שם העמודה חייב להתחיל באות ולהכיל רק אותיות, ספרות וקו תחתון', 'error');
      return;
    }

    const colType = typeSelect.value === '__custom__'
      ? typeCustom.value.trim()
      : typeSelect.value;
    if (!colType) { toast('יש לבחור סוג עמודה', 'error'); return; }

    const params = {
      table: item.name,
      column_name: colName,
      column_type: colType,
      nullable: modal.querySelector('#colNullable').checked,
      default_value: modal.querySelector('#colDefault').value || null,
      comment: modal.querySelector('#colComment').value || '',
      after_column: modal.querySelector('#colAfter').value || ''
    };

    try {
      await api('add_column', params);
      toast('✅ העמודה נוספה בהצלחה', 'success');
      close();
      delete state.tableCache[item.name].structure;
      renderStructureTab($('tab-structure'));
    } catch (err) {
      toast('❌ שגיאה: ' + err.message, 'error');
    }
  });
}

/* ===============================================================
   DROP COLUMN (with FK check on the server side)
   =============================================================== */
async function dropColumn(columnName) {
  const item = state.currentItem;
  if (!confirm(`האם למחוק את העמודה "${columnName}" מהטבלה "${item.name}"?\n\nהפעולה אינה הפיכה!`)) {
    return;
  }

  try {
    const res = await api('drop_column', { table: item.name, column: columnName });
    if (res.success) {
      toast('✅ העמודה נמחקה', 'success');
      delete state.tableCache[item.name].structure;
      renderStructureTab($('tab-structure'));
    }
  } catch (err) {
    // Server returns error with FK info if blocked
    const msg = err.message || 'שגיאה במחיקת עמודה';
    showFkConflictDialog(msg);
  }
}

function showFkConflictDialog(errorMessage) {

  modal.className = 'modal-backdrop';

    <div class="modal">
      <div class="modal-header">
        <h3>🚫 לא ניתן למחוק</h3>

          <p style="margin-bottom:12px">ל-MySQL אין אפשרות למחוק עמודה שיש עליה מפתח זר (Foreign Key) או שמפתח זר בטבלה אחרת מתייחס אליה.</p>
          <p><strong>פתרון:</strong> יש קודם להסיר את מפתחות הזרים הקשורים לפני המחיקה.</p>

async function renderDataTab(c) {
  const item = state.currentItem;
  if (!item) return;

  // init page state
  const cacheKey = item.name + ':' + item.type;
  const cache = state.tableCache[item.name];
  cache.dataPage = cache.dataPage || 1;
  cache.dataLimit = cache.dataLimit || 50;

  showLoading(c);

  try {
    const action = item.type === 'view' ? 'get_view_data' : 'get_table_data';
    const params = item.type === 'view'
      ? { view: item.name, page: cache.dataPage, limit: cache.dataLimit }
      : { table: item.name, page: cache.dataPage, limit: cache.dataLimit };

    const data = await api(action, params);

    // also need structure for add-row modal + column types
    let structure = cache.structure;
    if (!structure && item.type === 'table') {
      structure = await api('get_table_structure', { table: item.name });
      cache.structure = structure;
    }

    cache.dataResult = data;
    const rows = data.rows || [];
    const pkCols = data.primaryKeys || [];
    const canEdit = item.type === 'table';
    const columnNames = rows.length ? Object.keys(rows[0]) : (structure ? structure.columns.map(c => c.Field) : []);

    let html = `
      <div class="data-toolbar">
        <div class="stat">סה"כ: <strong>${data.total}</strong> שורות</div>
        <div class="spacer"></div>
        <label style="font-size:0.85rem;color:#666">שורות בעמוד:
          <select id="pageLimitSelect">
            ${[10, 25, 50, 100, 200].map(n =>
              `<option value="${n}" ${cache.dataLimit === n ? 'selected' : ''}>${n}</option>`
            ).join('')}
          </select>
        </label>
        ${canEdit ? `<button class="btn btn-primary" id="addRowBtn">➕ הוסף שורה</button>` : ''}
        <button class="btn btn-secondary" id="refreshBtn">🔄 רענן</button>
      </div>`;

    if (rows.length === 0) {
      html += '<div class="empty-state">📭 אין נתונים להצגה</div>';
    } else {
      html += `
        <div class="table-wrap">
          <table class="data-table rows-table">
            <thead>
              <tr>
                ${columnNames.map(cn => {
                  const isPk = pkCols.includes(cn);
                  return `<th>${isPk ? '🔑 ' : ''}${escapeHtml(cn)}</th>`;
                }).join('')}
                ${canEdit ? '<th style="width:60px">פעולות</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${rows.map((row, idx) => `
                <tr data-row-idx="${idx}">
                  ${columnNames.map(cn => {
                    const v = row[cn];
                    if (v === null) return '<td><span class="null-val">NULL</span></td>';
                    const s = String(v);
                    return `<td class="cell-value" title="${escapeHtml(s)}">${escapeHtml(s.length > 100 ? s.slice(0, 100) + '…' : s)}</td>`;
                  }).join('')}
                  ${canEdit ? `<td class="actions-cell"><button class="btn btn-danger delete-row-btn" data-idx="${idx}" style="padding:4px 8px;font-size:0.75rem">🗑️</button></td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;

      // Pagination
      html += renderPagination(data.page, data.totalPages);
    }

    c.innerHTML = html;

    // Wire up controls
    $('pageLimitSelect').addEventListener('change', (e) => {
      cache.dataLimit = parseInt(e.target.value, 10);
      cache.dataPage = 1;
      renderDataTab(c);
    });
    $('refreshBtn').addEventListener('click', () => renderDataTab(c));
    const addBtn = $('addRowBtn');
    if (addBtn) addBtn.addEventListener('click', openAddRowModal);

    c.querySelectorAll('.pag-btn').forEach(b => {
      b.addEventListener('click', () => {
        cache.dataPage = parseInt(b.dataset.page, 10);
        renderDataTab(c);
      });
    });

    c.querySelectorAll('.delete-row-btn').forEach(b => {
      b.addEventListener('click', () => {
        const idx = parseInt(b.dataset.idx, 10);
        deleteRow(rows[idx], pkCols, columnNames);
      });
    });
  } catch (err) {
    c.innerHTML = `<div class="empty-state">❌ שגיאה: ${escapeHtml(err.message)}</div>`;
  }
}

function renderPagination(currentPage, totalPages) {
  if (totalPages <= 1) return '';
  const pages = [];
  const add = (p) => pages.push(p);

  add(1);
  if (currentPage > 4) pages.push('…');
  for (let p = Math.max(2, currentPage - 2); p <= Math.min(totalPages - 1, currentPage + 2); p++) {
    pages.push(p);
  }
  if (currentPage < totalPages - 3) pages.push('…');
  if (totalPages > 1) add(totalPages);

  return `
    <div class="pagination">
      <button class="pag-btn" data-page="${Math.max(1, currentPage - 1)}" ${currentPage === 1 ? 'disabled' : ''}>‹ קודם</button>
      ${pages.map(p => p === '…'
        ? `<span class="page-info">…</span>`
        : `<button class="pag-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`
      ).join('')}
      <button class="pag-btn" data-page="${Math.min(totalPages, currentPage + 1)}" ${currentPage === totalPages ? 'disabled' : ''}>הבא ›</button>
      <span class="page-info">עמוד ${currentPage} מתוך ${totalPages}</span>
    </div>`;
}

/* ===============================================================
   DELETE ROW
   =============================================================== */
async function deleteRow(row, pkCols, allCols) {
  const item = state.currentItem;
  const where = {};

  if (pkCols && pkCols.length) {
    pkCols.forEach(c => { where[c] = row[c]; });
  } else {
    allCols.forEach(c => { where[c] = row[c]; });
  }

  const whereDesc = Object.entries(where)
    .map(([k, v]) => `${k} = ${v === null ? 'NULL' : v}`)
    .join(', ');
  if (!confirm('למחוק שורה?\n\n' + whereDesc)) return;

  try {
    const res = await api('delete_row', { table: item.name, where });
    if (res.affectedRows > 0) {
      toast('✅ השורה נמחקה בהצלחה', 'success');
      renderDataTab($('tab-data'));
    } else {
      toast('⚠️ לא נמחקה אף שורה', 'error');
    }
  } catch (err) {
    toast('❌ שגיאה: ' + err.message, 'error');
  }
}

function openAddRowModal() {
  const item = state.currentItem;
  const structure = state.tableCache[item.name].structure;
  if (!structure) { toast('יש לטעון קודם את מבנה הטבלה', 'error'); return; }

  const cols = structure.columns || [];

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `

      <div class="modal-body">
        <form id="addRowForm">
          ${cols.map(col => {
            const isAuto = (col.Extra || '').includes('auto_increment');
            const nullable = col.Null === 'YES';
            const inputType = inferInputType(col.Type);
            const isTextArea = /text|blob|json/i.test(col.Type);
            const defaultTxt = col.Default !== null ? `ברירת מחדל: ${col.Default}` :
                               (nullable ? 'ניתן להשאיר ריק' : '⚠️ שדה חובה');
            return `
              <div class="row-field" data-col="${escapeHtml(col.Field)}" data-nullable="${nullable}">
                <label>
                  <strong>${escapeHtml(col.Field)}</strong>
                  <span class="col-type">${escapeHtml(col.Type)}</span>
                  ${isAuto ? '<span class="pill">AUTO</span>' : ''}
                  ${col.Key === 'PRI' ? '<span class="pill pk">PK</span>' : ''}
                  ${nullable ? `<label class="null-toggle"><input type="checkbox" class="null-chk"> NULL</label>` : ''}
                </label>
                ${isTextArea
                  ? `<textarea class="row-input" ${isAuto ? 'placeholder="השאר ריק לייצור אוטומטי"' : ''}></textarea>`
                  : `<input type="${inputType}" class="row-input" ${isAuto ? 'placeholder="השאר ריק לייצור אוטומטי"' : ''}>`}
                <div class="hint">${escapeHtml(defaultTxt)}${col.Comment ? ' · ' + escapeHtml(col.Comment) : ''}</div>
              </div>`;
          }).join('')}
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelRowBtn">ביטול</button>
        <button class="btn btn-success" id="saveRowBtn">💾 שמירה</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  const close = () => modal.remove();
  modal.querySelector('.modal-close').addEventListener('click', close);
  modal.querySelector('#cancelRowBtn').addEventListener('click', close);
  modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

  // null toggle handlers
  modal.querySelectorAll('.null-chk').forEach(chk => {
    chk.addEventListener('change', () => {
      const field = chk.closest('.row-field');
      field.classList.toggle('is-null', chk.checked);
      const inp = field.querySelector('.row-input');
      if (inp) inp.disabled = chk.checked;
    });
  });

  modal.querySelector('#saveRowBtn').addEventListener('click', async () => {
    const data = {};
    modal.querySelectorAll('.row-field').forEach(field => {
      const colName = field.dataset.col;
      const nullChk = field.querySelector('.null-chk');
      const input = field.querySelector('.row-input');
      if (nullChk && nullChk.checked) {
        data[colName] = '__NULL__';
      } else {
        const v = input.value;
        if (v === '') {
          data[colName] = '__SKIP__'; // let MySQL use default/auto_increment
        } else {
          data[colName] = v;
        }
      }
    });

    try {
      const res = await api('add_row', { table: item.name, data });
      toast('✅ שורה חדשה נוספה' + (res.insertId ? ' (ID: ' + res.insertId + ')' : ''), 'success');
      close();
      renderDataTab($('tab-data'));
    } catch (err) {
      toast('❌ שגיאה: ' + err.message, 'error');
    }
  });
}

function inferInputType(mysqlType) {
  const t = (mysqlType || '').toLowerCase();
  if (/int|decimal|float|double|numeric/.test(t)) return 'number';
  if (/^date\b/.test(t)) return 'date';
  if (/^datetime|^timestamp/.test(t)) return 'datetime-local';
  if (/^time\b/.test(t)) return 'time';
  return 'text';
}

/* ===============================================================
   VISUAL ERD - draggable tables with SVG connection lines
   =============================================================== */
async function renderRelVisualView(container) {
  showLoading(container);
  let data;
  try {
    data = await api('get_all_relationships');
  } catch (err) {
    container.innerHTML = `<div class="empty-state">❌ שגיאה: ${escapeHtml(err.message)}</div>`;
    return;
  }

  const tables = data.tables || [];
  const tableColumns = data.tableColumns || {};
  const rels = data.relationships || [];
  const currentName = state.currentItem.name;

  // Auto-layout: grid with tables that connect to current one placed nearby
  const connected = new Set();
  rels.forEach(r => {
    if (r.TABLE_NAME === currentName) connected.add(r.REFERENCED_TABLE_NAME);
    if (r.REFERENCED_TABLE_NAME === currentName) connected.add(r.TABLE_NAME);
  });

  const positions = {};
  const cols = 5;
  const colW = 240, rowH = 260;

  // Current table in center
  if (tables.includes(currentName)) {
    positions[currentName] = { x: 2 * colW + 40, y: 1 * rowH + 40 };
  }

  // Connected tables around current
  const connectedArr = [...connected].filter(t => tables.includes(t));
  connectedArr.forEach((t, i) => {
    const angle = (i / connectedArr.length) * 2 * Math.PI;
    positions[t] = {
      x: 2 * colW + 40 + Math.cos(angle) * 280,
      y: 1 * rowH + 40 + Math.sin(angle) * 220
    };
  });

  // Other tables in grid below
  let r = 3, col = 0;
  tables.forEach(t => {
    if (positions[t]) return;
    positions[t] = { x: col * colW + 40, y: r * rowH + 40 };
    col++;
    if (col >= cols) { col = 0; r++; }
  });

  // Determine PK and FK sets per table
  const pkSet = {}, fkSet = {};
  tables.forEach(t => {
    pkSet[t] = new Set();
    fkSet[t] = new Set();
    (tableColumns[t] || []).forEach(c => {
      if (c.Key === 'PRI') pkSet[t].add(c.Field);
    });
  });
  rels.forEach(r => {
    if (!fkSet[r.TABLE_NAME]) fkSet[r.TABLE_NAME] = new Set();
    fkSet[r.TABLE_NAME].add(r.COLUMN_NAME);
  });

  container.innerHTML = `
    <div class="erd-wrap" id="erdWrap">
      <div class="erd-canvas" id="erdCanvas">
        <svg class="erd-svg" id="erdSvg" viewBox="0 0 2400 1600"></svg>
        ${tables.map(t => {
          const p = positions[t];
          const cls = ['erd-table'];
          if (t === currentName) cls.push('selected');
          else if (connected.has(t)) cls.push('highlighted');
          const colsArr = tableColumns[t] || [];
          return `
            <div class="${cls.join(' ')}" data-table="${escapeHtml(t)}"
                 style="right: ${p.x}px; top: ${p.y}px">
              <div class="erd-table-header">📋 ${escapeHtml(t)}</div>
              ${colsArr.slice(0, 12).map(c => {
                const isPk = pkSet[t].has(c.Field);
                const isFk = fkSet[t] && fkSet[t].has(c.Field);
                const cls = ['erd-table-col'];
                if (isPk) cls.push('is-pk');
                if (isFk) cls.push('is-fk');
                return `
                  <div class="${cls.join(' ')}" data-col="${escapeHtml(c.Field)}">
                    <span class="col-icon">${isPk ? '🔑' : isFk ? '🔗' : '·'}</span>
                    <span>${escapeHtml(c.Field)}</span>
                    <span class="col-type">${escapeHtml(c.Type.split('(')[0])}</span>
                  </div>`;
              }).join('')}
              ${colsArr.length > 12 ? `<div class="erd-table-col" style="color:#888;font-style:italic">+ ${colsArr.length - 12} נוספות</div>` : ''}
            </div>`;
        }).join('')}
      </div>
      <div class="erd-legend">
        <div>🟧 <strong>אדום</strong>: הטבלה הנוכחית</div>
        <div>🟩 <strong>ירוק</strong>: טבלאות מקושרות</div>
        <div>⬜ <strong>כחול</strong>: שאר הטבלאות</div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid #eee">
          גרור טבלה לשינוי המיקום
        </div>
      </div>
    </div>`;

  // Draw SVG lines
  drawErdLines(rels, positions, currentName);

  // Enable dragging
  container.querySelectorAll('.erd-table').forEach(el => {
    enableDrag(el, positions, rels, currentName);
  });
}

function drawErdLines(rels, positions, currentName) {
  const svg = $('erdSvg');
  if (!svg) return;

  // Get actual dims
  const canvas = $('erdCanvas');
  svg.setAttribute('viewBox', `0 0 ${canvas.offsetWidth} ${canvas.offsetHeight}`);

  // Helper: get approximate connection point for a table
  function anchor(tableName) {
    const p = positions[tableName];
    if (!p) return null;
    const el = document.querySelector(`.erd-table[data-table="${CSS.escape(tableName)}"]`);
    if (!el) return null;
    // Note: RTL layout - x is measured from right edge
    const canvasWidth = canvas.offsetWidth;
    return {
      cx: canvasWidth - p.x - el.offsetWidth / 2,
      cy: p.y + el.offsetHeight / 2
    };
  }

  const paths = [];
  const seen = new Set();
  rels.forEach(r => {
    const key = r.TABLE_NAME + '|' + r.REFERENCED_TABLE_NAME;
    if (seen.has(key)) return;
    seen.add(key);

    const a = anchor(r.TABLE_NAME);
    const b = anchor(r.REFERENCED_TABLE_NAME);
    if (!a || !b) return;

    const isHighlighted = r.TABLE_NAME === currentName || r.REFERENCED_TABLE_NAME === currentName;
    const dx = (b.cx - a.cx) * 0.4;
    const d = `M ${a.cx},${a.cy} C ${a.cx + dx},${a.cy} ${b.cx - dx},${b.cy} ${b.cx},${b.cy}`;
    paths.push(`<path d="${d}" class="${isHighlighted ? 'highlighted' : ''}"></path>`);
  });

  svg.innerHTML = paths.join('');
}

function enableDrag(el, positions, rels, currentName) {
  const header = el.querySelector('.erd-table-header');
  if (!header) return;

  let dragging = false, startX, startY, startRight, startTop;

  header.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    const style = el.style;
    startRight = parseFloat(style.right);
    startTop = parseFloat(style.top);
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // Because RTL: positive right when moving left (dx negative)
    el.style.right = (startRight - dx) + 'px';
    el.style.top = (startTop + dy) + 'px';
    positions[el.dataset.table] = {
      x: startRight - dx, y: startTop + dy
    };
    drawErdLines(rels, positions, currentName);
  });

  document.addEventListener('mouseup', () => { dragging = false; });
}
/* ===============================================================
   SQL GENERATOR HELPERS - build CREATE/ALTER/DROP scripts from
   the structure returned by the get_sql_scripts endpoint.
   =============================================================== */

// Quote an identifier the same way the server does
function qid(name) {
  return '`' + String(name).replace(/`/g, '``') + '`';
}

// Quote a SQL string literal
function sqlStr(s) {
  return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "''") + "'";
}

// Default-value clauses come back from MySQL as either a literal or an
// expression like CURRENT_TIMESTAMP / NOW(). Expressions must NOT be quoted.
function isSqlExpressionDefault(v) {
  if (v === null || v === undefined) return false;
  return /^(CURRENT_TIMESTAMP|CURRENT_DATE|CURRENT_TIME|NOW\(\)|UTC_TIMESTAMP|UUID\(\))/i.test(String(v).trim());
}

// Build a column definition snippet:
//   `name` VARCHAR(255) NOT NULL DEFAULT 'foo' COMMENT 'bar'
// Used inside CREATE / ADD / MODIFY / CHANGE COLUMN statements.
function genColumnDef(col) {
  const parts = [qid(col.Field), col.Type];
  parts.push(col.Null === 'YES' ? 'NULL' : 'NOT NULL');

  if (col.Default !== null && col.Default !== undefined) {
    parts.push('DEFAULT ' + (isSqlExpressionDefault(col.Default) ? col.Default : sqlStr(col.Default)));
  } else if (col.Null === 'YES' && !/auto_increment/i.test(col.Extra || '')) {
    parts.push('DEFAULT NULL');
  }

  // Extra: auto_increment, on update CURRENT_TIMESTAMP, etc.
  if (col.Extra) parts.push(col.Extra);

  if (col.Comment) parts.push('COMMENT ' + sqlStr(col.Comment));

  return parts.join(' ');
}

// ALTER TABLE - column operations
function genAddColumnSql(table, col, afterCol) {
  let sql = `ALTER TABLE ${qid(table)}\n  ADD COLUMN ${genColumnDef(col)}`;
  if (afterCol) sql += `\n  AFTER ${qid(afterCol)}`;
  return sql + ';';
}

function genModifyColumnSql(table, col) {
  return `ALTER TABLE ${qid(table)}\n  MODIFY COLUMN ${genColumnDef(col)};`;
}

function genRenameColumnSql(table, oldName, col) {
  // CHANGE accepts a full new definition + new name
  const newDef = genColumnDef(col);
  return `ALTER TABLE ${qid(table)}\n  CHANGE COLUMN ${qid(oldName)} ${newDef};`;
}

function genDropColumnSql(table, columnName) {
  return `ALTER TABLE ${qid(table)} DROP COLUMN ${qid(columnName)};`;
}

// ALTER TABLE - index operations.
// `idx` here is the grouped index shape used in renderStructureTab:
//   { name, unique, type, columns: [...] }
function genAddIndexSql(table, idx) {
  const cols = idx.columns.map(qid).join(', ');
  if (idx.name === 'PRIMARY') {
    return `ALTER TABLE ${qid(table)} ADD PRIMARY KEY (${cols});`;
  }
  if (/FULLTEXT/i.test(idx.type || '')) {
    return `ALTER TABLE ${qid(table)} ADD FULLTEXT INDEX ${qid(idx.name)} (${cols});`;
  }
  if (/SPATIAL/i.test(idx.type || '')) {
    return `ALTER TABLE ${qid(table)} ADD SPATIAL INDEX ${qid(idx.name)} (${cols});`;
  }
  if (idx.unique) {
    return `ALTER TABLE ${qid(table)} ADD UNIQUE INDEX ${qid(idx.name)} (${cols});`;
  }
  return `ALTER TABLE ${qid(table)} ADD INDEX ${qid(idx.name)} (${cols});`;
}

function genDropIndexSql(table, indexName) {
  if (indexName === 'PRIMARY') {
    return `ALTER TABLE ${qid(table)} DROP PRIMARY KEY;`;
  }
  return `ALTER TABLE ${qid(table)} DROP INDEX ${qid(indexName)};`;
}

// ALTER TABLE - foreign key operations
function genAddFkSql(table, fk) {
  return `ALTER TABLE ${qid(table)}\n` +
         `  ADD CONSTRAINT ${qid(fk.CONSTRAINT_NAME)}\n` +
         `    FOREIGN KEY (${qid(fk.COLUMN_NAME)})\n` +
         `    REFERENCES ${qid(fk.REFERENCED_TABLE_NAME)} (${qid(fk.REFERENCED_COLUMN_NAME)})\n` +
         `    ON UPDATE ${fk.UPDATE_RULE}\n` +
         `    ON DELETE ${fk.DELETE_RULE};`;
}

function genDropFkSql(table, fkName) {
  return `ALTER TABLE ${qid(table)} DROP FOREIGN KEY ${qid(fkName)};`;
}

// Trigger operations - we can drop existing ones, and offer a template
// for creating new ones (the user fills in the body).
function genDropTriggerSql(triggerName) {
  return `DROP TRIGGER IF EXISTS ${qid(triggerName)};`;
}

function genTriggerTemplate(table, timing, event) {
  const triggerName = `${table}_${(timing || 'BEFORE').toLowerCase()}_${(event || 'INSERT').toLowerCase()}`;
  const refRow = (event || 'INSERT').toUpperCase() === 'DELETE' ? 'OLD' : 'NEW';
  return `DELIMITER //\n` +
         `CREATE TRIGGER ${qid(triggerName)}\n` +
         `${(timing || 'BEFORE').toUpperCase()} ${(event || 'INSERT').toUpperCase()} ON ${qid(table)}\n` +
         `FOR EACH ROW\n` +
         `BEGIN\n` +
         `  -- כאן הקוד שלך, גישה לשורה דרך ${refRow}.column_name\n` +
         `  -- לדוגמה: SET ${refRow}.updated_at = NOW();\n` +
         `END//\n` +
         `DELIMITER ;`;
}

// Table-level operations
function genRenameTableSql(oldName, newName) {
  return `RENAME TABLE ${qid(oldName)} TO ${qid(newName || 'new_name')};`;
}

function genTruncateSql(table) {
  return `TRUNCATE TABLE ${qid(table)};`;
}

function genDropTableSql(table) {
  return `DROP TABLE IF EXISTS ${qid(table)};`;
}

// Build the multi-step DROP TABLE flow that respects dependencies:
//   1. drop incoming FK constraints in OTHER tables
//   2. drop views that reference this table
//   3. drop triggers attached to this table
//   4. drop the table itself
// Returns an array of { label, sql, kind } so the UI can render each
// step as its own copyable block.
function genDropTableFlow(tableName, incomingFks, referencingViews, triggers) {
  const steps = [];

  if (incomingFks && incomingFks.length) {
    steps.push({
      kind: 'fks',
      label: `שלב 1 · הסרת ${incomingFks.length} מפתחות זרים נכנסים מטבלאות אחרות`,
      sql: incomingFks.map(fk =>
        `ALTER TABLE ${qid(fk.SOURCE_TABLE)} DROP FOREIGN KEY ${qid(fk.CONSTRAINT_NAME)};`
      ).join('\n')
    });
  }

  if (referencingViews && referencingViews.length) {
    steps.push({
      kind: 'views',
      label: `שלב ${steps.length + 1} · הסרת ${referencingViews.length} VIEWs שמתייחסים לטבלה`,
      sql: referencingViews.map(v => `DROP VIEW IF EXISTS ${qid(v)};`).join('\n')
    });
  }

  if (triggers && triggers.length) {
    steps.push({
      kind: 'triggers',
      label: `שלב ${steps.length + 1} · הסרת ${triggers.length} טריגרים`,
      sql: triggers.map(t => `DROP TRIGGER IF EXISTS ${qid(t.TRIGGER_NAME)};`).join('\n')
    });
  }

  steps.push({
    kind: 'drop',
    label: `שלב ${steps.length + 1} · הסרת הטבלה`,
    sql: genDropTableSql(tableName)
  });

  return steps;
}

// VIEW operations
function genReplaceViewSql(originalCreateSql) {
  // SHOW CREATE TABLE returns: "CREATE ALGORITHM=... DEFINER=... SQL SECURITY ... VIEW `name` AS ..."
  // Insert "OR REPLACE" right after the leading CREATE.
  return originalCreateSql.replace(/^CREATE\b/i, 'CREATE OR REPLACE');
}

function genAlterViewSql(originalCreateSql) {
  // ALTER VIEW preserves the same syntax but cannot create. Convert by
  // swapping the leading CREATE [...] VIEW for ALTER [...] VIEW.
  return originalCreateSql.replace(/^CREATE\b/i, 'ALTER');
}

function genDropViewSql(viewName) {
  return `DROP VIEW IF EXISTS ${qid(viewName)};`;
}

// Raw SQL registry: highlighted HTML lives in the DOM, but copy/download
// must use raw text. Keys are auto-generated per render and cleared on
// each new renderSqlTab() invocation.
const sqlScripts = new Map();
let sqlScriptCounter = 0;

// Build a single collapsible section. `scripts` is [{label, sql, filename}].
// `info` is raw HTML (callers control its content - intentional, since the
// notes need <strong>/<ol>/<code> formatting).
function buildSqlSection({ id, icon, title, severity, info, scripts, badge, openByDefault }) {
  const sevClass = severity ? ' ' + severity : '';
  const openClass = openByDefault ? ' open' : '';
  const badgeHtml = badge ? `<span class="count-badge small">${escapeHtml(String(badge))}</span>` : '';
  const infoHtml = info ? `<div class="sql-info-note ${severity || ''}">${info}</div>` : '';

  let scriptsHtml = '';
  if (!scripts || !scripts.length) {
    scriptsHtml = info ? '' : '<div class="script-empty">אין רכיבים להציג</div>';
  } else {
    scriptsHtml = scripts.map(s => {
      const sid = 'sql_' + (++sqlScriptCounter);
      sqlScripts.set(sid, s.sql || '');
      const label = s.label
        ? `<div class="script-label">${escapeHtml(s.label)}</div>`
        : '';
      const fname = escapeHtml(s.filename || (id + '.sql'));
      return `
        <div class="sql-script${s.compact ? ' compact' : ''}">
          ${label}
          <div class="code-block">
            <div class="code-actions">
              <button class="copy-script-btn" data-sid="${sid}">📋 העתק</button>
              <button class="download-script-btn" data-sid="${sid}" data-fname="${fname}">💾 הורד</button>
            </div>
            <pre>${highlightSql(s.sql || '')}</pre>
          </div>
        </div>`;
    }).join('');
  }

  return `
    <div class="sql-section${sevClass}${openClass}" id="section-${id}">
      <div class="sql-section-header" data-toggle-section="${id}">
        <span class="toggle-icon">▶</span>
        <h3>${icon || ''} ${escapeHtml(title)} ${badgeHtml}</h3>
      </div>
      <div class="sql-section-body">
        ${infoHtml}
        ${scriptsHtml}
      </div>
    </div>`;
}

// Single delegated click handler for toggle / copy / download / TOC jumps.
function wireSqlTab(container) {
  container.addEventListener('click', async (e) => {
    const toggle = e.target.closest('[data-toggle-section]');
    if (toggle) {
      const sec = toggle.closest('.sql-section');
      if (sec) sec.classList.toggle('open');
      return;
    }

    const copyBtn = e.target.closest('.copy-script-btn');
    if (copyBtn) {
      const sql = sqlScripts.get(copyBtn.dataset.sid);
      if (sql == null) return;
      try {
        await navigator.clipboard.writeText(sql);
        const original = copyBtn.textContent;
        copyBtn.textContent = '✅ הועתק';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = original; copyBtn.classList.remove('copied'); }, 1800);
      } catch (err) {
        toast('❌ לא ניתן להעתיק: ' + err.message, 'error');
      }
      return;
    }

    const dlBtn = e.target.closest('.download-script-btn');
    if (dlBtn) {
      const sql = sqlScripts.get(dlBtn.dataset.sid);
      if (sql == null) return;
      downloadFile(sql, dlBtn.dataset.fname || 'script.sql', 'text/plain');
      return;
    }

    const jump = e.target.closest('[data-jump]');
    if (jump) {
      e.preventDefault();
      const target = container.querySelector('#section-' + jump.dataset.jump);
      if (target) {
        target.classList.add('open');
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  });
}

async function renderSqlTab(c) {
  const item = state.currentItem;
  if (!item) return;
  showLoading(c);

  // Reset script registry on every render
  sqlScripts.clear();
  sqlScriptCounter = 0;

  try {
    if (item.type === 'view') {
      await renderSqlTabView(c, item);
    } else {
      await renderSqlTabTable(c, item);
    }
  } catch (err) {
    c.innerHTML = `<div class="empty-state">❌ שגיאה: ${escapeHtml(err.message)}</div>`;
  }
}

// VIEW branch - mirrors the table layout with the operations relevant
// to views: CREATE / CREATE OR REPLACE / ALTER VIEW / DROP VIEW.
async function renderSqlTabView(c, item) {
  const data = await api('get_sql_scripts', { table: item.name, type: 'view' });
  data.createSql = formatSql(data.createSql || '');
  const createSql = data.createSql || '';
  const viewInfo = data.viewInfo || {};
  const viewCols = data.columns || [];

  // TOC
  const tocLinks = [
    { id: 'view-overview', label: 'ℹ️ סקירה' },

    { id: 'view-alter',    label: '✏️ ALTER' },
    { id: 'view-drop',     label: '🗑️ DROP' },

  let html = '<div class="sql-toc">' +
    tocLinks.map(l => `<a data-jump="${l.id}">${l.label}</a>`).join('') +
    '</div>';

  // Overview
  const updatable = viewInfo.IS_UPDATABLE === 'YES';
  html += buildSqlSection({
    id: 'view-overview',
    icon: 'ℹ️',
    title: 'סקירה',
    openByDefault: true,
    info: `
      <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px">
        <span><strong>עמודות:</strong> <code>${viewCols.length}</code></span>
        <span><strong>ניתן לעדכון:</strong> <code>${updatable ? 'כן' : 'לא'}</code></span>
        <span><strong>CHECK OPTION:</strong> <code>${escapeHtml(viewInfo.CHECK_OPTION || 'NONE')}</code></span>
        <span><strong>SECURITY:</strong> <code>${escapeHtml(viewInfo.SECURITY_TYPE || 'DEFINER')}</code></span>
      </div>
      <ul>
        <li><strong>VIEW</strong> הוא שאילתה שמורה — אין לו נתונים משלו, הוא ממשיך להחזיר את התוצאה המעודכנת מהטבלאות שמתחתיו.</li>
        ${updatable
            ? `<li><strong>ניתן לעדכון</strong> — אפשר להריץ INSERT/UPDATE/DELETE דרך ה-VIEW (במגבלות MySQL: ללא <code>GROUP BY</code>, <code>DISTINCT</code>, <code>UNION</code>, <code>JOIN</code> מורכב, וכו').</li>`
            : `<li><strong>קריאה בלבד</strong> — לא ניתן לעדכן דרכו, רק SELECT.</li>`}
        <li><strong>SECURITY = DEFINER</strong> אומר שהשאילתה רצה בהרשאות של מי שיצר את ה-VIEW. <strong>INVOKER</strong> רץ בהרשאות המשתמש המבצע.</li>
      </ul>
    `,
    scripts: []
  });

  // CREATE VIEW
  html += buildSqlSection({
    id: 'view-create',
    icon: '📝',
    title: 'CREATE VIEW',
    openByDefault: true,
    info: `
      הסקריפט המלא ליצירת ה-VIEW (תוצאת <code>SHOW CREATE VIEW</code>).
      <ul>
        <li>הריצו על מסד ריק כדי לשחזר את ה-VIEW. הטבלאות שאליהן הוא מתייחס חייבות להיות קיימות מראש.</li>
        <li>אם ה-VIEW כבר קיים — שורת <code>CREATE</code> תיכשל. השתמשו בסקציית <strong>CREATE OR REPLACE</strong> במקום.</li>
        <li>שורת <code>DEFINER=...</code> תכיל את שם המשתמש שיצר את ה-VIEW. אם תריצו במסד אחר — שווה לערוך אותה לשם משתמש קיים, או להסיר את החלק.</li>
      </ul>
    `,
    scripts: [{ sql: createSql, filename: item.name + '.sql' }]
  });

  // CREATE OR REPLACE
  html += buildSqlSection({
    id: 'view-replace',
    icon: '🔄',
    title: 'CREATE OR REPLACE VIEW',
    severity: 'success',
    info: `
      הדרך הנפוצה לעדכן VIEW קיים. אם ה-VIEW לא קיים — נוצר; אם קיים — מוחלף.
      <ul>
        <li><strong>בטוח מ-DROP+CREATE</strong> — הזכויות (GRANT) על ה-VIEW נשמרות. ב-DROP+CREATE הן נמחקות.</li>
        <li>אפשר לשנות את שאילתת ה-SELECT ואת רשימת העמודות ב-VIEW לפי הצורך.</li>
        <li>אם משנים את <strong>סוג העמודות</strong> שה-VIEW מחזיר, בדקו שאף VIEW אחר לא בנוי על ה-VIEW הזה (אחרת ה-VIEW המתבסס עלול להישבר).</li>

  });

  // ALTER VIEW
  html += buildSqlSection({
    id: 'view-alter',
    icon: '✏️',
    title: 'ALTER VIEW',
    severity: 'warning',
    info: `
      <code>ALTER VIEW</code> דומה ל-<code>CREATE OR REPLACE</code> אך <strong>חייב</strong> שה-VIEW יהיה קיים — אחרת ייכשל.
      <ul>
        <li>ההבדל המעשי: <code>CREATE OR REPLACE</code> פועל גם כשאין VIEW; <code>ALTER VIEW</code> מבטיח שאתם מעדכנים אובייקט קיים ולא יוצרים חדש בטעות.</li>
        <li>הזכויות נשמרות גם כאן (כמו ב-CREATE OR REPLACE).</li>
        <li>אפשר לשנות את ה-<code>ALGORITHM</code>, <code>SQL SECURITY</code>, ו-<code>WITH CHECK OPTION</code> דרך הפקודה הזו.</li>
      </ul>
    `,
    scripts: [{ sql: genAlterViewSql(createSql), filename: item.name + '_alter.sql' }]
  });

  // DROP VIEW
  html += buildSqlSection({
    id: 'view-drop',
    icon: '🗑️',
    title: 'DROP VIEW',
    severity: 'danger',
    info: `
      הסרת ה-VIEW. <strong>הפעולה לא הפיכה.</strong>
      <ul>
        <li><code>DROP VIEW IF EXISTS</code> בטוח לריצות חוזרות — לא יזרוק שגיאה אם ה-VIEW לא קיים.</li>
        <li>הסרת VIEW <strong>לא משפיעה</strong> על הטבלאות שמתחתיו. הן נשארות שלמות.</li>

  });

  // Cheat sheet
  html += buildSqlSection({
    id: 'view-notes',
    icon: '📋',
    title: 'לוגיקה לפני/אחרי',
    info: `
      <strong>לפני שינוי VIEW:</strong>
      <ol>
        <li>לזהות אילו VIEWs/דוחות/אפליקציות צורכים את ה-VIEW הזה.</li>
        <li>לוודא שהשינוי לא מסיר עמודות שמשתמשים בהן (אם תסירו עמודה — שאילתות שמשתמשות בה ייכשלו).</li>
        <li>אם ה-VIEW ניתן לעדכון ויש קוד שמבצע דרכו INSERT/UPDATE — לוודא שהשינוי לא הופך אותו ל-read-only.</li>
      </ol>
      <strong>אחרי שינוי:</strong>
      <ol>
        <li>להריץ <code>SELECT * FROM ${escapeHtml(qid(item.name))} LIMIT 1;</code> לוודא שאין שגיאת compile.</li>
        <li>לבדוק <code>SHOW CREATE VIEW</code> ולוודא שמה ש-MySQL שמר תואם למה שביקשתם.</li>
        <li>אם השתמשתם ב-<code>WITH CHECK OPTION</code> — לוודא שהוא עובד (לנסות INSERT שאמור להיכשל).</li>
      </ol>
      <strong>שגיאות נפוצות:</strong>
      <ul>
        <li><code>View's SELECT contains a subquery in the FROM clause</code> — חלק מ-VIEWs לא ניתנים לעדכון בגלל subqueries. תפצלו לוגיקה.</li>
        <li><code>The user specified as a definer does not exist</code> — שורת DEFINER מצביעה למשתמש שלא קיים. ערכו ל-<code>CURRENT_USER</code> או ל-משתמש קיים.</li>

      </ul>
    `,
