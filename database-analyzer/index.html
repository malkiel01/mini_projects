  });

  c.innerHTML = html;
  wireSqlTab(c);
}

// TABLE branch skeleton. Sections beyond CREATE will be filled in 4B-4E.
async function renderSqlTabTable(c, item) {
  const data = await api('get_sql_scripts', { table: item.name, type: 'table' });
  data.createSql = formatSql(data.createSql || '');

  // Cache for downstream sections (4B-4E)
  state.tableCache[item.name] = state.tableCache[item.name] || {};
  state.tableCache[item.name].sqlScripts = data;

  const cols = data.columns || [];
  const indexes = data.indexes || [];
  const fks = data.foreignKeys || [];
  const incomingFks = data.incomingFks || [];
  const triggers = data.triggers || [];
  const referencingViews = data.referencingViews || [];
  const info = data.tableInfo || {};

  // Group raw indexes (one row per column) into logical indexes
  const indexGroups = {};
  indexes.forEach(idx => {
    const n = idx.Key_name;
    if (!indexGroups[n]) {
      indexGroups[n] = { name: n, unique: idx.Non_unique == 0, type: idx.Index_type, columns: [] };
    }
    indexGroups[n].columns.push(idx.Column_name);
  });
  const idxList = Object.values(indexGroups);

  // ---------------------------------------------------------------
  // 4F - Quick navigation (TOC) - rendered first so users can jump.
  // Section ids referenced here must match the buildSqlSection ids below.
  // ---------------------------------------------------------------
  const tocLinks = [
    { id: 'overview',     label: 'ℹ️ סקירה' },
    { id: 'create',       label: '📝 CREATE' },
    { id: 'alter-add',    label: '➕ ALTER הוספה' },
    { id: 'alter-modify', label: '✏️ ALTER שינוי' },
    { id: 'alter-remove', label: '➖ ALTER הסרה' },
    { id: 'drop-table',   label: '🗑️ DROP' },
    { id: 'truncate',     label: '🧹 TRUNCATE' },
    { id: 'cheatsheet',   label: '📋 לוגיקה' }
  ];

  let html = '<div class="sql-toc">' +
    tocLinks.map(l => `<a data-jump="${l.id}">${l.label}</a>`).join('') +
    '</div>';

  // ---------------------------------------------------------------
  // 4B - Overview / Dependencies
  // ---------------------------------------------------------------
  const depPills = [];
  if (incomingFks.length) {
    depPills.push(`<span class="dep-pill danger">⚠️ ${incomingFks.length} מפתחות זרים נכנסים</span>`);
  }
  if (referencingViews.length) {
    depPills.push(`<span class="dep-pill">👁️ ${referencingViews.length} VIEWs מתייחסים</span>`);
  }
  if (triggers.length) {
    depPills.push(`<span class="dep-pill">⚡ ${triggers.length} טריגרים</span>`);
  }
  if (fks.length) {
    depPills.push(`<span class="dep-pill success">🔗 ${fks.length} מפתחות זרים יוצאים</span>`);
  }

  const hasBlockingDeps = incomingFks.length > 0 || referencingViews.length > 0;
  const overviewSeverity = hasBlockingDeps ? 'warning' : null;

  const incomingList = incomingFks.length
    ? `<ul>${incomingFks.map(fk =>
        `<li><code>${escapeHtml(fk.SOURCE_TABLE)}.${escapeHtml(fk.SOURCE_COLUMN)}</code> → <code>${escapeHtml(item.name)}.${escapeHtml(fk.REFERENCED_COLUMN_NAME)}</code> <span class="muted">(${escapeHtml(fk.CONSTRAINT_NAME)})</span></li>`
      ).join('')}</ul>`
    : '';
  const viewsList = referencingViews.length
    ? `<ul>${referencingViews.map(v => `<li><code>${escapeHtml(v)}</code></li>`).join('')}</ul>`
    : '';

  const overviewInfo = `
    <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px">
      <span><strong>מנוע:</strong> <code>${escapeHtml(info.ENGINE || '-')}</code></span>
      <span><strong>קידוד:</strong> <code>${escapeHtml(info.TABLE_COLLATION || '-')}</code></span>
      ${info.AUTO_INCREMENT ? `<span><strong>AUTO_INCREMENT הבא:</strong> <code>${escapeHtml(info.AUTO_INCREMENT)}</code></span>` : ''}
      <span><strong>עמודות:</strong> <code>${cols.length}</code></span>
      <span><strong>אינדקסים:</strong> <code>${idxList.length}</code></span>
    </div>
    <div style="margin-bottom:8px">${depPills.join(' ') || '<span class="muted">אין תלויות חיצוניות</span>'}</div>
    ${hasBlockingDeps ? `
      <div style="margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,0.1)">
        <strong>שים לב לפני DROP/ALTER גדול:</strong>
        ${incomingFks.length ? `<div style="margin-top:6px">טבלאות אחרות מצביעות לטבלה הזו דרך FK — חובה להסיר אותם קודם:</div>${incomingList}` : ''}
        ${referencingViews.length ? `<div style="margin-top:6px">VIEWs שמתייחסים לטבלה (יישברו אם הטבלה תושמט):</div>${viewsList}` : ''}
      </div>
    ` : ''}
  `;

  html += buildSqlSection({
    id: 'overview',
    icon: 'ℹ️',
    title: 'סקירה ותלויות',
    severity: overviewSeverity,
    info: overviewInfo,
    scripts: [],
    openByDefault: true
  });

  // ---------------------------------------------------------------
  // CREATE TABLE - now with explanatory note
  // ---------------------------------------------------------------
  html += buildSqlSection({
    id: 'create',
    icon: '📝',
    title: 'CREATE TABLE',
    openByDefault: true,
    info: `
      הסקריפט המלא ליצירת הטבלה כפי ש-MySQL רואה אותה (תוצאת <code>SHOW CREATE TABLE</code>).
      <ul>
        <li>אם תריצו אותו על מסד אחר תקבלו טבלה זהה כולל אינדקסים ו-FKs.</li>
        <li>במקרה שטבלאות שאליהן ה-FKs מצביעים לא קיימות עדיין — יש להריץ אותן <strong>לפני</strong> סקריפט זה.</li>
        <li>אפשר להוסיף <code>DROP TABLE IF EXISTS ${escapeHtml(qid(item.name))};</code> בראש הקובץ כדי להחליף טבלה קיימת.</li>
      </ul>
    `,
    scripts: [{ sql: data.createSql || '', filename: item.name + '.sql' }]
  });

  // ---------------------------------------------------------------
  // 4C - ALTER add (columns / indexes / FKs / triggers)
  // ---------------------------------------------------------------
  const addScripts = [];

  // Generic ADD COLUMN template
  addScripts.push({
    label: '🧩 תבנית גנרית להוספת עמודה',
    sql:
      `ALTER TABLE ${qid(item.name)}\n` +
      `  ADD COLUMN \`new_column\` VARCHAR(255) NULL DEFAULT NULL\n` +
      `  AFTER ${qid(cols[0] ? cols[0].Field : 'id')};`
  });

  // ADD COLUMN per existing column (so the user has a working example for each)
  cols.forEach((col, i) => {
    const after = i > 0 ? cols[i - 1].Field : null;
    addScripts.push({
      label: `➕ הוספת עמודה זהה ל-${col.Field}`,

    });

    });
  });

  // Generic ADD INDEX template if there are no examples

  }

      label: `🔗 הוספת FK ${fk.CONSTRAINT_NAME}`,

      compact: true
    });
  });

  // Generic ADD FK template if there are no examples
  if (!fks.length) {
    addScripts.push({
      label: '🧩 תבנית גנרית להוספת FK',
      sql:
        `ALTER TABLE ${qid(item.name)}\n` +
        `  ADD CONSTRAINT \`fk_${item.name}_other\`\n` +
        `    FOREIGN KEY (\`other_id\`)\n` +
        `    REFERENCES \`other_table\` (\`id\`)\n` +
        `    ON UPDATE CASCADE\n` +
        `    ON DELETE RESTRICT;`
    });
  }

  });

  html += buildSqlSection({
    id: 'alter-add',
    icon: '➕',
    title: 'ALTER — הוספת רכיבים',
    severity: 'success',
    badge: addScripts.length,

    });

  html += buildSqlSection({

        <li><strong>לזהות תלויות</strong> — לפתוח את לשונית "קשרים" ולסקור FKs נכנסים, VIEWs מתייחסים, טריגרים.</li>
      </ol>
      <strong>אחרי השינוי:</strong>
      <ol>
        <li><strong>בדיקת מבנה</strong> — להריץ <code>SHOW CREATE TABLE</code> ולוודא שהמצב התקבל.</li>
        <li><strong>בדיקת אכיפה</strong> — לנסות INSERT/UPDATE שאמור להיכשל מול האילוצים החדשים, לוודא שהוא נכשל.</li>
        <li><strong>VIEWs</strong> שמתייחסים לטבלה צריכים להיבדק — לפעמים שינוי טיפוס שובר אותם בלי שגיאת compile עד הריצה.</li>

  c.innerHTML = html;

// Pretty-print a CREATE TABLE / CREATE VIEW that arrived as one long line
// from MySQL. Already-multiline input is returned untouched. The output is
// the canonical form we store in sqlScripts so copy/download/highlight all
// share it.
function formatSql(sql) {
  if (!sql) return sql;
  if (sql.includes('\n')) return sql;

  // Protect quoted identifiers and string literals so the keyword regexes
  // and the comma-walker don't misinterpret content inside them.
  const tokens = [];
  let s = sql.replace(/`[^`]*`|'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"/g, (m) => {
    tokens.push(m);
    return `\x00${tokens.length - 1}\x00`;
  });

  const isView  = /^\s*CREATE\s+(OR\s+REPLACE\s+)?(ALGORITHM\s*=\s*\w+\s+)?(DEFINER\s*=\s*\S+\s+)?(SQL\s+SECURITY\s+\w+\s+)?VIEW\b/i.test(s);
  const isTable = /^\s*CREATE\s+TABLE\b/i.test(s);
  const isAlter = /^\s*ALTER\s+(ALGORITHM\s*=\s*\w+\s+)?(DEFINER\s*=\s*\S+\s+)?(SQL\s+SECURITY\s+\w+\s+)?VIEW\b/i.test(s);

  if (isView || isAlter) {
    s = formatViewSql(s);
  } else if (isTable) {
    s = formatTableSql(s);
  }

  // Restore protected tokens
  s = s.replace(/\x00(\d+)\x00/g, (_, i) => tokens[+i]);
  return s;
}

function formatViewSql(s) {
  // Major clause breaks
  s = s.replace(/\s+AS\s+select\s+/i, ' AS\nSELECT\n  ');
  s = s.replace(/\s+from\s+/i, '\nFROM ');
  s = s.replace(/\s+left\s+join\s+/gi,  '\n  LEFT JOIN ');
  s = s.replace(/\s+right\s+join\s+/gi, '\n  RIGHT JOIN ');
  s = s.replace(/\s+inner\s+join\s+/gi, '\n  INNER JOIN ');
  s = s.replace(/\s+cross\s+join\s+/gi, '\n  CROSS JOIN ');
  s = s.replace(/\s+on\s*\(/gi, '\n    ON (');
  s = s.replace(/\s+where\s+/gi, '\nWHERE ');
  s = s.replace(/\s+group\s+by\s+/gi, '\nGROUP BY ');
  s = s.replace(/\s+having\s+/gi, '\nHAVING ');
  s = s.replace(/\s+order\s+by\s+/gi, '\nORDER BY ');
  s = s.replace(/\s+limit\s+/gi, '\nLIMIT ');
  // Boolean connectors only when at start of a join/where condition - we
  // keep this gentle to avoid mangling AND inside expressions.
  s = s.replace(/\s+and\s+/gi, '\n  AND ');
  s = s.replace(/\s+or\s+/gi, '\n  OR ');

  // Break the SELECT list commas (only top-level ones, before FROM)
  s = breakTopLevelCommasUntil(s, '\nFROM ', '  ');

  return s;
}

function formatTableSql(s) {
  // Find the first matching paren pair and break inside it
  let firstOpen = -1, depth = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '(') {
      if (firstOpen === -1) firstOpen = i;
      depth++;
    } else if (s[i] === ')') {
      depth--;
      if (depth === 0 && firstOpen !== -1) {
        const before = s.slice(0, firstOpen);
        const inner  = s.slice(firstOpen + 1, i);
        const after  = s.slice(i + 1);
        const formatted = breakTopLevelCommas(inner, '  ').trim();
        s = before.replace(/\s+$/, '') + ' (\n  ' + formatted + '\n)' + after;
        break;
      }
    }
  }

  // Newline before table options (ENGINE=, DEFAULT, etc.)
  s = s.replace(/\)\s+ENGINE/i, ')\n  ENGINE');
  s = s.replace(/\s+DEFAULT\s+CHARSET=/i, '\n  DEFAULT CHARSET=');
  s = s.replace(/\s+COLLATE=/i, '\n  COLLATE=');
  s = s.replace(/\s+ROW_FORMAT=/i, '\n  ROW_FORMAT=');
  s = s.replace(/\s+COMMENT=/i, '\n  COMMENT=');

  return s;
}

// Break top-level commas (depth 0 only) onto new lines with the given indent.
function breakTopLevelCommas(s, indent) {
  let out = '', depth = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(') depth++;
    else if (c === ')') depth--;
    if (c === ',' && depth === 0) {
      out += ',\n' + indent;
      while (i + 1 < s.length && /\s/.test(s[i + 1])) i++;
    } else {
      out += c;
    }
  }
  return out;
}

// Same as above but only for the prefix of `s` before the first occurrence
// of `terminator`. Used so we break commas in the SELECT list but leave the
// FROM/ON commas untouched (they're inside join expressions).
function breakTopLevelCommasUntil(s, terminator, indent) {
  const idx = s.indexOf(terminator);
  if (idx < 0) return breakTopLevelCommas(s, indent);
  return breakTopLevelCommas(s.slice(0, idx), indent) + s.slice(idx);
}

function highlightSql(sql) {
  const keywords = ['CREATE', 'TABLE', 'VIEW', 'IF', 'NOT', 'EXISTS', 'AS', 'SELECT', 'FROM',
    'PRIMARY', 'KEY', 'FOREIGN', 'REFERENCES', 'UNIQUE', 'INDEX', 'CONSTRAINT',
    'DEFAULT', 'NULL', 'AUTO_INCREMENT', 'ON', 'UPDATE', 'DELETE', 'CASCADE',
    'SET', 'NO', 'ACTION', 'RESTRICT', 'USING', 'ENGINE', 'CHARSET', 'COLLATE',
    'UNSIGNED', 'CHECK', 'COMMENT', 'WHERE', 'AND', 'OR', 'JOIN', 'INNER', 'LEFT', 'RIGHT'];
  const types = ['INT', 'BIGINT', 'SMALLINT', 'TINYINT', 'MEDIUMINT', 'VARCHAR', 'CHAR',
    'TEXT', 'LONGTEXT', 'MEDIUMTEXT', 'TINYTEXT', 'DATE', 'DATETIME', 'TIMESTAMP',
    'TIME', 'YEAR', 'DECIMAL', 'NUMERIC', 'FLOAT', 'DOUBLE', 'BOOLEAN', 'BOOL',
    'BLOB', 'LONGBLOB', 'JSON', 'ENUM', 'SET', 'BINARY', 'VARBINARY'];

  let out = escapeHtml(sql);

  // Strings first (to avoid coloring keywords inside strings)
  out = out.replace(/&#39;([^&]*?)&#39;/g, m => `<span class="sql-str">${m}</span>`);
  out = out.replace(/&quot;([^&]*?)&quot;/g, m => `<span class="sql-str">${m}</span>`);

  // Numbers
  out = out.replace(/\b(\d+)\b/g, '<span class="sql-num">$1</span>');

  // Keywords
  keywords.forEach(k => {
    out = out.replace(new RegExp('\\b' + k + '\\b', 'g'), `<span class="sql-kw">${k}</span>`);
  });

  // Types
  types.forEach(t => {
    out = out.replace(new RegExp('\\b' + t + '\\b', 'gi'), m => `<span class="sql-type">${m}</span>`);
  });

  return out;
}

function downloadFile(content, filename, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function renderExportTab(c) {
  const item = state.currentItem;
  if (!item) return;

  c.innerHTML = `
    <div class="section-card">
      <h3>📤 ייצוא ל-JSON</h3>
      <p style="color:#666;font-size:0.9rem;margin-bottom:16px">
        בחרו איזה מידע לייצא מ-<strong>${escapeHtml(item.name)}</strong>
      </p>

      <div class="export-option" data-type="structure">
        <div class="opt-title">🏗️ מבנה בלבד</div>
        <div class="opt-desc">עמודות, סוגים, אינדקסים, מפתחות זרים וטריגרים - ללא תוכן</div>
      </div>

      <div class="export-option" data-type="data">
        <div class="opt-title">📊 תוכן בלבד</div>
        <div class="opt-desc">כל השורות של הטבלה כמערך JSON</div>
      </div>

      <div class="export-option" data-type="both">
        <div class="opt-title">📦 מבנה + תוכן</div>
        <div class="opt-desc">חבילה מלאה - מבנה הטבלה יחד עם כל הנתונים</div>
      </div>

      <div id="exportOptionsPanel" style="display:none"></div>

      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn btn-primary" id="doExportBtn" disabled>⬇️ ייצא והורד</button>
        <button class="btn btn-secondary" id="previewExportBtn" disabled>👁️ תצוגה מקדימה</button>
      </div>

      <div id="exportPreview" style="margin-top:20px;display:none"></div>
    </div>`;

  let selectedType = null;
  let includeViewColumns = false;
  let selectedViews = new Set();
  let availableViews = [];

  c.querySelectorAll('.export-option').forEach(opt => {
    opt.addEventListener('click', () => {
      c.querySelectorAll('.export-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedType = opt.dataset.type;
      $('doExportBtn').disabled = false;
      $('previewExportBtn').disabled = false;
      showExportOptions();
    });
  });

  async function showExportOptions() {
    const panel = $('exportOptionsPanel');

    if (selectedType === 'structure') {
      panel.style.display = 'none';
      return;
    }

    // For data/both - ask about view columns
    panel.style.display = 'block';
    panel.className = 'export-options-panel';
    panel.innerHTML = `
      <div style="font-weight:600;margin-bottom:10px">🔧 אפשרויות נוספות:</div>
      <label class="checkbox-group">
        <input type="checkbox" id="includeViewsChk">
        <span>כלול גם עמודות מתוך תצוגות (Views) שקשורות לטבלה זו</span>
      </label>
      <div id="viewsListContainer" style="margin-top:10px;display:none"></div>`;

    const chk = $('includeViewsChk');
    chk.addEventListener('change', async () => {
      includeViewColumns = chk.checked;
      const viewsContainer = $('viewsListContainer');

      if (includeViewColumns) {
        viewsContainer.style.display = 'block';
        viewsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><span>מחפש תצוגות קשורות...</span></div>';

        try {
          if (item.type === 'view') {
            // If we're on a view, there's nothing extra to find
            viewsContainer.innerHTML = '<div class="empty-state">הפריט הנוכחי הוא כבר תצוגה (View)</div>';
          } else {
            const res = await api('get_table_views', { table: item.name });
            availableViews = res.views || [];

            if (availableViews.length === 0) {
              viewsContainer.innerHTML = '<div class="empty-state">🔍 לא נמצאו תצוגות המשתמשות בטבלה זו</div>';
            } else {
              viewsContainer.innerHTML = `
                <div style="font-size:0.85rem;color:#666;margin-bottom:8px">נמצאו ${availableViews.length} תצוגות - בחרו מהן להכליל:</div>
                ${availableViews.map(v => `
                  <label class="view-item">
                    <input type="checkbox" class="view-chk" data-name="${escapeHtml(v.name)}">
                    <span>👁️ <strong>${escapeHtml(v.name)}</strong></span>
                    <span style="color:#888;margin-right:auto;font-size:0.78rem">${v.columns.length} עמודות</span>
                  </label>
                `).join('')}`;

              viewsContainer.querySelectorAll('.view-chk').forEach(ch => {
                ch.addEventListener('change', () => {
                  if (ch.checked) selectedViews.add(ch.dataset.name);
                  else selectedViews.delete(ch.dataset.name);
                });
              });
            }
          }
        } catch (err) {
          viewsContainer.innerHTML = `<div class="empty-state">❌ שגיאה: ${escapeHtml(err.message)}</div>`;
        }
      } else {
        viewsContainer.style.display = 'none';
        selectedViews.clear();
      }
    });
  }

  async function buildExport() {
    const out = {
      database: state.conn.database,
      [item.type]: item.name,
      exportedAt: new Date().toISOString()
    };

    if (selectedType === 'structure' || selectedType === 'both') {
      let struct = state.tableCache[item.name].structure;
      if (!struct) {
        struct = await api('get_table_structure', { table: item.name });
        state.tableCache[item.name].structure = struct;
      }
      out.structure = {
        columns: struct.columns,
        indexes: struct.indexes,
        foreignKeys: struct.foreignKeys,
        triggers: struct.triggers,
        tableInfo: struct.tableInfo
      };
      // include create-table
      try {
        const sqlRes = await api('get_create_table', { table: item.name });
        out.structure.createStatement = sqlRes.sql;
      } catch (e) { /* ignore */ }
    }

    if (selectedType === 'data' || selectedType === 'both') {
      const action = item.type === 'view' ? 'get_full_view_data' : 'get_full_table_data';
      const params = item.type === 'view' ? { view: item.name } : { table: item.name };
      const dataRes = await api(action, params);
      out.data = dataRes.rows;

      if (includeViewColumns && selectedViews.size > 0) {
        out.relatedViews = {};
        for (const viewName of selectedViews) {
          try {
            const vd = await api('get_full_view_data', { view: viewName });
            out.relatedViews[viewName] = vd.rows;
          } catch (e) {
            out.relatedViews[viewName] = { error: e.message };
          }
        }
      }
    }

    return out;
  }

  $('doExportBtn').addEventListener('click', async () => {
    const btn = $('doExportBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div>';
    try {
      const exp = await buildExport();
      const json = JSON.stringify(exp, null, 2);
      const fname = item.name + '_' + selectedType + '_' + new Date().toISOString().slice(0, 10) + '.json';
      downloadFile(json, fname, 'application/json');
      toast('✅ הקובץ הורד', 'success');
    } catch (err) {
      console.error('[Export Error]', err);
      toast('❌ שגיאה בייצוא: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '⬇️ ייצא והורד';
    }
  });

  $('previewExportBtn').addEventListener('click', async () => {
    const preview = $('exportPreview');
    preview.style.display = 'block';
    preview.innerHTML = '<div class="loading"><div class="spinner"></div><span>מכין תצוגה מקדימה...</span></div>';
    try {
      const exp = await buildExport();
      const json = JSON.stringify(exp, null, 2);
      const trimmed = json.length > 50000 ? json.slice(0, 50000) + '\n\n... (נקטע לתצוגה - השתמשו בהורדה לקובץ המלא)' : json;
      preview.innerHTML = `
        <div class="code-block">
          <div class="code-actions">
            <button id="copyJsonBtn">📋 העתק</button>
          </div>
          <pre>${escapeHtml(trimmed)}</pre>
        </div>`;
      $('copyJsonBtn').addEventListener('click', async () => {
        await navigator.clipboard.writeText(json);
        const b = $('copyJsonBtn');
        b.textContent = '✅ הועתק'; b.classList.add('copied');
        setTimeout(() => { b.textContent = '📋 העתק'; b.classList.remove('copied'); }, 2000);
      });
    } catch (err) {
      preview.innerHTML = `<div class="empty-state">❌ ${escapeHtml(err.message)}</div>`;
    }
  });
}
</script>
