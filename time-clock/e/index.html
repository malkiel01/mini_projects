<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2d4a8a">
<meta name="referrer" content="no-referrer">
<title>שעון נוכחות</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/month.js" defer></script>
<script src="../assets/js/emp.js" defer></script>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="back" aria-label="חזרה" hidden>→</button>
  <div class="titles"><h1>שעון נוכחות</h1><div class="sub" id="sub"></div></div>
  <button class="icon-btn" id="month-btn" aria-label="החודש שלי" hidden>📅</button>
</header>
<main id="main" tabindex="-1"><p class="empty">טוען…</p></main>
<dialog id="sheet" aria-labelledby="sheet-title">
  <form method="dialog" novalidate>
    <header class="sheet-head">
      <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
      <h2 id="sheet-title"></h2>
      <button type="submit" class="btn primary" id="sheet-save">שליחה</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </form>
</dialog>
<div class="toast" role="status" hidden></div>
</body>
</html>
