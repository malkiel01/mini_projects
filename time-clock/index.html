<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2d4a8a">
<title>שעון נוכחות</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/month.js" defer></script>
<script src="assets/js/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>
<header class="top" id="top" hidden>
  <button class="icon-btn" id="back" aria-label="חזרה" hidden>→</button>
  <div class="titles">
    <h1 id="title">שעון נוכחות</h1>
    <button class="co-btn sub" id="co-btn" type="button" aria-label="החלפת חברה"><span class="one" id="co-name"></span><span id="co-caret" aria-hidden="true">▾</span></button>
  </div>
  <button class="icon-btn" id="settings-btn" aria-label="הגדרות החברה" hidden>⚙️</button>
</header>
<nav class="tabs" id="tabs" aria-label="מסכים" hidden>
  <a href="#/" data-tab="/">היום</a><a href="#/employees" data-tab="/employees">עובדים</a><a href="#/approvals" data-tab="/approvals">אישורים <small id="appr-n"></small></a><a href="#/month" data-tab="/month">חודש</a>
</nav>
<main id="main" tabindex="-1"><p class="empty">טוען…</p></main>

<!-- גיליון כללי: התוכן נבנה ב-JS לכל עריכה -->
<dialog id="sheet" aria-labelledby="sheet-title">
  <form method="dialog" novalidate>
    <header class="sheet-head">
      <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
      <h2 id="sheet-title"></h2>
      <button type="submit" class="btn primary" id="sheet-save">שמירה</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </form>
</dialog>
<div class="toast" role="status" hidden></div>
</body>
</html>
