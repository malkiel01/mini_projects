<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#2d4a8a">
  <title>וקטורי — עורך</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="editor">
  <header class="top">
    <a class="icon-btn" href="./" aria-label="חזרה לציורים">→</a>
    <div class="titles"><h1 id="doc-name" role="button" tabindex="0" title="שינוי שם">ציור</h1><div class="sub" id="doc-status">טוען…</div></div>
    <button class="icon-btn" id="file-btn" aria-label="קובץ: ייצוא וייבוא" title="ייצוא וייבוא">📁</button>
    <button class="icon-btn" id="undo" aria-label="ביטול" title="ביטול (Ctrl+Z)" disabled>↶</button>
    <button class="icon-btn" id="redo" aria-label="ביצוע מחדש" title="ביצוע מחדש (Ctrl+Shift+Z)" disabled>↷</button>
    <button class="icon-btn" id="props-btn" aria-label="מאפיינים" aria-expanded="false" aria-controls="props">🎨</button>
  </header>

  <div class="work">
    <nav class="tools" aria-label="כלים">
      <button class="tool" data-tool="select" aria-pressed="true" title="בחירה (V)" aria-label="בחירה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1L15 19l-2.5 1-2.5-6L6 17z"/></svg></button>
      <button class="tool" data-tool="node" aria-pressed="false" title="עריכת נקודות (A)" aria-label="עריכת נקודות">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1L15 19l-2.5 1-2.5-6L6 17z" class="hollow"/></svg></button>
      <button class="tool" data-tool="pen" aria-pressed="false" title="עט (P)" aria-label="עט">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 9-3 7h-4l-3-7z"/><circle cx="12" cy="11" r="1.4"/><path d="M10 19h4"/></svg></button>
      <button class="tool more" data-tool="shape" aria-pressed="false" aria-haspopup="true" aria-expanded="false" title="צורות" aria-label="צורות: מלבן">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="shape-icon"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button class="tool" data-tool="text" aria-pressed="false" title="טקסט (T)" aria-label="טקסט">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <div class="shape-pick" id="shape-pick" role="menu" hidden>
        <button role="menuitem" data-shape="rect" title="מלבן (M)" aria-label="מלבן"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
        <button role="menuitem" data-shape="ellipse" title="אליפסה (L)" aria-label="אליפסה"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
        <button role="menuitem" data-shape="polygon" title="מצולע" aria-label="מצולע"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 5v8l-8 5-8-5V8z"/></svg></button>
        <button role="menuitem" data-shape="star" title="כוכב" aria-label="כוכב"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></button>
        <button role="menuitem" data-shape="line" title="קו (\\)" aria-label="קו"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5" fill="none"/></svg></button>
      </div>
    </nav>

    <div class="stage" id="stage">
      <canvas id="canvas" aria-label="לוח העבודה" role="img"></canvas>
      <textarea id="text-edit" class="text-edit" dir="rtl" hidden aria-label="עריכת טקסט" spellcheck="false"></textarea>
      <div class="pen-bar" id="pen-bar" hidden>
        <button class="btn sm ghost" id="pen-done" hidden>✓ סיום</button>
        <button class="btn sm ghost" id="pen-cancel" hidden>✕ ביטול</button>
        <button class="btn sm ghost" id="node-smooth" hidden>חלקה ↔ פינה</button>
        <button class="btn sm ghost danger" id="node-del" hidden>🗑️ נקודה</button>
        <span class="muted pen-hint" id="pen-hint"></span>
      </div>
      <div class="zoom" role="group" aria-label="זום">
        <button class="icon-btn" id="zoom-out" aria-label="הקטנה">−</button>
        <button class="btn sm" id="zoom-pct" aria-label="התאמה למסך">100%</button>
        <button class="icon-btn" id="zoom-in" aria-label="הגדלה">+</button>
        <button class="icon-btn toggle" id="snap-btn" aria-pressed="true" aria-label="הצמדה לאובייקטים וללוח" title="הצמדה (Ctrl בזמן גרירה — בלי)">🧲</button>
        <button class="icon-btn toggle" id="grid-btn" aria-pressed="false" aria-label="רשת" title="רשת 10pt">#</button>
      </div>
    </div>

    <aside class="props" id="props" aria-label="מאפיינים">
      <div class="seg-tabs" role="tablist">
        <button role="tab" type="button" data-tab="props" aria-selected="true">🎨 מאפיינים</button>
        <button role="tab" type="button" data-tab="layers" aria-selected="false">🗂️ שכבות</button>
      </div>
      <div id="props-body"></div>
      <div id="layers-body" hidden></div>
    </aside>
  </div>

  <dialog id="file-dlg" aria-labelledby="file-title">
    <form method="dialog" novalidate>
      <header class="sheet-head">
        <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
        <h2 id="file-title">קובץ</h2>
      </header>
      <div class="sheet-body">
        <section class="group" aria-labelledby="exp-title">
          <h3 id="exp-title">ייצוא</h3>
          <label class="f" id="exp-board-wrap" hidden><span>לוח</span><select id="exp-board"></select></label>
          <div class="tiles">
            <button class="tile" type="button" data-export="mbe"><span class="tile-ic" aria-hidden="true">📦</span><span>‎.mbe <small class="muted">לכל החבילה</small></span></button>
            <button class="tile" type="button" data-export="svg"><span class="tile-ic" aria-hidden="true">🖋️</span>SVG</button>
            <button class="tile" type="button" data-export="pdf"><span class="tile-ic" aria-hidden="true">📄</span><span>PDF <small class="muted" id="pdf-note"></small></span></button>
            <button class="tile" type="button" data-export="png"><span class="tile-ic" aria-hidden="true">🖼️</span>PNG</button>
          </div>
          <div class="fields two">
            <fieldset class="seg" aria-label="גודל PNG">
              <label><input type="radio" name="png-scale" value="1"><span>×1</span></label>
              <label><input type="radio" name="png-scale" value="2" checked><span>×2</span></label>
              <label><input type="radio" name="png-scale" value="4"><span>×4</span></label>
            </fieldset>
            <fieldset class="seg" aria-label="רקע PNG">
              <label><input type="radio" name="png-bg" value="1" checked><span>רקע לבן</span></label>
              <label><input type="radio" name="png-bg" value="0"><span>שקוף</span></label>
            </fieldset>
          </div>
          <p class="hint" id="exp-note">טקסט יוצא כקווי מתאר — נראה זהה בכל מקום, אבל אי אפשר לערוך אותו בקובץ שיוצא.</p>
        </section>
        <section class="group" aria-labelledby="imp-title">
          <h3 id="imp-title">ייבוא</h3>
          <div class="tiles">
            <button class="tile" type="button" id="imp-svg"><span class="tile-ic" aria-hidden="true">📥</span>SVG לתוך הציור</button>
            <button class="tile" type="button" id="open-mbe"><span class="tile-ic" aria-hidden="true">📂</span>פתיחת ‎.mbe</button>
          </div>
          <input type="file" id="imp-file" accept=".svg,image/svg+xml" hidden>
          <input type="file" id="mbe-file" accept=".mbe,application/vnd.mbe+zip" hidden>
        </section>
        <section class="group" aria-labelledby="ver-title">
          <h3 id="ver-title">גרסאות קודמות <small>נשמרת גרסה כל 10 דקות של עבודה</small></h3>
          <ul class="list" id="versions"></ul>
        </section>
        <p class="error" role="alert" id="file-err" hidden></p>
      </div>
    </form>
  </dialog>

  <div class="toast" role="status" hidden></div>
  <script type="module" src="assets/js/editor.js"></script>
</body>
</html>
