<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#2d4a8a">
  <title>וקטורי</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="assets/css/ui-core/ui.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip" href="#main">דילוג לתוכן</a>
  <header class="top">
    <div class="titles"><h1>וקטורי</h1><div class="sub">לוגואים, אייקונים ואיורים</div></div>
    <span class="avatar me" id="me" hidden></span>
  </header>
  <main id="main" tabindex="-1">
    <div class="state" id="loading"><p class="muted">טוען…</p></div>

    <section id="home" hidden>
      <div class="toolbar">
        <h2 class="sec-title" style="flex:1;margin:0">הציורים שלי</h2>
        <button class="btn ghost" id="open-btn" type="button" title="פתיחת קובץ ‎.mbe מהמכשיר"><span aria-hidden="true">📂</span> פתיחה</button>
        <input type="file" id="open-file" accept=".mbe,application/vnd.mbe+zip" hidden>
        <button class="btn primary" id="new-btn" type="button"><span aria-hidden="true">+</span> ציור חדש</button>
      </div>
      <p class="hint">הציורים נשמרים בספרייה בשרת, אוטומטית. קובץ ‎.mbe (לכל החבילה), SVG, PDF ו-PNG — מתוך הציור (📁).</p>
      <p class="error" role="alert" id="open-err" hidden></p>
      <ul class="list" id="drafts"></ul>
    </section>

    <div class="state" id="denied" hidden>
      <p class="error" role="alert" id="denied-msg"></p>
    </div>
  </main>
  <dialog id="new-dlg" aria-labelledby="new-title">
    <form method="dialog" novalidate>
      <header class="sheet-head">
        <button type="button" class="icon-btn" data-close aria-label="סגירה">✕</button>
        <h2 id="new-title">ציור חדש</h2>
      </header>
      <div class="sheet-body">
        <p class="hint">גודל לוח העבודה. אפשר לשנות אחר כך.</p>
        <div class="tiles" id="sizes"></div>
        <section class="group" aria-labelledby="custom-title">
          <h3 id="custom-title">גודל אחר <small>בנקודות (pt)</small></h3>
          <div class="fields two">
            <label class="f"><span>רוחב</span><input id="cw" inputmode="decimal" dir="ltr" value="800"></label>
            <label class="f"><span>גובה</span><input id="ch" inputmode="decimal" dir="ltr" value="600"></label>
          </div>
          <button class="btn ghost" type="button" id="custom-go">יצירה בגודל הזה</button>
        </section>
      </div>
    </form>
  </dialog>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
