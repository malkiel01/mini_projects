<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מטלות לקלוד</title>
<meta name="description" content="ניהול מטלות ל-Claude: קטלוג לפי נושאים, מעקב אחרי מה פתוח, ומענה לשאלות שנשארו תלויות.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<!-- ── מסך כניסה ─────────────────────────────────────────────── -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="gateForm">
    <h1 id="gateTitle">מטלות לקלוד</h1>
    <p class="gate__sub" id="gateSub">התחברות</p>

    <label class="field">
      <span>שם משתמש</span>
      <input type="text" id="gUser" autocomplete="username" dir="ltr" required>
    </label>
    <label class="field">
      <span>סיסמה</span>
      <input type="password" id="gPass" autocomplete="current-password" required>
    </label>
    <label class="field" id="gNameWrap" hidden>
      <span>שם לתצוגה</span>
      <input type="text" id="gName" autocomplete="name">
    </label>

    <button type="submit" class="btn btn--primary btn--wide" id="gSubmit">כניסה</button>
    <p class="gate__err" id="gateErr" hidden></p>
  </form>
</div>

<!-- ── האפליקציה ─────────────────────────────────────────────── -->
<div class="app" id="app" hidden>

  <header class="bar">
    <button type="button" class="icon-btn bar__menu" id="menuBtn" title="נושאים">☰</button>
    <div class="bar__title">
      <h1>מטלות לקלוד</h1>
      <p id="scopeLabel">כל הנושאים</p>
    </div>
    <button type="button" class="icon-btn" id="settingsBtn" title="הגדרות">⚙</button>
    <button type="button" class="icon-btn" id="logoutBtn" title="יציאה">⎋</button>
  </header>

  <!-- שורת המצב: מה פתוח, ומה מחכה דווקא לי -->
  <section class="pulse" id="pulse"></section>

  <!-- קליטה מהירה: זו הפעולה שקורית הכי הרבה -->
  <form class="capture" id="captureForm">
    <input type="text" id="capTitle" placeholder="מה צריך לעשות? (Enter כדי להוסיף)" autocomplete="off">
    <select id="capTopic" title="נושא"></select>
    <select id="capKind" title="סוג">
      <option value="question">שאלה</option>
      <option value="code">קוד</option>
      <option value="research">מחקר</option>
    </select>
    <select id="capPriority" title="עדיפות">
      <option value="normal">רגיל</option>
      <option value="high">דחוף</option>
      <option value="low">נמוך</option>
    </select>
    <button type="submit" class="btn btn--primary">הוספה</button>
  </form>

  <div class="toolbar">
    <input type="search" id="search" placeholder="חיפוש במטלות…" autocomplete="off">
    <div class="chips" id="statusChips">
      <button type="button" class="chip is-active" data-status="active">פעילות</button>
      <button type="button" class="chip" data-status="blocked">ממתין לי</button>
      <button type="button" class="chip" data-status="in_progress">בעבודה</button>
      <button type="button" class="chip" data-status="open">בתור</button>
      <button type="button" class="chip" data-status="done">הושלמו</button>
    </div>
  </div>

  <main class="list" id="list" aria-live="polite"></main>
  <p class="empty" id="empty" hidden></p>
</div>

<!-- ── מגירת נושאים ──────────────────────────────────────────── -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__panel">
    <header class="drawer__head">
      <h2>נושאים</h2>
      <button type="button" class="icon-btn" data-close="drawer">✕</button>
    </header>
    <nav class="topics" id="topics"></nav>
    <form class="drawer__add" id="topicForm">
      <input type="text" id="topicName" placeholder="נושא חדש" required>
      <input type="text" id="topicRepo" placeholder="ריפו (אופציונלי)" dir="ltr">
      <button type="submit" class="btn btn--ghost">הוספה</button>
    </form>
  </div>
</div>

<!-- ── פרטי מטלה ─────────────────────────────────────────────── -->
<dialog class="sheet" id="detail">
  <div class="sheet__inner">
    <header class="sheet__head">
      <h2 id="dTitle">מטלה</h2>
      <button type="button" class="icon-btn" data-close="detail">✕</button>
    </header>
    <div class="sheet__body">
      <div class="dmeta" id="dMeta"></div>
      <p class="dbody" id="dBody"></p>
      <h3>שיחה</h3>
      <div class="thread" id="dThread"></div>
      <form class="reply" id="replyForm">
        <textarea id="replyBody" rows="3" placeholder="תשובה או הערה…"></textarea>
        <div class="reply__row">
          <button type="submit" class="btn btn--primary">שליחה</button>
          <button type="button" class="btn btn--ghost" id="dDone">סימון כהושלמה</button>
        </div>
      </form>
    </div>
  </div>
</dialog>

<!-- ── הגדרות ────────────────────────────────────────────────── -->
<dialog class="sheet" id="settings">
  <div class="sheet__inner">
    <header class="sheet__head">
      <h2>הגדרות</h2>
      <button type="button" class="icon-btn" data-close="settings">✕</button>
    </header>
    <div class="sheet__body">
      <h3>חיבור Claude</h3>
      <p class="hint">
        זה האסימון שמאפשר לסשן Claude או ל‑cron בשרת למשוך מטלות ולכתוב חזרה.
        מי שמחזיק בו יכול למשוך ולסגור מטלות — אל תשתפו אותו בצ׳אט פתוח.
      </p>
      <div class="token" id="tokenRow">
        <code id="tokenValue">••••••••</code>
        <button type="button" class="btn btn--ghost" id="tokenShow">הצגה</button>
      </div>

      <hr>
      <h3>משתמש חדש</h3>
      <p class="hint" id="adminOnly" hidden>רק מנהל יכול להוסיף משתמשים.</p>
      <form class="stack" id="userForm">
        <label class="field"><span>שם משתמש</span><input type="text" id="nUser" dir="ltr"></label>
        <label class="field"><span>סיסמה</span><input type="password" id="nPass"></label>
        <label class="field"><span>שם לתצוגה</span><input type="text" id="nName"></label>
        <button type="submit" class="btn btn--ghost">יצירה</button>
      </form>
    </div>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
