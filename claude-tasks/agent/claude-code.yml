# מנוע Claude Code של לוח המטלות (שלב 10, claude-tasks/docs/spec.md §11).
#
# מנוע שני, לצד claude-agent.yml (run.mjs) — לא במקומו. הלוח מתקין אותו בריפו
# שהפרויקט שלו בחר "🤖 Claude Code", ומפעיל אותו (workflow_dispatch) עם הטוקן של
# מי שלחץ "הרצה". Claude Code עובד על הריפו המלא — עם ה-CLAUDE.md, הסקילים
# (.claude/skills) וה-settings.json שלו — ומול הלוח בסקיל claude-tasks-worker.
#
# רק PR, לעולם לא פריסה:
#   - הרשאות: contents + pull-requests בלבד, בלי actions.
#   - פקודות מיזוג והפעלת workflows — חסומות ל-Claude (‏--disallowedTools).
#   - hook של git חוסם push לענף הבסיס; push עם GITHUB_TOKEN ממילא לא מפעיל את deploy.yml.
#
# העלות (total_cost_usd מהדוח של Claude Code) נרשמת בלוח כ-develop, במכסה של מי שהריץ.
#
# הקובץ מנוהל אוטומטית. שינוי ידני יידרס בהתקנה הבאה.
#
# סודות שהלוח מתקין בריפו:
#   AGENT_BOARD_TOKEN  אסימון עובד של הפרויקט הזה בלבד
#   ANTHROPIC_API_KEY  מפתח Anthropic של מי שהתקין את המנוע

name: Claude Code agent

on:
  workflow_dispatch:
    inputs:
      task_id:     { description: 'מזהה המטלה בלוח', required: true }
      board_url:   { description: 'כתובת ה-API של הלוח', required: true }
      model:       { description: 'מודל (ריק — ברירת המחדל של Claude Code)', required: false, default: '' }
      base_branch: { description: 'הענף שממנו יוצאים', required: false, default: '' }

concurrency:
  group: claude-code-${{ github.event.inputs.task_id }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      BOARD_URL:   ${{ github.event.inputs.board_url }}
      BOARD_TOKEN: ${{ secrets.AGENT_BOARD_TOKEN }}
      TASK_ID:     ${{ github.event.inputs.task_id }}
      MODEL:       ${{ github.event.inputs.model }}
      BASE_BRANCH: ${{ github.event.inputs.base_branch || github.event.repository.default_branch }}
      RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.base_branch || github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # רשת ביטחון: גם אם Claude ינסה — push לענף הבסיס נכשל כאן
      - name: Guard — branch and PR only
        run: |
          cat > .git/hooks/pre-push <<EOF
          #!/bin/sh
          while read local_ref local_sha remote_ref remote_sha; do
            if [ "\$remote_ref" = "refs/heads/${BASE_BRANCH}" ]; then
              echo "push ל-${BASE_BRANCH} חסום: המנוע רק פותח PR" >&2
              exit 1
            fi
          done
          EOF
          chmod +x .git/hooks/pre-push
          git config user.name  'claude-tasks agent'
          git config user.email 'agent@users.noreply.github.com'

      # שער המדיניות של הלוח (§5.13): PreToolUse על כל כלי. פעולה ממופה — לפי המדיניות של הפרויקט;
      # "לשאול" → ask-approval על המטלה, והכלי נדחה. הלוח לא עונה → נדחה (אין כאן אדם).
      - name: Policy gate
        run: |
          mkdir -p .claude
          f=.claude/settings.local.json
          [ -f "$f" ] || echo '{}' > "$f"
          jq '.hooks.PreToolUse = ([{"matcher": ".*", "hooks": [{"type": "command", "timeout": 620,
                "command": "bash \"$CLAUDE_PROJECT_DIR/.github/claude-agent/hook-gate.sh\"; exit 0"}]}] + (.hooks.PreToolUse // []))' \
             "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          chmod +x .github/claude-agent/hook-gate.sh

      - name: Work the task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:          ${{ github.token }}
          CT_GATE_KIND:      platform
          CLAUDE_TASKS_URL:  ${{ github.event.inputs.board_url }}
        run: |
          PROMPT=$(cat <<EOF
          You are running unattended in GitHub Actions on task #${TASK_ID} of the "מטלות לקלוד" board.
          Follow this repository's CLAUDE.md and the claude-tasks-worker skill (.claude/skills/claude-tasks-worker/SKILL.md).

          Board API: POST ${BOARD_URL}?action=<action> with a JSON body and these headers:
            X-Worker-Token: \$BOARD_TOKEN (environment variable — never print it)
            X-Worker-Name: claude-code
            X-Worker-Route: platform
            Cookie: humans_21909=1
            Content-Type: application/json

          1. POST start {"id": ${TASK_ID}, "run_url": "${RUN_URL}"} — read the task and its notes. Work on THIS task only.
          2. Do the work on a new branch agent/task-${TASK_ID} from ${BASE_BRANCH}. Run the project's own checks.
          3. Commit, push the branch, and open a PR with: gh pr create --base ${BASE_BRANCH} --head agent/task-${TASK_ID}
             Never merge, never push to ${BASE_BRANCH}, never run or dispatch workflows.
          4. POST complete {"id": ${TASK_ID}, "result": "<what you did>", "pr_url": "<the PR>", "session_url": "${RUN_URL}"}.
             If a human decision is needed: POST block {"id": ${TASK_ID}, "question": "..."}.
             Before a sensitive action, ask the policy and, if needed, ask-approval — as the skill says.
             The board's policy gate checks every tool call. If a tool is denied with "נשלח לאישור", the task is
             already waiting for approval: stop the run there — do not try another way and do not call block.
          EOF
          )
          claude -p "$PROMPT" ${MODEL:+--model "$MODEL"} \
            --output-format json --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --disallowedTools "Bash(gh pr merge:*),Bash(gh workflow:*),Bash(gh run:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --no-verify:*)" \
            > claude-result.json || true

      # תמיד: העלות ללוח, ומטלה שנשארה פתוחה — נחסמת עם הסבר (לא נתקעת בשקט)
      - name: Report to the board
        if: always()
        run: node .github/claude-agent/finish.mjs claude-result.json
