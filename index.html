<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כלים דיגיטליים</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 { font-size: 2.2rem; margin-bottom: 8px; }
        header p { opacity: 0.8; font-size: 1.1rem; }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .project-card {
            background: white;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .project-card .icon {
            font-size: 2.4rem;
            margin-bottom: 16px;
        }
        .project-card h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .project-card p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
        }
        /* כרטיס עם כמה כניסות: הכרטיס עצמו אינו קישור, וליד כל כניסה כפתור העתקה */
        .project-card.multi:hover { transform: none; }
        .entry-links { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
        .entry-link { display: flex; gap: 8px; }
        .entry-link a {
            flex: 1;
            text-decoration: none;
            color: #1a1a2e;
            background: #f6f3ec;
            border: 1px solid #ece4d3;
            border-radius: 8px;
            padding: 10px 12px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .entry-link a:hover { background: #fdf3df; border-color: #e9b45a; }
        .entry-link button {
            border: 1px solid #ece4d3;
            background: white;
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .entry-link button.copied { background: #ddf3e5; border-color: #9fd9b4; }
        .category { margin-bottom: 40px; }
        .category h2.category-title {
            font-size: 1.15rem;
            color: #444;
            margin: 0 4px 16px;
        }
        .status { text-align: center; color: #888; padding: 40px 0; }
        .status.error { color: #b3261e; }
    </style>
</head>
<body>
    <header>
        <h1>כלים דיגיטליים</h1>
        <p>אוסף כלים שימושיים לעבודה יומיומית</p>
    </header>
    <div class="container">
        <!-- הכרטיסים נבנים מ-app.json שבכל תיקיית כלי (דרך platform/api.php).
             כלי חדש לא נוגע בקובץ הזה — ראה platform/README.md. -->
        <div id="apps"><p class="status">טוען את הכלים…</p></div>
        <noscript><p class="status error">הדף צריך JavaScript כדי להציג את הכלים.</p></noscript>
    </div>
    <script>
        const root = document.getElementById('apps');

        function el(tag, props = {}, children = []) {
            const node = Object.assign(document.createElement(tag), props);
            node.append(...children);
            return node;
        }

        // העתקת קישור ישיר לכניסה — הכתובת נבנית מהדף הנוכחי, כך שהיא נכונה בכל דומיין.
        async function copyLink(btn, href) {
            const url = new URL(href, location.href).href;
            try {
                await navigator.clipboard.writeText(url);
            } catch {
                window.prompt('העתיקו את הקישור:', url);
                return;
            }
            const label = btn.textContent;
            btn.textContent = '✓ הועתק';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = label; btn.classList.remove('copied'); }, 1800);
        }

        // כרטיס עם כמה כניסות: הכרטיס עצמו אינו קישור, וליד כל כניסה כפתור העתקה.
        function card(app) {
            const head = [
                el('div', { className: 'icon', textContent: app.icon }),
                el('h2', { textContent: app.name }),
                el('p', { textContent: app.description }),
            ];
            if (!app.links.length) {
                return el('a', { className: 'project-card', href: app.href }, head);
            }
            const links = app.links.map(link => {
                const btn = el('button', { type: 'button', textContent: '📋 העתקת קישור' });
                btn.addEventListener('click', () => copyLink(btn, link.href));
                return el('div', { className: 'entry-link' }, [
                    el('a', { href: link.href, textContent: link.label }), btn,
                ]);
            });
            return el('div', { className: 'project-card multi' }, [
                ...head, el('div', { className: 'entry-links' }, links),
            ]);
        }

        function render({ categories, apps }) {
            const sections = categories
                .map(cat => ({ cat, apps: apps.filter(a => a.category === cat.id) }))
                .filter(s => s.apps.length)
                .map(({ cat, apps }) => el('section', { className: 'category' }, [
                    el('h2', { className: 'category-title', textContent: `${cat.icon} ${cat.name}` }),
                    el('div', { className: 'projects-grid' }, apps.map(card)),
                ]));
            root.replaceChildren(...sections);
        }

        fetch('platform/api.php', { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(render)
            .catch(() => {
                root.replaceChildren(el('p', {
                    className: 'status error',
                    textContent: 'לא ניתן לטעון את רשימת הכלים. נסו לרענן את הדף.',
                }));
            });
    </script>
         }
                const label = btn.textContent;
                btn.textContent = '✓ הועתק';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = label; btn.classList.remove('copied'); }, 1800);
            });
        });
    </script>
</body>
</html>
