<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כלים דיגיטליים</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 { font-size: 2.2rem; margin-bottom: 8px; }
        header p { opacity: 0.8; font-size: 1.1rem; }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .project-card {
            background: white;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .project-card .icon {
            font-size: 2.4rem;
            margin-bottom: 16px;
        }
        .project-card h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .project-card p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>כלים דיגיטליים</h1>
        <p>אוסף כלים שימושיים לעבודה יומיומית</p>
    </header>
    <div class="container">
        <div class="projects-grid">
            <a href="data-embed-for-clients/index.html" class="project-card">
                <div class="icon">📄</div>
                <h2>הטמעת נתונים לריכוז לקוחות</h2>
                <p>העלאת תמונה, בחירת פונט ומיקום, והפקת קבצי PDF מרובים עם טקסט מותאם אישית לכל לקוח.</p>
            </a>
        </div>
    </div>
</body>
</html>
